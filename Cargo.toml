# The root package stays the app; the sync crates join as members (SYNC_PLAN.md
# §4). `default-members` keeps a bare `cargo build` or `cargo test` at the root
# building the app alone, as before the workspace existed.
[workspace]
resolver = "3"
members = [
    "crates/panic-probe",
    "crates/taskdeck-core",
    "crates/taskdeck-seal",
    "crates/taskdeck-sync",
    "crates/taskdeck-device",
    "crates/taskdeck-backup",
    "crates/taskdeck-recover",
    "crates/taskdeck-android",
]
default-members = ["."]
# A standalone package unpacked under target/ (an older build for the legacy
# fixtures, an attack round's copy of the tree) builds on its own instead of
# being claimed by this workspace. Elsewhere in the checkout a nested package
# must be a member, be excluded here, or carry its own [workspace] table.
exclude = ["target"]

# Every version the sync crates use, declared once (SYNC_PLAN.md §3.2, §3.4).
# Later stages add at most one dependency per pull request, so this table is
# what they build with. The root package does not inherit from it: its own
# [dependencies] below are unchanged.
#
# - Versions SYNC.md §2.3 and §5.1 name are exact pins (`=x.y.z`).
# - A crate that was already in Cargo.lock is declared at the version the
#   lockfile holds, so nothing existing moves.
# - `default-features = false` wherever a crate's defaults reach further than
#   the sync crates need (chrono's clock, the TLS stack, the cryptography,
#   image's formats, windows); each crate then names the features it needs in
#   its own Cargo.toml. That keeps TLS on the ring provider only:
#   rustls, ureq and the platform verifier never pull aws-lc-rs, and nothing
#   here pulls openssl, native-tls or a cmake-built crate.
[workspace.dependencies]
# The workspace crates (SYNC_PLAN.md §4).
taskdeck-core = { path = "crates/taskdeck-core" }
taskdeck-seal = { path = "crates/taskdeck-seal" }
taskdeck-sync = { path = "crates/taskdeck-sync" }
taskdeck-device = { path = "crates/taskdeck-device" }
taskdeck-backup = { path = "crates/taskdeck-backup" }

# Already in Cargo.lock: the version it holds.
serde = "1.0.228"
serde_json = "1.0.150"
flate2 = "1.1.9"
image = { version = "0.25.10", default-features = false }
tempfile = "3.27.0"
base64 = "0.22.1"
url = "2.5.8"
subtle = "2.6.1"
windows = { version = "0.62.2", default-features = false }
# SYNC.md §5.1 names zeroize 1.9.2, published 2026-11-17: inside the seven-day
# cooldown until 2026-11-24. Cargo.lock keeps the 1.9.0 it already holds; the
# lead moves it to 1.9.2 (and this line to "=1.9.2") once the cooldown has
# passed.
zeroize = "1.9"

# SYNC.md §2.3: the core and the runtime.
chrono = { version = "=0.4.45", default-features = false }
ureq = { version = "=3.5.2", default-features = false }
tungstenite = { version = "=0.30.0", default-features = false }
rustls = { version = "=0.23.46", default-features = false }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }
jni = { version = "=0.22.4", default-features = false }

# SYNC.md §5.1: one RustCrypto generation.
chacha20poly1305 = { version = "=0.11.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false }
hpke = { version = "=0.15.1", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }

# SYNC_PLAN.md §3.4: the macOS Keychain, at the version the platform verifier
# already pulls (no second one).
security-framework = { version = "3.7.0", default-features = false }

# Tests only (SYNC_PLAN.md §3.4).
proptest = "1.12.0"

[package]
name = "task_deck"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "TaskDeck"
path = "src/main.rs"
# The window is a feature, so `--no-default-features` cannot be asked to build a
# desktop app without the toolkit to draw it.
required-features = ["desk"]

# The headless host: the board, the phone view and the feed, and no window.
# For the always-on box in the cupboard; see SERVER.md.
[[bin]]
name = "taskdeck-server"
path = "src/server_main.rs"

# `desk` is the window: egui, wgpu, winit and the allocator that only `main.rs`
# installs. It is on by default, so an ordinary `cargo build` is unchanged.
#
# Turning it off (`--no-default-features --bin taskdeck-server`) drops about a
# hundred crates and, more to the point, drops `winit` — which on Android pulls
# `android-activity`, a crate that refuses to compile outside a real Android
# app. The headless server had no use for any of it and could not be built for
# a phone or a small ARM box because of it.
[features]
default = ["desk"]
desk = [
    "dep:egui",
    "dep:wgpu",
    "dep:egui-wgpu",
    "dep:winit",
    "dep:egui-winit",
    "dep:pollster",
    "dep:egui_extras",
    "dep:epaint",
    "dep:emath",
    "dep:mimalloc",
]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

egui = { version = "0.35.0", optional = true }
wgpu = { version = "29.0", optional = true }
egui-wgpu = { version = "0.35.0", optional = true }
winit = { version = "0.30.13", optional = true }
egui-winit = { version = "0.35.0", optional = true }
pollster = { version = "0.4.0", optional = true }

egui_extras = { version = "0.35.0", features = ["svg"], optional = true }

epaint = { version = "0.35.0", optional = true }
emath = { version = "0.35.0", optional = true }

# rustls rather than the default native-tls: it needs no system OpenSSL, so a
# Linux build works from a bare toolchain like the Windows and macOS ones do.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", features = ["avif"] }
# Already in the tree under `image` (via `png`); named here so the phone server
# can gzip what it serves. The page is 127 KB of text and compresses to 37.
flate2 = "1.1"
tempfile = "3.20.0"
# Installed by `main.rs` alone. Optional so the headless build does not carry a
# C allocator it never asks for — one fewer thing needing a cross-toolchain.
mimalloc = { version = "0.1.47", optional = true }
toml = "0.9.5"
toml_edit = "0.23.7"

palette = "0.7.6"
kmeans_colors = "0.7.1"

# The phone view (`phone.rs`): a small blocking HTTP server on its own thread,
# in the same shape as the weather thread — no async runtime enters the tree.
tiny_http = "0.12"
# Paints the phone link as a QR code — in Settings on the desktop, and in the
# terminal from `taskdeck-server --print-link`, so it is not desk-only. Render
# features off: the matrix is drawn as glyphs or by egui's painter, never turned
# into an image.
qrcode = { version = "0.14", default-features = false }

[build-dependencies]
embed-resource = "3.0"
chrono = "0.4"

[profile.release]
opt-level = 3          # Maximum optimization for speed
lto = "fat"            # Full link-time optimization (best performance)
codegen-units = 1      # Forces full cross-module optimization
strip = "symbols"      # Removes debug symbols (smaller binary)
panic = "unwind"       # The sync design's catch_unwind guards (SYNC.md 4.5, poison
                       # pills; the JNI entry points) need unwinding, and in a
                       # workspace this profile is global to every crate.
                       # Today's two binaries restore "any panic ends the
                       # process" with an aborting hook (src/panic_abort.rs);
                       # stage `desktop` removes or narrows that hook when the
                       # new runtime's catch_unwind guards need unwinding there.
incremental = false    # Disable incremental builds (forces full optimization)
debug = false          # No debug info in final binary

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3
debug = false
codegen-units = 16