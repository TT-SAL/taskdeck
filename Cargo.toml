[package]
name = "task_deck"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "TaskDeck"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

egui = "0.35.0"
wgpu = "29.0"
egui-wgpu = "0.35.0"
winit = "0.30.13"
egui-winit = "0.35.0"
pollster = "0.4.0"

egui_extras = { version = "0.35.0", features = ["svg"] }

epaint = "0.35.0"
emath = "0.35.0"

# rustls rather than the default native-tls: it needs no system OpenSSL, so a
# Linux build works from a bare toolchain like the Windows and macOS ones do.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = "0.25"
tempfile = "3.20.0"
rev_lines = "0.3.0"
mimalloc = "0.1.47"
toml = "0.9.5"
toml_edit = "0.23.7"

palette = "0.7.6"
kmeans_colors = "0.7.1"

[build-dependencies]
embed-resource = "3.0"
chrono = "0.4"

[profile.release]
opt-level = 3          # Maximum optimization for speed
lto = "fat"            # Full link-time optimization (best performance)
codegen-units = 1      # Forces full cross-module optimization
strip = "symbols"      # Removes debug symbols (smaller binary)
panic = "abort"        # Smaller + faster panic handling
incremental = false    # Disable incremental builds (forces full optimization)
debug = false          # No debug info in final binary

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3
debug = false
codegen-units = 16