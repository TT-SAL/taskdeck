[package]
name = "taskdeck-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "The pure board: data, log commands, deterministic apply, planner, archive, scoring (spec: docs/sync/spec/core.md)."

# CORE-GEN-005: exactly serde, serde_json and chrono outside the dev-dependencies.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# No default features, so no `clock`: the core cannot read the clock or the
# local zone (CORE-GEN-003). The zone comes in as a `Zone` value.
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
proptest = { workspace = true }
# The property tests also run under a named `TZ` with `ChronoZone(chrono::Local)`
# (core.md §18.5), so the tests get `clock`. `cargo test` and `cargo clippy
# --all-targets` then build the library with `clock` too; what keeps `Local`
# out of the library (CORE-GEN-003) is the lib-only build of ci.sh here.
chrono = { workspace = true, features = ["clock"] }
# The SHA-256 of canonical bytes in the test vectors (core.md §18).
sha2 = { workspace = true }
