[package]
name = "taskdeck-recover"
version = "0.1.0"
edition = "2024"
publish = false
description = "The offline recovery tool (spec: docs/sync/spec/seal.md §18, §21; device.md §15.8)."

[[bin]]
name = "taskdeck-recover"
path = "src/main.rs"

[dependencies]
