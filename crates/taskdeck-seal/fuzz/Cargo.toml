# Fuzz targets of taskdeck-seal (task S7; seal.md §3, SEAL-GEN-011): one per
# row of the parser table at the top of `tests/parsers/main.rs`. A crate of its
# own, with its own [workspace] table, so the root workspace does not take it.
# Its Cargo.lock started as a copy of the root's, so every crate both use is
# at the root's version. Nothing runs the fuzzers here (stage `release` does,
# nightly, with cargo-fuzz); `crates/taskdeck-seal/ci.sh` compiles them:
#   cargo check --locked --manifest-path crates/taskdeck-seal/fuzz/Cargo.toml
[package]
name = "taskdeck-seal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[features]
# The fixtures the targets mutate are built from fixed bytes (FixedEntropy),
# so a target is a function of its input alone.
default = ["test-entropy"]
test-entropy = ["taskdeck-seal/test-entropy"]

[dependencies]
# Pre-approved for tooling (SYNC_PLAN.md §3.4); the root lockfile's version.
libfuzzer-sys = "=0.4.13"
taskdeck-seal = { path = ".." }
# What the shared test helpers of `tests/common/` use, at the root's versions.
chacha20poly1305 = { version = "=0.11.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false }
hpke = { version = "=0.15.1", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
serde_json = "1.0.150"
flate2 = "1.1.9"

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "frame_header"
path = "fuzz_targets/frame_header.rs"
test = false
doc = false
bench = false

