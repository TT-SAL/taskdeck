<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskDeck">
<!-- The scaled icons, not `/icon.png`. A `rel=icon` link makes the browser
     fetch the file, and the source is 676 KB at 882x882 where this is 50 KB —
     for a picture drawn at sixteen pixels in a tab strip. The service worker's
     shell does not hold either of them, so this is a real network fetch on the
     phone it was written for. -->
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<title>TaskDeck</title>
<style>
  :root {
    --bg: #0f1113;
    /* One material, two depths. At the bottom of the luminance scale a
       boundary is drawn by an edge and a shadow, not by a ratio — the three
       greys this replaced differed by 1.08:1 and 1.11:1, which is to say they
       were one colour doing the work of three. */
    --plate: #191c21;
    --plate-2: #23272d;
    --edge: rgba(232,230,225,0.09);
    --edge-2: rgba(232,230,225,0.22);
    /* A lit hairline, so it reads on a plate and on a photograph alike. */
    --line: rgba(232,230,225,0.10);
    --text: #e8e6e1;
    --muted: #9a9891;
    --danger: #e8707d;
    --ok: #4f9a94;
    --today: #f0c36b;
    --on-today: #0f1113;
    /* The desktop's own now-line colour (`ui.rs`), instead of a second red. */
    --now: #ff785a;
    /* The spine. The monospace column's left edge is at page x = 23 in every
       view — 10px page gutter + 10px plate padding + the row's 3px accent bar
       — and content starts at 23 + 46 + 8 = 77. The masthead's day number,
       every day heading's date, every row's time and every hour label sit in
       it, so one ruled column runs from the top of the screen to the bottom of
       the scroll. `ui-monospace` is a system face and costs nothing. */
    --spine: 46px;
    /* The picture's aspect ratio, and the size both `#field` and `.mast` paint
       it at. They must use the *same explicit size*, not `cover`: `cover`
       resolves against each element's own box, and the masthead's box is 92px
       tall while the field's is the viewport — so the two copies would be
       scaled differently and the picture would break at the masthead's edge.
       `paintField` overwrites `--par` with the real ratio; the default keeps
       the shorthand valid, and an invalid one makes the whole background
       declaration invalid and the masthead transparent. The `+2px` is
       overscan: at some viewport heights the bare product rounds a pixel short
       and leaves a hairline of `--bg` at the bottom edge. */
    --par: 0.4615;
    --photo-size: max(100vw, calc(100vh * var(--par) + 2px));
    --hour: 56px;
    --gutter: 46px;
    --mono-stack: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* How wide the halo around text is. See `html.has-photo` below: the stroke
       is drawn behind the fill, so this thickens the halo and never the
       letterform. */
    --halo: 2.5px;
    --r-s: 4px;
    --r-m: 12px;
    --r-l: 18px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    /* 1 border + 6 top + 44 scrubber + 6 gap + 60 deck + 16 of keep-out below
       the buttons, so a thumb resting at the bottom edge of the screen is not
       already on one. The page's own bottom padding and the toast both sit off
       this number rather than guessing at it. */
    --bar-h: 133px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* `html` carries the ground and `body` must not. Painting order puts a
     negative-z-index positioned child *below* body's own in-flow background,
     so an opaque body would hide the field completely — a background that
     costs everything and shows nothing. */
  html { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  /* Opaque unless there is actually a picture to show. A transparent body costs
     the compositor its opaque base on every frame, and with no picture set it
     was buying nothing at all — `paintField` adds `.has-photo` when there is
     something behind to reveal. */
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  html.has-photo body { background: transparent; }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior-y: contain;
    padding-bottom: calc(var(--bar-h) + var(--safe-bottom) + 8px);
  }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* The one layer the picture lives on. `width`/`height` in `vw`/`vh` rather
     than `inset: 0`, because the masthead's `background-size` is in the same
     units and the two must not disagree about what the viewport is when
     Firefox for Android hides its toolbar.

     Never `background-attachment: fixed` (Gecko gives it its own picture-cache
     slice and it stalls against exactly that dynamic toolbar), never
     `backdrop-filter`, never `filter`, never `will-change` — a fixed element
     already has its own spatial node, so the compositor does not repaint it as
     the scroll offset changes. And never a scroll listener. */
  #field {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1; pointer-events: none;
    background:
      var(--photo, none) 50% 0 / var(--photo-size) no-repeat,
      linear-gradient(180deg, var(--wash-a, var(--bg)), var(--wash-b, var(--bg)));
  }
  #field.dim { opacity: 0.55; }

  /* ── Masthead ── */
  /* An aperture cut into the field, not a window through it.
     `#field` sits at `z-index: -1`, which paints *below* body's in-flow
     content — so a translucent masthead would reveal the scrolling list, not
     the photograph. Instead it paints the same image in its own stack, at the
     same explicit size and origin: both boxes are 100vw wide and both are
     anchored at viewport y = 0, so `50% 0` resolves identically in each and the
     picture is continuous across the masthead's bottom edge. A JPEG has no
     alpha and the size covers the box, so it stays fully opaque and nothing of
     the list can ever show through. The veil's dark lower edge is the
     separation; there is no border. */
  .mast {
    position: sticky; top: 0; z-index: 5;
    padding: calc(8px + var(--safe-top)) 14px 8px 23px;
    background:
      var(--veil, none),
      var(--photo, none) 50% 0 / var(--photo-size) no-repeat,
      linear-gradient(180deg, var(--wash-a, var(--bg)), var(--wash-b, var(--bg)));
  }
  .chip {
    min-width: 44px; height: 40px; padding: 0 14px; border-radius: 12px;
    background: var(--plate); color: var(--text); font-weight: 600;
  }
  .chip:active { background: var(--plate-2); }
  /* The day number is the headline this view never had — the largest thing on
     screen was 16px — and it sits at the head of the spine, so the ruled column
     begins in the masthead and runs to the bottom of the scroll. It is also
     what every verb in the bar acts on, which a 12px grey line used to say. */
  .date { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .daynum { flex: 0 0 var(--spine); font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--text); }
  .daynum.today { color: var(--today); }
  .dwhen { min-width: 0; }
  .dwd { font-size: 13px; font-weight: 700; color: var(--text); line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dmo { font-size: 12px; color: var(--text); line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .behindnote { color: var(--today); font-weight: 700; }
  /* An aside, not an alarm: the same muted ink as the line it sits on, and no
     weight of its own. The behind-schedule note beside it is the loud one. */
  .stalenote { color: var(--muted); font-weight: 400; opacity: 0.8; }
  /* Both views give the masthead the same height, which is what lets a mode
     change re-measure to the same number and leave the two observers alone. */
  .summary { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 38px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The line that answers the question before anything is read. Two rows of
     fixed height, because the masthead is sticky and everything below it is
     positioned from its height — a line that grew and shrank would move the
     whole list under the reader's thumb. */
  .summary.glance {
    display: grid; grid-template-columns: 10px 1fr; gap: 0 8px;
    align-items: center; margin-top: 6px; min-height: 38px;
  }
  .summary.glance .gdot {
    grid-row: 1 / span 2; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); align-self: center;
  }
  .summary.glance .gdot.hollow { background: none; border: 2px solid var(--accent); }
  .summary.glance .glead {
    font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .summary.glance .gdetail {
    font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .week { display: flex; gap: 4px; height: 44px; }
  .week button {
    flex: 1; height: 44px; border-radius: 10px; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  }
  .week button .wd { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .week button .dn { font-size: 15px; font-weight: 700; color: var(--text); }
  .week button.today .dn { color: var(--today); }
  .week button.shown { background: var(--plate); }
  .week button.shown .dn { color: var(--text); }
  .week button.shown.today .dn { color: var(--today); }
  .week button:active { background: var(--plate-2); }
  .week .dots { display: flex; gap: 3px; height: 4px; margin-top: 3px; }
  .week .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--c); display: block; }
  textarea.notes {
    width: 100%; min-height: 40vh; background: var(--plate-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; line-height: 1.4; resize: vertical;
  }
  /* Reflow moves what is unfinished. It is not reversible, so it does not live
     under a resting thumb — it lives at the top of the Tray sheet, one
     deliberate tap in, and the deck only points at it. */
  .reflow {
    width: 100%; height: 44px; padding: 0 14px; margin: 0 0 12px; border-radius: 12px;
    font-weight: 700; font-size: 14px;
    background: #2a2416; color: var(--today); border: 1px solid #4a3d1f;
  }
  .reflow:active { filter: brightness(1.2); }

  /* ── Timeline ── */
  .timeline { position: relative; margin: 6px 12px 0 8px; height: calc(var(--hour) * 24); }
  .hourline {
    position: absolute; left: 0; right: 0; height: var(--hour);
    border-top: 1px solid var(--line);
  }
  .hourline.small { opacity: 0.55; }
  .hourline span {
    position: absolute; left: 0; top: -0.6em; width: var(--gutter);
    padding-left: 4px; font-size: 12px; color: var(--muted);
  }
  .lanes { position: absolute; top: 0; bottom: 0; left: var(--gutter); right: 0; }
  .entry {
    position: absolute; border-radius: 8px; overflow: hidden;
    padding: 4px 8px; font-size: 14px; line-height: 1.25;
    border-left: 3px solid var(--accent);
    background: var(--ground);
    color: var(--text);
  }
  .entry .time { font-size: 11px; color: var(--muted); }
  .entry .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry.short { display: flex; gap: 8px; align-items: baseline; padding-top: 2px; }
  .entry.short .name { flex: 1; }
  .entry.routine {
    background: transparent; border: 1px dashed var(--accent); border-left-width: 3px;
    color: var(--muted);
  }
  .entry.routine .name::before { content: "↻ "; }
  .entry.selected { outline: 2px solid var(--text); outline-offset: 1px; }
  .entry:active { filter: brightness(1.2); }
  .entry.dragging {
    z-index: 4; opacity: 0.95; filter: brightness(1.25);
    box-shadow: 0 10px 28px rgba(0,0,0,0.55); outline: 2px solid var(--text); outline-offset: 1px;
    transition: none;
  }
  .ghost {
    position: absolute; border-radius: 8px; padding: 3px 8px;
    border: 1px solid var(--accent); background: rgba(0,0,0,0.25);
    color: var(--muted); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    pointer-events: none; opacity: 0.8;
  }
  /* Somebody else's calendar (§23). Deliberately unlike a block of your own:
     no fill, a bar in the calendar's own colour, and `pointer-events: none`
     so a tap goes to the timeline underneath. Nothing here can be edited,
     so nothing here should invite a tap. */
  /* A block is as tall as its event is long, so the text uses that height
     rather than being cut to one line with an ellipsis — a course summary
     runs past a hundred characters and the room is at the end of it. */
  /* Somebody else's calendar. The mark of it is the bar down the left and the
     flat, unlit ground — not a hatch: diagonal stripes read as "cancelled" or
     "disabled", which is the wrong thing to say about a lecture you have to be
     at, and they make the text underneath harder to read for no gain. */
  .subscribed {
    position: absolute; border-radius: 6px; padding: 3px 8px;
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    background: rgba(255,255,255,0.035);
    color: var(--muted); font-size: 12px; overflow: hidden;
    line-height: 1.25; overflow-wrap: anywhere; pointer-events: none;
    display: flex; flex-direction: column;
  }
  /* The name may be cut; the room may not. Two overlapping lectures each get
     half the width, and the name is a hundred characters while the room is
     thirteen — so the name is clamped and the room keeps its line, because the
     room is the part you are looking for. */
  .subscribed .what {
    min-height: 0; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
  }
  .subscribed .where { flex: 0 0 auto; color: var(--accent); font-size: 11px; margin-top: 1px; }
  /* A course period rather than an appointment: further back still. */
  /* A course period rather than an appointment: fainter still, and no ground
     of its own so the lectures over it stay legible. */
  .subscribed.backdrop { opacity: 0.5; background: none; border-left-style: dotted; }
  .allday {
    display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
    border-radius: 999px; padding: 2px 9px; margin: 0 6px 4px 0;
    border: 1px solid var(--accent); color: var(--muted); font-size: 12px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .alldayrow { padding: 0 14px 2px; display: flex; flex-wrap: wrap; }
  .marker {
    position: absolute; height: 22px; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text); padding-right: 6px; overflow: hidden;
  }
  .marker::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; border-top: 2px solid var(--accent); }
  .marker .label {
    position: relative; margin-left: 6px; padding: 1px 7px; border-radius: 6px;
    background: var(--accent); color: #0f1113; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .marker.due .label::before { content: "⚑ "; }
  .nowline { position: absolute; left: calc(var(--gutter) - 8px); right: 0; height: 0; border-top: 2px solid var(--now); z-index: 2; pointer-events: none; }
  .nowline::before { content: ""; position: absolute; left: -4px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
  .empty-tap { position: absolute; inset: 0; }

  /* ── Week ── */
  .weekgrid { margin: 6px 0 0; }
  /* Scrolling to a date months away is O(distance) in thumb-flicks: a day is
     about 250px, a screen holds three of them, so a hard flick is roughly a
     week and next February is twenty flicks. Seven month cells and two taps
     get there instead, and take nothing away from the scroll. */
  .rail { display: flex; gap: 4px; height: 44px; }
  .rail button {
    flex: 1; min-width: 0; height: 44px; border-radius: 10px; text-align: center; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  /* Where today is, when today is not where you are reading — the Today button
     sits directly under this cell. */
  .rail button.hastoday::after {
    content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--today); margin-top: 3px;
  }
  .rail button.here { background: var(--plate); color: var(--text); font-weight: 700; }
  .rail button .yr { font-size: 9px; letter-spacing: 0; opacity: 0.55; text-transform: none; }
  .rail button.beyond { opacity: 0.4; }
  /* The reading position is moved by `holdPlace` and by nothing else. Anything
     inserted above it that skips `holdPlace` will jump the list by its full
     height, silently, and only on a phone. */
  /* Ten pixels of field down both sides and between every day. That
     passe-partout is what makes the plates read as objects on a ground rather
     than as a list with a picture behind it. */
  .weekgrid { overflow-anchor: none; padding: 0 10px; }
  .aend { min-height: 1px; }
  .aend .card {
    margin: 10px 4px 14px; padding: 12px 14px; border-radius: 12px;
    background: var(--plate); border: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.45;
  }
  .aend .card b { color: var(--text); font-weight: 700; }
  .aend .card button {
    margin-top: 10px; padding: 8px 12px; border-radius: 10px;
    background: var(--plate-2); color: var(--text); border: 1px solid var(--line); font: inherit; font-weight: 700;
  }
  .aend .waiting { padding: 14px 4px 20px; color: var(--muted); font-size: 12px; }
  /* The week is a list, not a grid.
     Seven columns on a phone gives each day about fifty pixels, and a course is
     called "MOLE-101, Biokemia, Biokemia 3.9.–20.10.2026 - Luentokurssi" and
     happens in "Metsätieteiden talo, sali 110". No orientation of a time grid
     fixes that: turned on its side, a ninety-minute event across a 24-hour
     width is twenty-eight pixels, which is worse than the fifty it had. A row
     per event is the only shape that gives the words the whole screen — and
     reading what is on is what a week is for. The shape of the hours lives in
     the day view, which is one column wide and can afford it. */
  .weekbody { display: block; position: relative; }
  /* `contain` and not `content-visibility: auto`: skipping the layout of
     off-screen days makes their height a guess, the document height drifts by
     a fifth over a year of them, and landing on a named date — which is the
     whole point of this view — misses by a screenful. */
  /* No plates and no fills. The day is a departure board: a time column, a
     route line threading it, and the words. Nothing is drawn behind text — the
     picture is meant to be seen, and text is made legible by a halo on the
     glyphs themselves rather than by a card under them. */
  .aday { margin: 0 0 2px; contain: layout style; padding: 0 4px 10px; }
  /* Sticky on the heading and never on the section. Gecko refuses a sticky
     frame as a scroll anchor, so a sticky section would compensate none of a
     prepend while a sticky heading leaves the section itself eligible. */
  .aday > button {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    /* One pixel further under, so no seam can appear between two sticky layers
       even when the arithmetic is exact: a compositor rounding each of them to
       device pixels independently can otherwise leave a hairline. */
    /* Static, not sticky. A sticky heading with nothing behind it would show
       its own rows sliding through, and a board does not pin its headings. */
    position: static; background: none; border: 0;
    color: var(--muted); padding: 16px 0 8px; text-align: left; font: inherit;
  }
  /* A day the calendars were never read for. Not the same as a free one. */
  .aday.unknown > button { border-bottom-style: dashed; }
  .aday > button .adate {
    font: 600 11px/1 var(--mono-stack); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .aday > button .aword { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .aday > button .acount { margin-left: auto; font: 600 11px/1 var(--mono-stack); letter-spacing: 0.16em; color: var(--muted); }
  .aday.today > button .adate { color: var(--today); }

  /* The row. The time is the headline, a route line threads the day, and the
     room is set like a platform number. */
  .arow { display: flex; gap: 12px; padding: 0 0 14px; }
  .arow .at { flex: 0 0 var(--spine); text-align: right; }
  .arow .at { font: 600 16px/1 var(--mono-stack); color: var(--text); font-variant-numeric: tabular-nums; }
  .arow .at .ae { display: block; font: 400 11px/1.6 var(--mono-stack); color: var(--muted); }
  /* The line is one hairline per row rather than one long element, so a day can
     be replaced on its own without the thread being rebuilt. */
  .arow .route { flex: 0 0 9px; position: relative; }
  /* The thread has to read on a photograph as well as on a flat ground, and a
     1px line at the hairline alpha does not — so it carries its own dark rim
     rather than borrowing `--line`. */
  .arow .route::before {
    content: ""; position: absolute; left: 4px; top: 7px; bottom: -14px; width: 1px;
    background: rgba(232,230,225,0.30); box-shadow: 0 0 0 1px rgba(4,6,8,0.45);
  }
  .arow:last-child .route::before { display: none; }
  .arow .dot { position: absolute; left: 0; top: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .arow .abody { min-width: 0; flex: 1; padding-bottom: 2px; }
  .arow .an { font-size: 14px; font-weight: 500; line-height: 1.35; color: var(--text); overflow-wrap: anywhere; }
  .arow .aw {
    display: block; margin-top: 4px; font-size: 11px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink); overflow-wrap: anywhere;
  }
  .arow.sub .dot { background: none; box-shadow: inset 0 0 0 2px var(--accent); }
  .arow.done .an { color: var(--muted); text-decoration: line-through; }
  .arow.done .dot { background: var(--muted); }

  /* ── Text on a photograph ───────────────────────────────────────────────
   *
   * A card under text is the obvious way to make it readable on a picture, and
   * it is also the way to hide the picture. This does it on the glyphs instead:
   * a soft dark shadow for the falloff, and — where the browser supports
   * drawing a stroke *behind* the fill — a stroke that becomes a halo rather
   * than a thicker letter.
   *
   * `paint-order` is the load-bearing half. Without it a stroke paints over the
   * fill and fattens the text into a blob, so it is behind `@supports` and the
   * shadow alone carries browsers that lack it.
   *
   * Deliberately NOT `backdrop-filter`, which blurs the backdrop per element
   * per frame, and NOT `filter: drop-shadow`, which forces a filter surface per
   * element — either of those across a scrolling list is the stall this page
   * has already paid for once.
   *
   * Scoped to `.has-photo`: on a flat ground a halo is invisible and still
   * costs paint. */
  html.has-photo .mast,
  html.has-photo .weekgrid,
  html.has-photo .timeline {
    text-shadow: 0 1px 2px rgba(4,6,8,0.95), 0 0 9px rgba(4,6,8,0.7);
  }
  @supports (paint-order: stroke) {
    html.has-photo .mast,
    html.has-photo .weekgrid,
    html.has-photo .timeline {
      paint-order: stroke fill;
      -webkit-text-stroke: var(--halo) rgba(4,6,8,0.62);
      text-shadow: 0 1px 5px rgba(4,6,8,0.8);
    }
    /* The day number is 30px, so its halo can afford to be proportional. */
    html.has-photo .daynum { -webkit-text-stroke-width: 4px; }
    /* A dot is a shape, not a glyph; give it its own dark rim so it reads on a
       bright patch of picture. */
    html.has-photo .arow .dot { box-shadow: 0 0 0 2px rgba(4,6,8,0.55); }
    html.has-photo .arow.sub .dot { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 2px rgba(4,6,8,0.55); }
  }

  /* ── The weather ─────────────────────────────────────────────────────────
   *
   * A third view, on the same chrome as the other two: the masthead answers
   * before anything is read, the bar's scrubber picks a day, and everything
   * between them scrolls. See §21.9.
   *
   * The colours are the sky's, not the palette's: five tints that say what
   * kind of weather a mark stands for without a legend. They are the only
   * colours on the page that mean something by themselves, so they are set
   * once here and used by name everywhere below. */
  :root {
    --w-sun: #f0c36b;
    --w-cloud: #9aa6b2;
    --w-rain: #5aa9e6;
    --w-snow: #cfe3f5;
    --w-storm: #b48ce8;
    --w-night: #7183b8;
  }
  .wx { padding: 0 10px; }
  /* Every box on this view is the same object: a plate on the field, with the
     ten pixels of passe-partout the agenda's days have. */
  .wxbox {
    margin: 10px 0; padding: 12px 14px; border-radius: var(--r-m);
    background: var(--plate); border: 1px solid var(--line);
  }
  html.has-photo .wx { text-shadow: 0 1px 2px rgba(4,6,8,0.95), 0 0 9px rgba(4,6,8,0.7); }

  /* The headline. The temperature is the largest thing in the view because it
     is the one number anybody opens a forecast for. */
  .wxnow { display: flex; align-items: center; gap: 14px; }
  .wxnow img { width: 76px; height: 76px; flex: 0 0 76px; }
  .wxnow .figure { min-width: 0; flex: 1; }
  .wxnow .temp {
    font: 800 44px/1 var(--mono-stack); letter-spacing: -0.03em; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .wxnow .word { font-size: 15px; font-weight: 700; margin-top: 4px; overflow-wrap: anywhere; }
  .wxnow .aside { font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .wxnow .hilo { flex: 0 0 auto; text-align: right; font: 600 14px/1.5 var(--mono-stack); color: var(--muted); }
  .wxnow .hilo b { display: block; color: var(--text); font-size: 18px; font-weight: 800; }

  /* The scrubbed hour, above the chart it belongs to. Fixed height: it changes
     under a moving thumb, and a line that grew would move the chart with it. */
  .wxread {
    display: flex; align-items: baseline; gap: 10px; min-height: 34px;
    font: 500 13px/1.3 var(--mono-stack); color: var(--muted);
    border-bottom: 1px solid var(--line); margin-bottom: 8px; padding-bottom: 6px;
    overflow: hidden; white-space: nowrap;
  }
  .wxread .when { font-weight: 800; font-size: 16px; color: var(--text); flex: 0 0 auto; }
  .wxread .bits { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .wxread .bits b { color: var(--text); font-weight: 700; }
  /* The chart is drawn at the width it is measured at, so nothing inside it is
     scaled: `touch-action: pan-y` lets the page scroll under a finger that
     starts on it, while a sideways drag scrubs the hours. */
  .wxchart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .wxchart .legend { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .wxchart .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

  /* Sunrise, UV, wind — the numbers you look up rather than read. Two columns
     of label-over-value, which fits a phone at any width worth having. */
  .wxfacts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .wxfacts .k { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .wxfacts .v { font: 600 15px/1.3 var(--mono-stack); color: var(--text); margin-top: 2px; }
  .wxfacts .n { font-size: 11px; color: var(--muted); font-family: inherit; font-weight: 400; }

  /* The week. One row per day, and the bar is the point of it: where this
     day's range sits inside the whole week's, so a cold Thursday is visible
     without reading a single number. */
  .wxweek h3, .wxbox > h3 {
    margin: 0 0 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  .wxrow {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 4px; border-radius: 10px; color: var(--text); font: inherit;
  }
  .wxrow.on { background: var(--plate-2); }
  .wxrow:active { background: var(--plate-2); filter: brightness(1.15); }
  .wxrow .wd { flex: 0 0 44px; font: 700 12px/1.2 var(--mono-stack); letter-spacing: 0.06em; text-transform: uppercase; }
  .wxrow.today .wd { color: var(--today); }
  .wxrow img { width: 30px; height: 30px; flex: 0 0 30px; }
  .wxrow .pop { flex: 0 0 40px; font: 600 11px/1 var(--mono-stack); color: var(--w-rain); text-align: right; }
  .wxrow .lo, .wxrow .hi { flex: 0 0 34px; font: 600 14px/1 var(--mono-stack); font-variant-numeric: tabular-nums; }
  .wxrow .lo { color: var(--muted); text-align: right; }
  .wxrow .hi { color: var(--text); }
  .wxrow .range { flex: 1 1 auto; min-width: 40px; height: 6px; border-radius: 3px; background: var(--edge); position: relative; }
  .wxrow .range i {
    position: absolute; top: 0; bottom: 0; border-radius: 3px;
    background: linear-gradient(90deg, var(--w-rain), var(--w-sun));
  }
  /* Where the temperature is right now inside today's own range. */
  .wxrow .range b {
    position: absolute; top: -2px; width: 4px; height: 10px; border-radius: 2px;
    background: var(--text); box-shadow: 0 0 0 1px rgba(4,6,8,0.6);
  }

  /* The day strip in the bar: the weather view's scrubber, in the place the
     week and the month rail live in the other two. */
  .wxdays { display: flex; gap: 4px; height: 44px; }
  .wxdays button {
    flex: 1; min-width: 0; height: 44px; border-radius: 10px; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  }
  .wxdays button .wd { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .wxdays button .t { font: 700 13px/1.2 var(--mono-stack); color: var(--text); }
  .wxdays button.today .wd { color: var(--today); }
  .wxdays button.on { background: var(--plate); }
  .wxdays button:active { background: var(--plate-2); }

  /* Nothing to show, and why. Not a banner: the banners on this page are about
     the board, and the weather failing is not the board failing. */
  .wxnone { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .wxnone b { color: var(--text); font-weight: 700; }
  .wxfoot { color: var(--muted); font-size: 11px; padding: 2px 4px 10px; line-height: 1.5; }

  /* ── Bottom bar ── */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: block;
    height: calc(var(--bar-h) + var(--safe-bottom));
    padding: 6px 14px calc(16px + var(--safe-bottom));
    background: var(--plate); border-top: 0;
    border-radius: var(--r-l) var(--r-l) 0 0;
    box-shadow: 0 0 0 1px var(--edge), 0 -14px 30px rgba(0,0,0,0.5);
    user-select: none; -webkit-user-select: none;
  }
  /* Holds its height whichever scrubber is showing — and before the first
     render, when neither is — so the bar never jumps under a thumb. */
  .scrub { height: 44px; }
  .deck { display: flex; gap: 8px; margin-top: 6px; height: 60px; }
  .deck button {
    flex: 1; min-width: 0; height: 60px; border-radius: 14px; font-weight: 700; font-size: 15px;
    background: var(--plate); color: var(--text); border: 1px solid var(--line);
  }
  /* It was 15.17:1 — the highest-contrast object anywhere on the page, 60px
     tall, and the button pressed least often on a schedule check. Inside a
     sheet the primary IS what you came for and keeps its white fill; here it
     is not. */
  .deck button.primary { background: var(--plate-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--edge-2); border-color: transparent; }
  .deck button:active { filter: brightness(1.2); }
  /* The day is running behind. The fact is in the masthead; this only points
     at where the verb lives. */
  .deck button.late { box-shadow: inset 0 -3px 0 var(--today); }
  /* Kills the 300ms tap delay on the things that are only ever tapped. Never
     `.entry`, which is a button too and carries the press-and-hold that lifts
     a block. */
  .deck button, .aday > button, .actions button, .btn { touch-action: manipulation; }
  .count { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 6px; border-radius: 11px; background: var(--plate-2); font-size: 13px; }
  .count.urgent { background: var(--today); color: #0f1113; }

  /* The frame is the shape of the phone's own screen, so what you line up in
     it is what you get. `touch-action: none` because every touch inside it is
     a placement, never a scroll. */
  /* Height first and width derived from it, never `max-height` over a
     `width: 100%` — that clamps the box and quietly breaks the aspect, and the
     save maps this frame onto the canvas one-to-one. A preview whose shape does
     not match the result is worse than no preview. */
  .cropframe {
    position: relative; overflow: hidden; touch-action: none;
    height: 44vh; aspect-ratio: 720 / 1560; width: auto;
    margin: 4px auto 10px; border-radius: var(--r-m);
    background: var(--plate-2); background-image:
      linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.03) 75%),
      linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.03) 75%);
    background-size: 18px 18px; background-position: 0 0, 9px 9px;
  }
  .cropimg { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; max-width: none; user-select: none; -webkit-user-drag: none; }
  .cropedge { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px var(--edge-2); border-radius: var(--r-m); }

  .dial { margin-bottom: 14px; }
  .dial input[type=range] { width: 100%; margin: 2px 0 0; accent-color: var(--today); }
  .diallabel { display: flex; align-items: baseline; justify-content: space-between; font-size: 14px; font-weight: 600; }
  .dialval { color: var(--muted); font-size: 12px; font-weight: 400; }
  .dialhint { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Sheets ── */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.68); z-index: 8; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--plate); border-radius: 18px 18px 0 0;
    padding: 8px 16px 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  /* A target, not a decoration: tap it to close, or drag it down. `touch-action:
     none` only over these 32px, so it costs the sheet almost no scroll. */
  .grip { display: block; width: 100%; height: 32px; padding: 0; background: none; touch-action: none; }
  .grip i { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 14px auto 0; }
  .sheet.springing { transition: transform 180ms ease-out; }
  /* Every sheet ends with a way out, and it stays on screen however long the
     list above it is. A Close at the bottom of 88vh of scrolling tasks is not a
     way out of anything one-handed. */
  .sheetfoot {
    position: sticky; bottom: 0; display: flex; gap: 8px;
    background: var(--plate); border-top: 1px solid var(--line);
    padding: 10px 0 calc(16px + var(--safe-bottom));
  }
  .sheetfoot button {
    flex: 1; height: 52px; border-radius: 12px; font-weight: 700;
    background: var(--plate-2); border: 1px solid var(--line); color: var(--text);
  }
  .sheet h2 { margin: 0 0 2px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; word-break: break-word; }
  .sheet h2 button { text-align: left; width: 100%; }
  .sheet h2 input { width: 100%; background: var(--plate-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 18px; font-weight: 700; }
  .kindline { color: var(--muted); font-size: 13px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .section { border-top: 1px solid var(--line); padding: 12px 0; }
  .section h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
  .field label { color: var(--muted); font-size: 14px; }
  .field input, .field select {
    background: var(--plate-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; min-height: 40px; color: var(--text); max-width: 60%;
  }
  .field input[type="time"], .field input[type="datetime-local"] { color-scheme: dark; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button, .btn {
    height: 44px; padding: 0 14px; border-radius: 12px; font-weight: 700;
    background: var(--plate-2); border: 1px solid var(--line); color: var(--text);
    flex: 1 1 auto;
  }
  .actions button.ok { background: var(--ok); color: #0f1113; border-color: transparent; }
  .actions button.danger { color: var(--danger); }
  .actions button.primary { background: #e8e6e1; color: #0f1113; border-color: transparent; }
  .actions button:active { filter: brightness(1.2); }
  .weekdays { display: flex; gap: 6px; flex-wrap: wrap; }
  .weekdays button {
    width: 40px; height: 40px; border-radius: 10px; background: var(--plate-2);
    border: 1px solid var(--line); font-weight: 700; color: var(--muted);
  }
  .weekdays button.on { background: var(--text); color: #0f1113; border-color: transparent; }
  .seg { display: flex; background: var(--plate-2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; height: 38px; border-radius: 9px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--text); color: #0f1113; }

  /* ── Tray ── */
  .quickadd { display: flex; gap: 8px; margin-bottom: 8px; }
  .quickadd input { flex: 1; min-width: 0; background: var(--plate-2); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 46px; }
  .quickadd button { width: 64px; height: 46px; border-radius: 12px; background: var(--text); color: #0f1113; font-weight: 800; }
  .quickadd button.chip { width: auto; height: 46px; background: var(--plate-2); color: var(--muted); font-weight: 600; padding: 0 12px; }
  .quickadd + .field input { max-width: 100%; }
  .card {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 10px 10px 10px 12px; border-radius: 12px; margin: 6px 0;
    background: var(--plate-2); border-left: 3px solid var(--accent);
  }
  .card .chip { flex: 0 0 auto; min-width: 44px; padding: 0 10px; }
  .card .meta { white-space: normal; }
  .card .body { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card .due-in { font-size: 12px; color: var(--muted); }
  .card .due-in.overdue { color: var(--danger); font-weight: 700; }
  .tray-heading { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 14px 0 4px; }
  .tray-heading.urgent { color: var(--today); }
  .nothing { color: var(--muted); font-size: 14px; padding: 10px 0; }

  /* ── Banners ── */
  .banner {
    position: fixed; left: 12px; right: 12px; top: calc(12px + var(--safe-top)); z-index: 20;
    background: #2b1d1f; color: #f3c7cc; border: 1px solid #5a2d34; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center;
  }
  .banner.info { background: #1d2530; color: #cfe0f3; border-color: #2f4a63; }
  .banner .actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .banner button { font-weight: 700; padding: 4px 8px; }
  .quietrow {
    display: flex; gap: 10px; align-items: center; margin: 10px 0 2px;
    padding: 8px 12px; border-radius: 10px; font-size: 13px;
    background: var(--plate-2); color: var(--muted); border: 1px solid var(--edge);
  }
  .quietrow button { flex-shrink: 0; margin-left: auto; font-weight: 700; padding: 4px 8px; }
  .sheet .waiting {
    margin: 10px 0 2px; padding: 8px 12px; border-radius: 10px; font-size: 13px;
    background: #1d2530; color: #cfe0f3; border: 1px solid #2f4a63;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--bar-h) + var(--safe-bottom) + 12px); transform: translateX(-50%);
    background: var(--text); color: #0f1113; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px;
    z-index: 30; max-width: 90vw; text-align: center;
  }
  .gate { padding: 24px 18px; max-width: 420px; margin: 40px auto; }
  .gate p { color: var(--muted); }
  .gate input { width: 100%; background: var(--plate); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- The picture, when there is one. A direct child of `body` and nothing else:
     `.aday` carries `contain: layout style`, which makes every day section a
     containing block for fixed descendants and would trap this in the scroll. -->
<div id="field" aria-hidden="true"></div>

<!-- Nothing in here is tappable, and that is the rule the layout hangs on: the
     masthead is what you read, the bar at the bottom is what you touch. It
     keeps every control inside a thumb's arc, and it keeps this box a fixed
     height per view — which matters because its height is the sticky offset
     every day heading below it is positioned from. -->
<header class="mast">
  <div class="date">
    <div class="daynum mono" id="daynum">··</div>
    <div class="dwhen">
      <div class="dwd" id="dayweek"></div>
      <div class="dmo" id="daymonth"></div>
    </div>
  </div>
  <div class="summary" id="summary"></div>
</header>

<!-- All-day events off subscribed calendars: chips, not blocks (§23). In flow
     rather than in the masthead, so they scroll away with the day they belong
     to and cannot add their height to every sticky offset on the page. -->
<div class="alldayrow" id="alldayRow" hidden></div>

<noscript><p style="padding:18px;font:15px/1.5 system-ui;color:#c9c9c9">TaskDeck needs JavaScript. This page is one file and does all its drawing in the browser.</p></noscript>

<main class="timeline" id="timeline">
  <div id="hours"></div>
  <div class="lanes" id="lanes"><div class="empty-tap" id="emptyTap"></div></div>
  <div class="nowline" id="nowline" hidden></div>
</main>

<section class="weekgrid" id="weekgrid" hidden>
  <!-- Both ends are permanent children, so nothing has to be re-observed when
       the list grows. The head carries a button and the tail a sentinel: see
       `armSentinel`. -->
  <div class="aend" id="agendaHead"></div>
  <div class="weekbody" id="weekbody"></div>
  <div class="aend" id="agendaTail"></div>
</section>

<!-- The weather (§21.9). Four plates and a footer, all of them permanent
     children: the chart is drawn at the width it is measured at, and an empty
     box in the layout is the only thing that can be measured before there is
     anything to put in it. -->
<section class="wx" id="weather" hidden>
  <div class="wxbox wxnow" id="wxNow"></div>
  <div class="wxbox wxchart" id="wxChart">
    <div class="wxread" id="wxRead"></div>
    <div id="wxPlot"></div>
    <div class="legend" id="wxLegend"></div>
  </div>
  <div class="wxbox" id="wxFacts"></div>
  <div class="wxbox wxweek" id="wxWeek"></div>
  <div class="wxfoot" id="wxFoot"></div>
</section>

<!-- Two rows. The scrubber says where you are and takes you a few days or a
     few months either way; the deck holds the four verbs. Both are within reach
     of the hand already holding the phone, which is the whole point: navigation
     used to live in the top row, which is the furthest thing from a thumb. -->
<nav class="bar" id="bar" aria-label="Navigation and actions">
  <div class="scrub">
    <div class="week" id="week" role="group" aria-label="This week" hidden></div>
    <div class="rail" id="rail" role="group" aria-label="Months" hidden></div>
    <div class="wxdays" id="wxdays" role="group" aria-label="Days of the forecast" hidden></div>
  </div>
  <div class="deck">
    <button id="trayBtn" aria-label="Tray">Tray<span class="count" id="trayCount" aria-hidden="true">0</span></button>
    <button id="todayBtn" aria-label="Today">Today</button>
    <button id="modeBtn">Day</button>
    <button id="newBtn" class="primary" aria-label="New">＋ New</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog"></div>
<div class="banner" id="banner" hidden></div>
<div class="gate" id="gate" hidden>
  <h2>TaskDeck</h2>
  <p>This page needs the link from TaskDeck's settings — it carries a token that lets the phone edit your calendar. If you have the token, paste it here.</p>
  <p id="gateNote" hidden></p>
  <input id="gateToken" placeholder="token" autocapitalize="off" autocomplete="off" spellcheck="false">
  <div class="actions"><button class="primary" id="gateGo">Open</button></div>
</div>

<script>
(() => {
  // `replaceChildren` is the newest thing this file needs — Firefox 78,
  // Chrome 86, Safari 14 — and it is used on every render, so on an older

  // board not answering in time, a disk refusing — never a verdict on the edit.
  const unreachable = (error) => error.status === 0 || error.status >= 500;

  // Every command travels under a key that is the same on each retry of it:
  // TaskDeck keeps its last replies by key and answers a repeat with the
  // first reply rather than applying the command twice — which is what a
  // lost answer, or a 503 from a board that answered late, would otherwise
  // cost (a second task, a second block).
  const REQUEST_HEADER = 'X-TaskDeck-Request';
  function requestKey() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  const post = (command, key) => api('/api/command', { method: 'POST', body: JSON.stringify(command), headers: { [REQUEST_HEADER]: key } });

  // A queued edit in words, for the banner. Named while the item is still in
  // the snapshot, since it may not be by the time the words are read.
  function describe(command) {
    // A restore names an archived row, which the tray's Done list knows.
    const named = command.op === 'restore'
      ? ((state.snap && state.snap.done) || []).find((row) => row.id === command.id && row.archived_at === command.archived_at)
      : state.items.get(command.id);
    const who = named ? `“${named.name}”` : (command.id != null ? `#${command.id}` : 'it');
    switch (command.op) {
      case 'create': case 'quick_add': case 'add': return `add “${command.name}”`;
      case 'rename': return `rename ${who}`;
      case 'complete': return `finish ${who}`;
      case 'delete': return `delete ${who}`;
      case 'move_block': return `move a block of ${who}`;
      case 'add_block': return `book a block for ${who}`;
      case 'remove_block': return `remove a block of ${who}`;
      case 'unplan': return `unplan ${who}`;
      case 'set_estimate': return `change the length of ${who}`;
      case 'set_deadline': return `change the due date of ${who}`;
      case 'set_severity': return `change the severity of ${who}`;
      case 'set_horizon': return `change the horizon of ${who}`;
      case 'set_repeat': return `change the weekdays of ${who}`;
      case 'reflow': return `reflow ${command.day}`;
      case 'set_notes': return 'save the notes';
      case 'restore': return `put back ${who}`;
      default: return command.op;
    }
  }

  function queueEdit(command, key) {
    const queue = outbox();
    queue.push({ command, label: describe(command), at: Date.now(), key: key || requestKey() });
    if (!keepOutbox(queue)) {
      // A browser that allows no storage cannot keep it; say so rather than
      // "kept".
      toast("Can't reach TaskDeck, and this browser lets the page keep nothing — that change is lost");
      return;
    }
    showPending(queue);
    toast('Kept — it is sent when TaskDeck answers');
  }

  let flushing = null;
  // Send what is waiting, in order. Stops at the first sign TaskDeck is still
  // away; anything it refuses is dropped and said, never retried for ever.
  // Answers with how many went and how many are still waiting.
  async function flush() {
    if (flushing) return flushing;
    flushing = replay();
    try { return await flushing; } finally { flushing = null; }
  }
  async function replay() {
    const refused = [];
    let sent = 0;
    let queue = outbox();
    while (queue.length) {
      const next = queue[0];
      try {
        await post(next.command, next.key || '');
        sent += 1;
      } catch (error) {
        if (unreachable(error)) break;
        if (error.status === 401) { showGate(); break; }
        refused.push(`${next.label} — ${error.message}`);
      }
      // Storage is read again before the head is dropped: a Discard, or an
      // edit kept from another path, may have changed it while the POST ran,
      // and neither may be undone by writing a stale copy back.
      const now = outbox();
      if (now.length && now[0].at === next.at && now[0].key === next.key && !keepOutbox(now.slice(1))) {
        // The head cannot be dropped from storage: stop rather than send it
        // for ever (each repeat would be answered, not applied — the key —
        // but nothing else would ever run).
        break;
      }
      queue = outbox();
    }
    if (refused.length) {
      const lead = refused.length === 1 ? 'A change made here could not be applied' : `${refused.length} changes made here could not be applied`;
      const shown = refused.slice(0, 3).join('; ') + (refused.length > 3 ? `; and ${refused.length - 3} more` : '');
      // An earlier, unacknowledged notice is kept in front of this one.
      rememberNotice(state.notice ? `${state.notice} · ${lead}: ${shown}` : `${lead}: ${shown}`);
    }
    return { sent, waiting: queue.length };
  }

  const discardAction = ['Discard', () => {
    if (!confirm('Drop the changes waiting to be sent?')) return;
    keepOutbox([]);
    load();
  }];
  function showPending(queue) {
    const n = queue.length;
    const named = queue.slice(0, 3).map((entry) => entry.label).join(', ') + (n > 3 ? ', …' : '');
    showBanner(`${n} change${n === 1 ? '' : 's'} waiting to be sent: ${named}`, {
      info: true,
      actions: [['Retry', () => load()], discardAction],
    });
  }
  // What the banner says when the day itself loaded: a refusal to
  // acknowledge, edits still waiting, or nothing.
  function settleBanner() {
    if (state.notice) {
      showBanner(state.notice, { actions: [['OK', () => { rememberNotice(null); settleBanner(); }]] });
    } else {
      const queue = outbox();
      if (queue.length) showPending(queue); else hideBanner();
    }
  }

  let loadSeq = 0;
  // Set when a replay sent something, cleared by whichever load draws the
  // board next: the redraw must not be lost with a load that was overtaken.
  let sheetStale = false;
  // The whole snapshot is for the shown day; a wider answer contributes only
  // its days. Fourteen places read `state.snap.days[0]` as "the day on screen",
  // and one of them puts that date on a command, so `state.snap` stays a
  // one-day object however many days were asked for.
  function anchorOf(snap) {
    return snap.days.length === 1 ? snap : Object.assign({}, snap, { days: snap.days.slice(0, 1) });
  }

  async function load({ quiet = false, span = 1 } = {}) {
    // Two loads can be in flight — › tapped twice, a poll under a swipe. Only
    // the latest one's answer is shown, and a day's cache is keyed by the day
    // the answer is actually for, never by the day selected when it arrived.
    // Claimed here rather than after the replay below: a load's place in the
    // queue is decided when it is called, not when it gets around to asking.
    const mine = ++loadSeq;
    const asked = state.day;

    // Paint what we already know before asking anything. The day is in
    // localStorage from the last visit, and drawing it costs a millisecond
    // against a round trip that on mobile data is most of a second — and on a
    // tired phone in battery saver, several. The fetch below replaces it a
    // moment later; until then the app opens *now*, which is the whole point
    // of pulling it out of a pocket.
    //
    // No stale banner here, on purpose: nothing has failed, a request is in
    // flight, and "as of 12:05" over a day that is about to refresh itself is
    // noise. The banner belongs to the catch branch, for when the fetch really
    // does not arrive.
    if (!quiet && (!state.snap || state.snap.days[0].date !== asked)) {
      const known = recall(asked);
      if (known) {
        takeSnapshot(known.snap);
        render();
      }
    }

    // Replay only after that paint. `flush()` awaits each queued command at
    // REQUEST_TIMEOUT_MS, so one edit made in a tunnel and still unsent held
    // the whole opening screen blank for up to fifteen seconds — three times
    // the delay this page spent a day getting rid of. The queue is not urgent;
    // seeing the day is.
    const replayed = outbox().length ? await flush() : null;
    if (replayed && replayed.sent) sheetStale = true;

    try {
      const snap = await api(`/api/state?from=${asked}&days=${span}`);
      remember(snap.days[0].date, anchorOf(snap));
      // The days go into the store whatever else happens: they are true, and a
      // load that has been overtaken still fetched real days.
      const moved = absorb(snap);
      if (mine !== loadSeq || asked !== state.day) return;
      // Whether this is the board already on screen. The weather view is drawn
      // from the forecast and takes only the plan band and the deck from here,
      // so a poll that found the same board — the usual minute — redraws the
      // deck and leaves the chart alone; `tickWeather` moves what the minute
      // moves. Anything the board did changes the version, and then it is
      // drawn whole.
      const sameBoard = state.mode === 'weather' && !!state.snap && state.snap.version === snap.version;
      takeSnapshot(anchorOf(snap));
      state.staleAt = null;
      settleBanner();
      if (sameBoard) renderDeck(state.snap); else render();
      refreshStale();
      // Absorb and patch, and NEVER grow the ribbon from here. `load({quiet})`
      // runs from the long poll, from a sixty-second timer, from the tab
      // becoming visible and from the network returning — a pager on this line
      // would fetch a page a minute with nobody scrolling.
      if (state.mode === 'agenda') { patchAgenda(moved); railAndMasthead(); }
      // A sheet is never redrawn under someone's fingers by a background
      // load — except when edits made from it have just gone through, so
      // that it shows what the board now says rather than what it said
      // before them.
      if (sheetStale && state.sheet && !state.renaming) { sheetStale = false; renderSheet(); }
    } catch (error) {
      if (error.status === 401) { showGate(); return; }
      if (mine !== loadSeq || asked !== state.day) return;
      const cached = (!state.snap || state.snap.days[0].date !== state.day) ? recall(state.day) : null;
      const waiting = outbox().length;
      const suffix = waiting ? ` · ${waiting} change${waiting === 1 ? '' : 's'} waiting to be sent` : '';
      const actions = waiting ? [discardAction] : [];
      const kept = keptSince();
      // Set before the draw, because the masthead reads it: what is on screen
      // came out of store, and says so whether or not the banner is showing.
      state.staleAt = kept;
      if (cached) takeSnapshot(cached.snap);
      if (cached) render();
      // Even when there was nothing new to draw: the note is the thing that
      // changed, and with the banner silenced it is the only thing saying so.
      refreshStale();
      // Quiet is for the condition the reader already knows about. Edits that
      // have not reached the desk are a different thing entirely — that is
      // their data waiting on a machine in a bag, and it always speaks up.
      if (state.quietOffline && !waiting) { hideBanner(); return; }
      const quietable = !waiting
        ? [['Don\u2019t warn', () => { setQuietOffline(true); hideBanner(); }]]
        : [];
      if (kept) {
        const when = new Date(kept).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        // "This day" in the day view, where there is one. The agenda is a
        // patchwork of months last written at different times, so the only
        // claim that cannot be wrong there is the oldest of them.
        const what = state.mode === 'agenda' ? 'Showing kept days — the oldest here is from' : 'Showing this day as of';
        showBanner(`${what} ${when} — ${error.message}${suffix}`, { retry: true, actions: actions.concat(quietable) });
      } else {
        showBanner(error.message + suffix, { retry: true, actions: actions.concat(quietable) });
      }
    }
  }

  async function send(command, { refreshSheet = true } = {}) {
    // Kept for later, and the sheet redrawn as the success path would redraw
    // it — so it shows the board as it still is, with the waiting line, not a
    // control that looks applied.
    const key = requestKey();
    const keep = (kept) => {
      queueEdit(kept, key);
      if (refreshSheet && state.sheet) renderSheet();
      // Kept while the gate is up: the gate's own line says so, not a banner
      // over it.
      if (!$('gate').hidden) showGate();
    };
    // Older edits go first, so the order things were done in is the order
    // TaskDeck sees; if they still cannot go, this one waits behind them.
    if (outbox().length && (await flush()).waiting) { keep(command); return null; }
    try {
      const result = await post(command, key);
      await load({ quiet: true });
      if (refreshSheet && state.sheet) renderSheet();
      return result;
    } catch (error) {
      if (unreachable(error)) {
        keep(command);
      } else if (error.status === 401) {
        // Refused for the key, not for the edit: kept, and the gate says so.
        keep(command);
        showGate();
      } else if (error.status === 410) {
        // Gone from the desk: refresh and let go of it.
        toast(error.message);
        state.selected = null;
        closeSheet();
        await load({ quiet: true });
      } else if (error.status === 401) {
        showGate();
      } else {
        toast(error.message);
      }
      return null;
    }
  }

  /* ───────────────────────────── Rendering ───────────────────────────── */

  function daySummary(day, late) {
    $('summary').classList.remove('glance');
    $('summary').replaceChildren(...bits(day.summary, late && day.behind_minutes));
  }

  // Redraw the one line that carries "as of", and nothing else.
  //
  // A load that fails while the day on screen is already the right one adopts
  // no new snapshot and so draws nothing — which is correct for the day and
  // wrong for the note, because the reader has just gone offline and the
  // masthead still claims to be current. Redrawing the whole view here instead
  // would throw away scroll position every sixty seconds for a line of text.
  function refreshStale() {
    // The weather view's masthead is about the forecast, not the board, and it
    // has its own note for its own age.
    if (state.mode === 'weather') return;
    if (!state.snap) return;
    if (state.mode === 'agenda') renderGlance();
    else {
      const day = state.snap.days[0];
      daySummary(day, day.behind_minutes > 0);
    }
  }

  // Which view is on screen, and which scrubber is in the bar with it. One
  // place, so a view added later cannot forget to hide something — which is
  // what the three scattered pairs of assignments here used to invite.
  //
  // The all-day row is only ever hidden from here: whether it shows in the day
  // view is `renderAllDay`'s to say, and it says "not unless there is a band
  // to draw".
  function showView(mode) {
    $('timeline').hidden = mode !== 'day';
    $('week').hidden = mode !== 'day';
    if (mode !== 'day') $('alldayRow').hidden = true;
    $('weekgrid').hidden = mode !== 'agenda';
    $('rail').hidden = mode !== 'agenda';
    $('weather').hidden = mode !== 'weather';
    $('wxdays').hidden = mode !== 'weather';
  }

  // The four buttons under the scrubber. They act on today in every view, so
  // they are drawn from the snapshot and not from whatever is being read.
  function renderDeck(snap) {
    const day = snap.days[0];
    const late = day.behind_minutes > 0;
    const trayCount = snap.tray.due.length + snap.tray.later.length;
    const count = $('trayCount');
    count.textContent = String(trayCount);
    count.classList.toggle('urgent', snap.tray.due.length > 0);
    // The badge keeps meaning exactly one thing — how much is waiting, urgent
    // when something is due. A day running behind is a different fact and gets
    // its own mark, or an empty tray on a late day would show an urgent zero.
    $('trayBtn').classList.toggle('late', late);
    $('trayBtn').setAttribute(
      'aria-label',
      `Tray, ${trayCount} waiting, ${snap.tray.due.length} due` + (late ? ', running behind' : ''),
    );
    const todayLabel = day.is_today ? 'Scroll to now' : 'Jump to today';
    $('todayBtn').title = todayLabel;
    $('todayBtn').setAttribute('aria-label', todayLabel);
  }

  function render() {
    const snap = state.snap;
    if (snap) renderDeck(snap);

    // Decided before the early return below, and that is the point of it: the
    // weather is not the board's, so this is the one view that can be drawn
    // with the desk unreachable and nothing kept of it. It has a forecast of
    // its own or it says exactly why it has not.
    if (state.mode === 'weather') {
      showView('weather');
      renderWeather();
      measureSticky();
      return;
    }

    if (!snap) return;
    const day = snap.days[0];
    const late = day.behind_minutes > 0;

    if (state.mode === 'agenda') {
      showView('agenda');
      railAndMasthead();
      measureSticky();
      return;
    }

    showView('day');
    mastheadFor(day.date, day.is_today);
    daySummary(day, late);
    renderWeek(day);
    renderHours();
    renderLanes(day);
    renderNow(day);
    measureSticky();
  }

  // The mode button's label, written outside `render()` on purpose: `render()`
  // returns at its first line when there is no snapshot, which is exactly the
  // offline cold open the boot block exists for — and a button labelled from
  // there would be wrong for as long as the desk stayed unreachable.
  // Three views and one button, so the button is a ring: day → agenda →
  // weather → day. It is labelled with where it goes rather than with where
  // you are, which is what it has always done and what keeps one tap
  // predictable; the deck has no room for a fourth button and a segmented
  // control up in the masthead would put the most-tapped control on the page
  // furthest from a thumb.
  const NEXT_MODE = { day: 'agenda', agenda: 'weather', weather: 'day' };
  const MODE_NAMES = { day: 'Day', agenda: 'Agenda', weather: 'Weather' };
  function labelChrome() {
    const next = NEXT_MODE[state.mode] || 'agenda';
    $('modeBtn').textContent = MODE_NAMES[next];
    $('modeBtn').setAttribute('aria-label', `Show the ${next}`);
  }

  // Text, and the behind-schedule note when there is one. `replaceChildren`
  // takes nodes rather than the child list `el` takes, and stringifies a `null`
  // into the word — so the choice is made here rather than at the call.
  function bits(text, behindMinutes) {
    const out = [document.createTextNode(text)];
    if (behindMinutes > 0) out.push(el('span', { class: 'behindnote', text: ` · ${dur(behindMinutes)} behind` }));
    const stale = staleNote();
    if (stale) out.push(stale);
    return out;
  }

  // What is on screen came out of store, and when. Quiet on purpose — it is an
  // aside, not an alarm — but always there while it is true, so that silencing
  // the banner costs the reader the interruption and not the fact. Without it,
  // "don't warn me" would mean "show me a day of unknown age with no way to
  // tell", which for a timetable is worse than the banner ever was.
  function staleNote() {
    if (!state.staleAt) return null;
    const when = new Date(state.staleAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    return el('span', { class: 'stalenote', text: ` · as of ${when}` });
  }

  function longDay(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // The masthead's three fields, the same in both views. In the agenda it is
  // always today's date, because today is what every verb in the bar acts on —
  // said at 30px instead of in a line of 12px grey. Zero-padded, so the column
  // is two glyphs wide and the spine never shifts under it.
  function mastheadFor(iso, isToday) {
    const [y, m, d] = iso.split('-').map(Number);
    const when = new Date(y, m - 1, d);
    $('daynum').textContent = iso.slice(8);
    $('daynum').classList.toggle('today', isToday);
    $('dayweek').textContent = when.toLocaleDateString(undefined, { weekday: 'long' });
    $('daymonth').textContent = when.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }

  // The shown day's week, Monday first like the calendar, as seven taps. Under
  // each day, up to three dots for what the wall calendar would show on it —
  // events and due dates, in their own colours — the same budget a calendar
  // cell has.
  function renderWeek(day) {
    const week = $('week');
    week.replaceChildren();
    const today = todayIso();
    // Centred on the day you are looking at, three either way, rather than
    // anchored to Monday. A week that starts on Monday offers a Sunday reader
    // seven days that have already happened; centring means the strip always
    // reaches the same distance forward as back, whichever day it is.
    for (let i = -3; i <= 3; i++) {
      const iso = shiftDay(day.date, i);
      const [dy, dm, dd] = iso.split('-').map(Number);
      const date = new Date(dy, dm - 1, dd);
      // Off the same store the agenda reads, so the seven-day request that used
      // to exist only for these dots is gone: the day fetch brings the week.
      const held = state.agenda.days.get(iso);
      const marks = held ? held.entries.filter((e) => e.kind === 'event' || e.due).map((e) => e.color) : [];
      const dots = el('span', { class: 'dots' });
      for (const color of marks.slice(0, 3)) dots.append(el('i', { style: `--c:${colorOf(color)}` }));
      const node = el('button', {
        class: (i === 0 ? 'shown' : '') + (iso === today ? ' today' : ''),
        onclick: () => { if (iso !== state.day) goTo(iso); },
        'aria-label': date.toDateString(),
        'aria-current': i === 0 ? 'date' : null,
      }, [
        el('span', { class: 'wd', text: date.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2) }),
        el('span', { class: 'dn', text: String(date.getDate()) }),
        dots,
      ]);
      week.append(node);
    }
  }

  /* ─────────────────────────── The agenda ribbon ───────────────────────────
   *
   * One continuous list of days, newest at the top of nothing in particular:
   * it simply runs, from whatever the reader has scrolled back to down through
   * whatever they have scrolled forward to, a month at a time. Each day is a
   * heading and its things in clock order — the board's blocks, its ghosts, and
   * whatever the subscribed calendars say — because reading *what is on* is
   * what a week is for, and a phone's width can only afford to say one of
   * "what" and "when" properly.
   *
   * Two rules hold the whole thing together.
   *
   * **Scrolling changes nothing.** It is a reading motion. It never moves the
   * shown day, never sends a command, and never runs from `load()`. In this
   * view the shown day is pinned to today, so ＋ New, Reflow and Tray all mean
   * today and the masthead says so — a scroll position quietly retargeting an
   * edit is how work gets booked on the wrong date.
   *
   * **Nothing moves the reading position except `holdPlace`.** Everything that
   * inserts or removes days above where someone is reading goes through it.
   */

  function setMode(mode) {
    state.mode = mode;
    try { localStorage.setItem('taskdeck-mode', mode); } catch (_) {}
    labelChrome();
    // Entering the agenda pins the shown day to today. This is the invariant
    // that lets the verbs in the bar keep meaning something exact — and the
    // weather view keeps it for the same reason: ＋ New and Tray still mean
    // today there, whichever day's forecast is being read.
    if (mode !== 'day') state.day = todayIso();
    render();
    if (mode === 'weather') {
      // Asked for whenever the view is opened, and answered from store in the
      // meantime. `loadWeather` refuses to ask again for a report that is only
      // minutes old, so flicking between views costs nothing.
      window.scrollTo(0, 0);
      loadWeather();
      return;
    }
    if (mode === 'agenda') {
      // The store may have grown since boot — a day view fetches seven days of
      // its own — so the run is derived again here rather than assumed.
      if (!state.agenda.first) seedRun(todayIso());
      if (!state.agenda.first || !state.agenda.nodes.size) renderAgenda();
      drawEnds();
      jumpToDate(todayIso(), { load: false });
      growIfShort();
    } else {
      scrollToUsefulHour();
    }
  }

  // One day, as a section. Lifted whole out of the week grid it was written
  // for; the only things it learns here are its date, that today is decided at
  // paint time rather than baked into a cached day, and that a day the
  // calendars never reached is not the same as a day with nothing on it.
  function dayNode(iso, day) {
    const [dy, dm, dd] = iso.split('-').map(Number);
    const when = new Date(dy, dm - 1, dd);
    const rows = [];
    if (day) {
      for (const entry of day.entries) {
        rows.push({
          at: entry.start,
          label: hhmm(entry.start),
          until: entry.marker ? '' : hhmm(entry.start + entry.minutes),
          name: entry.name,
          where: entry.marker && entry.due ? 'due' : '',
          accent: colorOf(entry.color),
          ground: groundOf(entry.color),
          ink: inkOf(entry.color),
          sub: false,
        });
      }
      for (const ghost of day.ghosts) {
        rows.push({
          at: ghost.start, label: hhmm(ghost.start), until: hhmm(ghost.start + ghost.minutes),
          name: ghost.name, where: '',
          accent: colorOf(ghost.color), ground: 'transparent', ink: 'var(--muted)', sub: false, done: true,
        });
      }
      for (const event of (day.subscribed || [])) {
        rows.push({
          at: event.all_day ? -1 : event.start,
          label: event.all_day ? 'all' : hhmm(event.start),
          until: event.all_day ? 'day' : hhmm(event.end),
          name: event.name,
          where: event.where || '',
          accent: subBarOf(event.color),
          ground: 'transparent',
          ink: inkOf(event.color),
          sub: true,
        });
      }
      rows.sort((a, b) => a.at - b.at);
    }

    // A day past the far edge of the calendars is not a free day. The board's
    // own blocks on it are real; the absence of lectures on it means only that
    // nobody has looked.
    const unread = !day || !isKnown(iso);
    // A day with nothing on it gets no plate: it is a void the field shows
    // through. Today always keeps its plate — it is what every verb in the bar
    // acts on, so it is never "nothing".
    const free = !rows.length && iso !== todayIso();
    const section = el('div', {
      class: 'aday' + (iso === todayIso() ? ' today' : '') + (free ? ' free' : '') + (unread ? ' unknown' : ''),
      'data-date': iso,
    });
    section.append(el('button', {
      'aria-label': `Open ${when.toDateString()}`,
      onclick: () => openDay(iso),
    }, [
      el('span', { class: 'adate', text: when.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric' }) }),
      // The most-repeated string on the ribbon stops being a line of its own
      // and becomes half of a heading that was already there, on the spine.
      rows.length ? null : el('span', { class: 'aword', text: unread ? '· not read' : '· free' }),
      el('span', { class: 'acount', text: rows.length ? `${rows.length}` : '' }),
    ]));

    for (const row of rows) {
      const line = el('div', {
        class: 'arow' + (row.sub ? ' sub' : '') + (row.done ? ' done' : ''),
        style: `--accent:${row.accent}; --ground:${row.ground}; --ink:${row.ink}`,
      });
      const at = el('span', { class: 'at', text: row.label });
      if (row.until) at.append(el('span', { class: 'ae', text: row.until }));
      line.append(at);
      // The thread down the day, with a node for each thing on it.
      line.append(el('span', { class: 'route' }, [el('i', { class: 'dot' })]));
      const bodyCell = el('div', { class: 'abody' });
      bodyCell.append(el('span', { class: 'an', text: row.name }));
      if (row.where) bodyCell.append(el('span', { class: 'aw', text: row.where }));
      line.append(bodyCell);
      section.append(line);
    }
    return section;
  }

  // Whether the subscribed calendars were read for this day. With nothing
  // subscribed there is no span, no ignorance, and no edge to draw.
  function isKnown(iso) {
    const known = state.agenda.known;
    return !known || (known.from <= iso && iso <= known.until);
  }

  // Put the reading position back where it was.
  //
  // It *measures* the displacement rather than predicting it: a surviving
  // element's real screen position before and after, and the difference put
  // back. That is right whether the engine's own scroll anchoring compensated
  // fully, partly or not at all — and unlike a `scrollHeight` delta it cannot
  // land on top of an adjustment the engine already made and jump a page.
  function holdPlace(keep, mutate) {
    if (!keep) { mutate(); return; }
    const was = keep.getBoundingClientRect().top;
    mutate();
    const now = keep.getBoundingClientRect().top;
    if (now !== was) window.scrollBy(0, now - was);
  }

  // The whole run, from scratch. The only caller of `replaceChildren` on the
  // body: on boot, on entering the agenda, and on a jump that lands outside
  // what is drawn. Never on a data path — see `patchAgenda`.
  function renderAgenda() {
    const body = $('weekbody');
    for (const node of state.agenda.nodes.values()) unwatchDay(node);
    state.agenda.nodes.clear();
    state.agenda.onScreen.clear();
    body.replaceChildren();
    const { first, last } = state.agenda;
    if (!first || !last) { $('weekgrid').hidden = false; return; }
    const parts = [];
    for (let iso = first; iso <= last; iso = shiftDay(iso, 1)) {
      const node = dayNode(iso, state.agenda.days.get(iso));
      state.agenda.nodes.set(iso, node);
      parts.push(node);
    }
    body.append(...parts);
    for (const node of state.agenda.nodes.values()) watchDay(node);
    $('weekgrid').hidden = false;
  }

  // Only the days that actually changed, in place. One section is a fraction
  // of a millisecond against a rebuild's fifteen, and this runs on the path
  // `/api/wait` makes hot — every edit at the desk lands here.
  function patchAgenda(dates) {
    for (const iso of dates) {
      const node = state.agenda.nodes.get(iso);
      if (!node) continue;
      const fresh = dayNode(iso, state.agenda.days.get(iso));
      const above = node.getBoundingClientRect().bottom <= 0;
      holdPlace(above ? nextDayNode(iso) : null, () => {
        unwatchDay(node);
        node.replaceWith(fresh);
        state.agenda.nodes.set(iso, fresh);
        watchDay(fresh);
      });
    }
  }

  // The first drawn day after this one — something below the change to measure
  // against when the change itself is above the reading position.
  function nextDayNode(iso) {
    for (let at = shiftDay(iso, 1); at <= state.agenda.last; at = shiftDay(at, 1)) {
      const node = state.agenda.nodes.get(at);
      if (node) return node;
    }
    return null;
  }

  /* ─────────────────────────── The month rail ─────────────────────────── */

  // Seven cells, the month you are reading in the middle. So an end cell is
  // three months away and anywhere within half a year is two taps — against
  // twenty thumb-flicks, which is what a day-at-a-time scroll costs.
  const RAIL_SLOTS = 7;
  function firstOfMonth(key) { return `${key}-01`; }
  function renderRail() {
    const rail = $('rail');
    const here = state.agenda.month || monthOf(state.day);
    rail.replaceChildren();
    const half = (RAIL_SLOTS - 1) / 2;
    for (let i = -half; i <= half; i++) rail.append(railCell(shiftMonth(here, i), i === 0));
  }
  function railCell(key, here) {
    const [y, m] = key.split('-').map(Number);
    const at = new Date(y, m - 1, 1);
    const known = state.agenda.known;
    const beyond = known && (`${key}-31` < known.from || firstOfMonth(key) > known.until);
    const hasToday = !here && key === monthOf(todayIso());
    return el('button', {
      class: (here ? 'here' : '') + (beyond ? ' beyond' : '') + (hasToday ? ' hastoday' : ''),
      'aria-label': at.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + (hasToday ? ' — today is here' : ''),
      'aria-current': here ? 'true' : null,
      onclick: () => jumpToDate(firstOfMonth(key)),
    }, [
      at.toLocaleDateString(undefined, { month: 'short' }),
      here ? el('span', { class: 'yr', text: String(y) }) : null,
    ]);
  }

  /* ─────────────────────── The answer, before you read ───────────────────
   *
   * The question this app exists to answer, on the move, one-handed, is *am I
   * free, and where am I going next*. Everything else on the screen answers it
   * eventually; this line answers it immediately, and it costs nothing to draw
