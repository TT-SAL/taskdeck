    line.hidden = false;
    line.style.top = `${nowMinutes() / 60 * HOUR}px`;
  }

  function scrollToUsefulHour() {
    const day = state.snap && state.snap.days[0];
    if (!day) return;
    let hour;
    if (day.is_today) {
      hour = Math.max(0, nowMinutes() / 60 - 1);
    } else {
      const starts = day.entries.map((e) => e.start);
      hour = starts.length ? Math.min(7, Math.max(0, Math.min(...starts) / 60 - 1)) : 7;
    }
    if (state.mode === 'agenda') { jumpToDate(state.day, { load: false }); return; }
    window.scrollTo({ top: $('timeline').offsetTop + hour * HOUR - stickyHeight(), behavior: 'auto' });
  }

  /* ───────────────────────────── Sheets ───────────────────────────── */

  function openSheet(kind) {
    // Every sheet draws from the snapshot; before the first one there is
    // nothing to draw, and a half-opened sheet over a dark scrim is worse
    // than a word.
    if (!state.snap) { toast("Nothing to show yet — TaskDeck hasn't answered."); return; }
    state.sheet = kind;
    $('scrim').hidden = false;
    $('sheet').hidden = false;
    renderSheet();
  }
  function closeSheet() {
    state.sheet = null;
    state.renaming = false;
    state.notesDraft = null;
    $('sheet').style.transform = '';
    $('sheet').classList.remove('springing');
    $('scrim').hidden = true;
    $('sheet').hidden = true;
    $('sheet').replaceChildren();
    if (state.selected) { state.selected = null; render(); }
  }
  function grip() {
    const node = el('button', { class: 'grip', 'aria-label': 'Close' }, [el('i')]);
    let held = null;
    const spring = () => {
      const sheet = $('sheet');
      sheet.classList.add('springing');
      sheet.style.transform = '';
      setTimeout(() => sheet.classList.remove('springing'), 200);
    };
    node.addEventListener('pointerdown', (e) => {
      held = { y: e.clientY, dy: 0 };
      $('sheet').classList.remove('springing');
      try { node.setPointerCapture(e.pointerId); } catch (_) {}
    });
    node.addEventListener('pointermove', (e) => {
      if (!held) return;
      held.dy = Math.max(0, e.clientY - held.y);
      $('sheet').style.transform = `translateY(${held.dy}px)`;
    });
    node.addEventListener('pointerup', () => {
      if (!held) return;
      const { dy } = held;
      held = null;
      // Far enough down is a dismissal; barely moved at all is a tap. In
      // between, it goes back — a half-committed drag should not decide.
      if (dy > 60 || dy <= 8) closeSheet();
      else spring();
    });
    node.addEventListener('pointercancel', () => { held = null; spring(); });
    // Only the synthetic click Enter and Space produce, so a real pointer never
    // fires twice against the decision `pointerup` already made.
    node.addEventListener('click', (e) => { if (e.detail === 0) closeSheet(); });
    return node;
  }

  function sheetFoot() {
    return el('div', { class: 'sheetfoot' }, [
      // Notes used to be a third of the bottom bar, for something opened once a
      // week. It lives beside the tasks it is about instead.
      state.sheet === 'tray' ? el('button', { text: 'Notes', onclick: () => openSheet('notes') }) : null,
      state.sheet === 'tray' ? el('button', { text: 'Look', onclick: () => openSheet('look') }) : null,
      el('button', { text: 'Close', onclick: closeSheet }),
    ]);
  }

  function renderSheet() {
    const sheet = $('sheet');
    sheet.replaceChildren(grip());
    if (state.sheet === 'item') renderItemSheet(sheet);
    else if (state.sheet === 'tray') renderTraySheet(sheet);
    else if (state.sheet === 'new') renderNewSheet(sheet);
    else if (state.sheet === 'notes') renderNotesSheet(sheet);
    else if (state.sheet === 'look') renderLookSheet(sheet);
    sheet.append(sheetFoot());
  }

  // The desktop notepad. Read here, and replaced whole with Save — never per
  // keystroke, so the desk and the phone cannot fight over a sentence.
  /* ─────────────────────────── Choosing the picture ───────────────────────
   *
   * Pick, move, save. The crop happens here rather than on the server because
   * only the person holding the phone knows which part of the picture they
   * want behind their week — and because sending the crop rather than the
   * original means a twelve-megapixel photograph never crosses the link.
   *
   * The image is moved with a CSS transform on an `<img>`, not redrawn on a
   * canvas per frame: a transform is composited and a canvas redraw is not,
   * and this has to be smooth on a phone that struggles. The canvas is touched
   * exactly once, on Save.
   */
  // One and a half times the 720x1560 the server serves. Sending it at exactly
  // the served size would mean the only resample in the whole chain is this
  // canvas's own bilinear draw; sending it larger lets the server's Lanczos
  // filter do the downscale, which is sharper and quieter than bilinear, and
  // costs a few hundred kilobytes on a link that is a house away.
  const CROP_W = 1080, CROP_H = 2340;

  function renderLookSheet(sheet) {
    sheet.append(el('h2', { text: 'Background' }));
    sheet.append(el('div', {
      class: 'kindline',
      text: 'Pick a picture, move and pinch it into the frame, then save. It is cropped here and kept on the desk.',
    }));

    const frame = el('div', { class: 'cropframe' });
    const img = el('img', { class: 'cropimg', alt: '' });
    frame.append(img);
    // The frame is the shape of the phone's own screen, so what you line up is
    // what you get.
    frame.append(el('div', { class: 'cropedge' }));
    sheet.append(frame);

    const hint = el('div', { class: 'nothing', text: 'No picture chosen yet.' });
    sheet.append(hint);

    // Where the picture sits inside the frame: a scale and an offset, in the
    // frame's own pixels, with the origin at its centre.
    let art = null;     // { w, h } natural size
    let view = { scale: 1, x: 0, y: 0 };
    const place = () => {
      img.style.transform = `translate(-50%, -50%) translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    };
    const fit = () => {
      if (!art) return;
      const box = frame.getBoundingClientRect();
      // Cover, never contain: an empty corner is not a background.
      view.scale = Math.max(box.width / art.w, box.height / art.h);
      view.x = 0; view.y = 0;
      place();
    };

    const file = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    file.addEventListener('change', () => {
      const chosen = file.files && file.files[0];
      if (!chosen) return;
      hint.textContent = 'Reading…';
      const url = URL.createObjectURL(chosen);
      img.onload = () => {
        art = { w: img.naturalWidth, h: img.naturalHeight };
        hint.textContent = `${art.w} × ${art.h} — drag to move, pinch to zoom`;
        img.style.width = `${art.w}px`;
        img.style.height = `${art.h}px`;
        fit();
        save.disabled = false;
      };
      img.onerror = () => { hint.textContent = 'That file could not be read as a picture.'; };
      img.src = url;
    });
    sheet.append(file);

    // Drag with one finger, pinch with two. Scoped to the frame, and
    // `touch-action: none` on it so the page underneath does not scroll away
    // while the picture is being placed.
    let hold = null;
    const span = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    frame.addEventListener('touchstart', (e) => {
      if (!art) return;
      e.preventDefault();
      const t = e.touches;
      hold = { x: t[0].clientX, y: t[0].clientY, view: { ...view }, span: t.length > 1 ? span(t) : 0 };
    }, { passive: false });
    frame.addEventListener('touchmove', (e) => {
      if (!hold || !art) return;
      e.preventDefault();
      const t = e.touches;
      if (t.length > 1 && hold.span > 0) {
        view.scale = Math.max(0.05, hold.view.scale * (span(t) / hold.span));
      } else {
        view.x = hold.view.x + (t[0].clientX - hold.x);
        view.y = hold.view.y + (t[0].clientY - hold.y);
      }
      place();
    }, { passive: false });
    for (const done of ['touchend', 'touchcancel']) {
      frame.addEventListener(done, () => { hold = null; }, { passive: true });
    }

    const save = el('button', { class: 'primary', text: 'Save', disabled: true, onclick: async () => {
      if (!art) return;
      save.disabled = true;
      hint.textContent = 'Sending…';
      try {
        await sendBackground(img, art, view, frame.getBoundingClientRect());
        hint.textContent = 'Saved. It is on the desk now.';
        await load({ quiet: true });
        closeSheet();
        toast('Background changed');
      } catch (error) {
        hint.textContent = error.message || 'That did not go through.';
        save.disabled = false;
      }
    } });

    sheet.append(el('div', { class: 'section actions' }, [
      el('button', { text: 'Choose picture…', onclick: () => file.click() }),
      save,
    ]));
    // The two dials. They act on the picture already on the server, so they
    // work whether it came from here or from the desk — and they are sent on
    // release rather than per step, because each one re-encodes the picture.
    // From the snapshot's own `dials`, which the server sends whether or not
    // there is a picture. Seeding these from a literal would show the file's
    // real settings as 11/39 on a board with no picture — and the first touch
    // of either slider would write that fiction back over the file.
    const sent = (state.snap && state.snap.dials) || {};
    const dials = { blur: sent.blur ?? 11, light: sent.light ?? 39 };
    const dialRow = (label, key, hint) => {
      const out = el('output', { class: 'dialval mono', text: String(dials[key]) });
      const slider = el('input', {
        type: 'range', min: '0', max: '100', step: '1', value: String(dials[key]),
        'aria-label': label,
      });
      const send = async () => {
        out.textContent = String(dials[key]);
        try {
          await api('/api/look', { method: 'POST', body: JSON.stringify(dials) });
          await load({ quiet: true });
        } catch (error) { toast(error.message); }
      };
      slider.addEventListener('input', () => { dials[key] = Number(slider.value); out.textContent = slider.value; });
      slider.addEventListener('change', send);
      return el('div', { class: 'dial' }, [
        el('div', { class: 'diallabel' }, [el('span', { text: label }), out]),
        slider,
        el('div', { class: 'dialhint', text: hint }),
      ]);
    };
    sheet.append(el('div', { class: 'section' }, [
      dialRow('Blur', 'blur', 'Softens the picture so the words come forward.'),
      dialRow('Brightness', 'light', 'How light the picture may get. Lower is easier to read on.'),
    ]));

    sheet.append(el('div', { class: 'section actions' }, [
      el('button', { text: 'Use the desk\u2019s picture', onclick: async () => {
        hint.textContent = 'Clearing…';
        try {
          // An empty body means "use the desk's": sent as a header rather than
          // as zero bytes, because a zero-length body is indistinguishable from
          // no body at all on the way out.
          await api('/api/background', { method: 'POST', headers: { 'X-TaskDeck-Clear': '1' }, body: ' ' });
          await load({ quiet: true });
          closeSheet();
          toast('Back to the desk\u2019s picture');
        } catch (error) { hint.textContent = error.message; }
      } }),
    ]));
  }

  // The one moment a canvas is touched: the frame's contents, redrawn above the
  // size the server serves, and handed over as a JPEG.
  async function sendBackground(img, art, view, box) {
    const canvas = document.createElement('canvas');
    canvas.width = CROP_W;
    canvas.height = CROP_H;
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('This browser cannot crop a picture.');
    ctx.imageSmoothingQuality = 'high';
    // The frame maps onto the canvas by one factor, so everything below is the
    // same arithmetic the transform did, in canvas units.
    const k = CROP_W / box.width;
    const drawn = { w: art.w * view.scale * k, h: art.h * view.scale * k };
    ctx.drawImage(
      img,
      CROP_W / 2 + view.x * k - drawn.w / 2,
      CROP_H / 2 + view.y * k - drawn.h / 2,
      drawn.w,
      drawn.h,
    );
    const blob = await new Promise((ok) => canvas.toBlob(ok, 'image/jpeg', 0.92));
    if (!blob) throw new Error('The picture could not be prepared.');
    await api('/api/background', { method: 'POST', body: await blob.arrayBuffer() });
  }

  function openItem(id, session) {
    state.selected = { id, session: session == null ? null : session };
    state.renaming = false;
    render();
    openSheet('item');
  }

  function field(labelText, control) {
    return el('div', { class: 'field' }, [el('label', { text: labelText }), control]);
  }
  function select(options, current, onchange) {
    const node = el('select', { onchange: (e) => onchange(e.target.value) });
    for (const option of options) {
      node.append(el('option', { value: option.value, selected: String(option.value) === String(current), text: option.label }));
    }
    return node;
  }
  function durationSelect(current, onchange) {
    return select(durationOptions(current).map((m) => ({ value: m, label: dur(m) })), current, (v) => onchange(Number(v)));
  }

  function renderItemSheet(sheet) {
    const sel = state.selected;
    const item = sel && state.items.get(sel.id);
    if (!item) { closeSheet(); return; }
    const day = state.snap.days[0];
    const entry = day.entries.find((e) => e.id === item.id && (e.session === sel.session || (sel.session == null && e.session == null)));
    const accent = colorOf(item.color);
    const isTask = item.kind === 'task', isEvent = item.kind === 'event', isRoutine = item.kind === 'routine';

    // Name — tap to rename.
    const heading = el('h2');
    if (state.renaming) {
      const input = el('input', { value: item.name, 'aria-label': 'Name', maxlength: NAME_MAX });
      // Enter commits, and the blur that follows the redraw must not commit
      // again; Escape cancels, and its blur must not commit at all.
      let settled = false;
      const commit = async () => {
        if (settled) return;
        settled = true;
        const name = input.value.trim();
        state.renaming = false;
        if (name && name !== item.name) await send({ op: 'rename', id: item.id, name });
        else renderSheet();
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { settled = true; state.renaming = false; renderSheet(); }
      });
      input.addEventListener('blur', commit);
      heading.append(input);
      setTimeout(() => { input.focus(); input.select(); }, 0);
    } else {
      heading.append(el('button', { text: item.name || '(unnamed)', onclick: () => { state.renaming = true; renderSheet(); } }));
    }
    sheet.append(heading);

    const kindBits = [];
    if (isTask) {
      if (item.duration) kindBits.push(`takes ${dur(item.duration)}${item.planned ? ` · ${dur(item.planned)} booked` : ''}`);
      else if (item.planned) kindBits.push(`${dur(item.planned)} booked`);
      if (item.deadline) kindBits.push(`due ${localToText(item.deadline)}`);
    }
    if (isEvent && item.deadline) kindBits.push(localToText(item.deadline) + (item.duration ? ` for ${dur(item.duration)}` : ''));
    if (isRoutine && item.repeat) kindBits.push(`${item.repeat.summary} at ${hhmm(item.repeat.start)} for ${dur(item.repeat.minutes)}`);
    sheet.append(el('div', { class: 'kindline', style: `--accent:${accent}` }, [
      el('span', { class: 'dot' }),
      el('span', { text: item.kind[0].toUpperCase() + item.kind.slice(1) }),
      kindBits.length ? el('span', { text: '· ' + kindBits.join(' · ') }) : null,
    ]));
    // What this sheet shows is the board as last seen; edits made here that
    // could not be sent yet are not in it, and it says so.
    const waiting = waitingFor(item.id);
    if (waiting) {
      sheet.append(el('div', { class: 'waiting', text: `${waiting} change${waiting === 1 ? '' : 's'} to this ${waiting === 1 ? 'is' : 'are'} waiting to be sent — what is shown here is from before ${waiting === 1 ? 'it' : 'them'}.` }));
    }

    // The block on this day, if one is selected.
    if (entry && !entry.marker) {
      const section = el('div', { class: 'section' });
      section.append(el('h3', { text: isRoutine ? 'This block (moves the rule)' : 'This block' }));
      // The other half of a move — the length when the start changes, the
      // start when the length does — is read at the moment of the tap, not
      // from when the sheet was drawn: the desk may have moved the block
      // since, and a stale half would move it back.
      const live = () => ((state.snap && state.snap.days[0].entries) || []).find((e) => e.id === entry.id && e.session === entry.session) || entry;
      const start = el('input', { type: 'time', step: String(SNAP * 60), value: timeValue(entry.start) });
      start.addEventListener('change', () => {
        const minutes = minutesOf(start.value);
        if (minutes == null) return;
        send({ op: 'move_block', id: item.id, session: entry.session, day: day.date, start: snap(minutes), minutes: live().minutes });
      });
      section.append(field('Starts', start));
      section.append(field('Length', durationSelect(entry.minutes, (minutes) =>
        send({ op: 'move_block', id: item.id, session: entry.session, day: day.date, start: live().start, minutes }))));
      if (isTask && entry.session != null) {
        section.append(el('div', { class: 'actions' }, [
          el('button', { text: '↩ Remove this block', onclick: () => send({ op: 'remove_block', id: item.id, session: entry.session }) }),
        ]));
      }
      section.append(el('div', { class: 'nothing', text: 'Or hold the block on the timeline and drag it.' }));
      sheet.append(section);
    }

    if (isTask) {
      const section = el('div', { class: 'section' });
      section.append(el('h3', { text: 'Task' }));

      const due = el('input', { type: 'datetime-local', value: item.deadline || '', step: String(SNAP * 60) });
      due.addEventListener('change', () => {
        if (due.value) send({ op: 'set_deadline', id: item.id, deadline: due.value });
      });
      const dueRow = el('div', { class: 'field' }, [
        el('label', { text: 'Due' }),
        el('div', { style: 'display:flex; gap:6px; align-items:center; max-width:70%' }, [
          due,
          item.deadline ? el('button', { class: 'chip', text: '✕', title: 'No deadline', onclick: () => send({ op: 'set_deadline', id: item.id, deadline: null }) }) : null,
        ]),
      ]);
      section.append(dueRow);

      const labels = state.snap.labels;
      if (item.deadline) {
        section.append(field('Severity', select(
          labels.severity.map((label, i) => ({ value: i, label })),
          item.severity == null ? 2 : item.severity,
          (v) => send({ op: 'set_severity', id: item.id, level: Number(v) }))));
      } else {
        section.append(field('Horizon', select(
          labels.horizon_order.map((i) => ({ value: i, label: labels.horizon[i] })),
          item.horizon == null ? 1 : item.horizon,
          (v) => send({ op: 'set_horizon', id: item.id, level: Number(v) }))));
      }

      section.append(field('Takes', durationSelect(item.duration || null, (minutes) => send({ op: 'set_estimate', id: item.id, minutes }))));

      const remaining = item.remaining == null ? 30 : Math.max(SNAP, item.remaining);
      const planAt = el('input', { type: 'time', step: String(SNAP * 60), value: timeValue(day.is_today ? nextQuarter() : 9 * 60) });
      section.append(el('div', { class: 'field' }, [
        el('label', { text: '＋ Block', title: 'Book another block on this day' }),
        el('div', { style: 'display:flex; gap:6px; align-items:center; white-space:nowrap' }, [
          planAt,
          el('button', { class: 'chip', text: `Book ${dur(remaining || 30)}`, onclick: () => {
            const minutes = minutesOf(planAt.value);
            if (minutes == null) return;
            send({ op: 'add_block', id: item.id, day: day.date, start: snap(minutes) });
          } }),
        ]),
      ]));

      const actions = el('div', { class: 'actions' });
      if (item.sessions.length) actions.append(el('button', { text: '↩ Unplan', onclick: () => send({ op: 'unplan', id: item.id }) }));
      actions.append(el('button', { class: 'ok', text: '✓ Done', onclick: async () => {
        if (!confirm(`Mark "${item.name}" as finished?`)) return;
        await send({ op: 'complete', id: item.id }, { refreshSheet: false });
        closeSheet();
      } }));
      section.append(actions);
      sheet.append(section);
    }

    if (isEvent) {
      const section = el('div', { class: 'section' });
      section.append(el('h3', { text: 'Event' }));
      const when = el('input', { type: 'datetime-local', value: item.deadline || '', step: String(SNAP * 60) });
      when.addEventListener('change', () => {
        if (!when.value) return;
        const [d, t] = when.value.split('T');
        const minutes = minutesOf(t);
        if (minutes == null) return;
        send({ op: 'move_block', id: item.id, day: d, start: snap(minutes), minutes: item.duration || 30 });
      });
      section.append(field('When', when));
      section.append(field('For', durationSelect(item.duration || null, (minutes) => send({ op: 'set_estimate', id: item.id, minutes }))));
      sheet.append(section);
    }

    if (isRoutine && item.repeat) {
      const section = el('div', { class: 'section' });
      section.append(el('h3', { text: 'Repeats' }));
      const row = el('div', { class: 'weekdays' });
      const names = state.snap.labels.weekdays;
      for (let i = 0; i < 7; i++) {
        const on = (item.repeat.days >> i) & 1;
        row.append(el('button', { class: on ? 'on' : '', text: names[i][0], title: names[i], onclick: () => {
          // Toggled against the rule as it is now, not as it was drawn.
          const current = state.items.get(item.id);
          const base = current && current.repeat ? current.repeat.days : item.repeat.days;
          send({ op: 'set_repeat', id: item.id, days: base ^ (1 << i), day: day.date });
        } }));
      }
      row.append(el('button', { style: 'width:auto; padding:0 12px', text: 'All', onclick: () => send({ op: 'set_repeat', id: item.id, days: 127, day: day.date }) }));
      row.append(el('button', { style: 'width:auto; padding:0 12px', text: 'Once', onclick: () => send({ op: 'set_repeat', id: item.id, days: 0, day: day.date }) }));
      section.append(row);
      section.append(el('div', { class: 'nothing', text: item.repeat.days ? item.repeat.summary : 'just this day' }));
      sheet.append(section);
    }

    const footer = el('div', { class: 'section actions' });
    footer.append(el('button', { class: 'danger', text: 'Delete', onclick: async () => {
      if (!confirm(`Delete "${item.name}"? It goes to the archive.`)) return;
      await send({ op: 'delete', id: item.id }, { refreshSheet: false });
      closeSheet();
    } }));
    sheet.append(footer);
  }

  function renderTraySheet(sheet) {
    const tray = state.snap.tray;
    const day = state.snap.days[0];
    sheet.append(el('h2', { text: 'Tasks' }));

    // Shown only while the warning is off, because a setting that is at its
    // default does not need a row: the way to turn it off is on the banner it
    // silences, and this is the way back. Without it the choice would be a
    // one-way door with nothing on the page to say it had been made.
    if (state.quietOffline) {
      sheet.append(el('div', { class: 'quietrow' }, [
        el('span', { text: 'Offline warnings are off. The masthead still says how old the day is.' }),
        el('button', { text: 'Turn on', onclick: () => { setQuietOffline(false); renderSheet(); load({ quiet: true }); } }),
      ]));
    }

    // Work booked before the now-line and not ticked off. Above the tabs, so it
    // is on all three of them — and here rather than in the bar, because it is
    // not reversible and nothing irreversible belongs under a resting thumb.
    if (day.behind_minutes > 0) {
      sheet.append(el('button', {
        class: 'reflow',
        text: `⟳ Reflow · ${dur(day.behind_minutes)} behind`,
        title: 'Push what is unfinished past now, in order, around events and routines',
        onclick: reflow,
      }));
    }

    // Two views of the same tasks: what still wants a slot on this day (the
    // desktop tray), and everything, in the order the desktop's left column
    // ranks it.
    const seg = el('div', { class: 'seg' });
    for (const [tab, label] of [['unplanned', `Unplanned · ${tray.due.length + tray.later.length}`], ['all', `All · ${state.snap.ranked.length}`], ['done', 'Done']]) {
      seg.append(el('button', { class: state.trayTab === tab ? 'on' : '', text: label, onclick: () => { state.trayTab = tab; renderSheet(); } }));
    }
    sheet.append(seg);

    if (state.trayTab === 'done') {
      // The tail of the archive: what left the board lately, and a way back
      // for the row that should not have.
      sheet.append(el('div', { class: 'kindline', text: 'What left the board lately. Put back anything that should not have.' }));
      if (!state.snap.done.length) sheet.append(el('div', { class: 'nothing', text: 'nothing archived yet' }));
      for (const row of state.snap.done) {
        sheet.append(el('div', { class: 'card', style: `--accent:${colorOf(row.color)}` }, [
          el('div', { class: 'body' }, [
            el('div', { class: 'name', text: `${row.finished ? '✓' : '✗'} ${row.name}` }),
            el('div', { class: 'meta', text: `${row.when} · ${row.verdict}` }),
          ]),
          el('button', { class: 'chip', text: '↩', title: 'Put it back', 'aria-label': 'Put it back', onclick: async () => {
            const result = await send({ op: 'restore', id: row.id, archived_at: row.archived_at });
            if (result) toast(`"${row.name}" is back on the board`);
          } }),
        ]));
      }
      return;
    }

    if (state.trayTab === 'all') {
      sheet.append(el('div', { class: 'kindline', text: 'Most pressing first, as on the desktop.' }));
      if (!state.snap.ranked.length) sheet.append(el('div', { class: 'nothing', text: 'no tasks on the board' }));
      for (const id of state.snap.ranked) {
        const item = state.items.get(id);
        if (!item) continue;
        const meta = [];
        if (item.deadline) meta.push(`due ${localToText(item.deadline)}`);
        if (item.duration) meta.push(`takes ${dur(item.duration)}`);
        if (item.planned) meta.push(`${dur(item.planned)} booked`);
        if (!item.deadline && item.horizon != null) meta.push(state.snap.labels.horizon[item.horizon].toLowerCase());
        sheet.append(el('button', { class: 'card', style: `--accent:${colorOf(item.color)}`, onclick: () => openItem(item.id, null) }, [
          el('div', { class: 'body' }, [
            el('div', { class: 'name', text: item.name }),
            meta.length ? el('div', { class: 'meta', text: meta.join(' · ') }) : null,
          ]),
        ]));
      }
      return;
    }

    sheet.append(el('div', { class: 'kindline', text: 'Still waiting for a slot. Tap one to put it on this day.' }));

    const input = el('input', { placeholder: 'Add a task…', value: state.quickAddDraft, autocapitalize: 'sentences', maxlength: NAME_MAX });
    input.addEventListener('input', () => { state.quickAddDraft = input.value; });
    // An optional due date, folded away until asked for: most captures are
    // just a name, but "dentist form, due Friday" is the other common one.
    const due = el('input', { type: 'datetime-local', step: String(SNAP * 60), 'aria-label': 'Due', hidden: !state.quickAddDue });
    if (state.quickAddDue) due.value = state.quickAddDue;
    due.addEventListener('change', () => { state.quickAddDue = due.value || null; });
    const dueToggle = el('button', { class: 'chip', text: 'due…', title: 'Give it a due date', onclick: () => {
      due.hidden = !due.hidden;
      if (!due.hidden) { if (!due.value) due.value = `${day.date}T17:00`; state.quickAddDue = due.value; due.focus(); }
      else { due.value = ''; state.quickAddDue = null; }
    } });
    const add = async () => {
      const name = input.value.trim();
      if (!name) return;
      const deadline = due.hidden ? null : (due.value || null);
      state.quickAddDraft = '';
      input.value = '';
      await send({ op: 'quick_add', name, deadline });
      const again = sheet.querySelector('.quickadd input');
      if (again) again.focus();
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    sheet.append(el('div', { class: 'quickadd' }, [input, dueToggle, el('button', { text: 'Add', onclick: add })]));
    sheet.append(el('div', { class: 'field', style: 'min-height:0' }, [due]));

    const group = (title, cards, urgent) => {
      sheet.append(el('div', { class: 'tray-heading' + (urgent ? ' urgent' : '') }, [el('span', { text: title }), el('span', { text: String(cards.length) })]));
      if (!cards.length) { sheet.append(el('div', { class: 'nothing', text: urgent ? 'nothing owed by this day is unplanned' : 'nothing else waiting' })); return; }
      for (const card of cards) {
        const meta = [];
        if (card.duration) meta.push(`takes ${dur(card.duration)}${card.planned ? ` · ${dur(card.planned)} booked` : ''}`);
        else if (card.planned) meta.push(`${dur(card.planned)} booked`);
        if (card.deadline) meta.push(`due ${localToText(card.deadline)}`);
        const node = el('button', { class: 'card', style: `--accent:${colorOf(card.color)}`, onclick: () => openItem(card.id, null) }, [
          el('div', { class: 'body' }, [
            el('div', { class: 'name', text: card.name }),
            meta.length ? el('div', { class: 'meta', text: meta.join(' · ') }) : null,
          ]),
          card.due_in ? el('span', { class: 'due-in' + (card.due_in === 'overdue' ? ' overdue' : ''), text: card.due_in }) : null,
        ]);
        sheet.append(node);
      }
    };
    group(`Due by ${day.is_today ? 'today' : day.weekday}`, tray.due, true);
    group('Backlog', tray.later, false);
  }

  function renderNewSheet(sheet) {
    const draft = state.newDraft;
    const day = state.snap.days[0];
    sheet.append(el('h2', { text: 'New' }));
    sheet.append(el('div', { class: 'kindline', text: `On ${day.weekday}, ${day.label}` }));

    const seg = el('div', { class: 'seg' });
    for (const [kind, label] of [['task', 'Task'], ['event', 'Event'], ['routine', 'Routine']]) {
      seg.append(el('button', { class: draft.kind === kind ? 'on' : '', text: label, onclick: () => { draft.kind = kind; renderSheet(); } }));
    }
    sheet.append(seg);

    const hint = { task: 'Time set aside to work on something. Undated until you give it a due date.',
                   event: 'Something that happens at this time. It goes on the calendar.',
                   routine: 'Time that is simply spoken for — sleep, meals, the commute. Once, unless you make it repeat.' }[draft.kind];
    sheet.append(el('div', { class: 'nothing', text: hint }));

    const name = el('input', { placeholder: draft.kind === 'event' ? 'What happens' : 'What', value: draft.name, autocapitalize: 'sentences', maxlength: NAME_MAX });
    name.addEventListener('input', () => { draft.name = name.value; });
    sheet.append(el('div', { class: 'quickadd' }, [name]));

    const start = el('input', { type: 'time', step: String(SNAP * 60), value: timeValue(draft.start) });
    start.addEventListener('change', () => { const m = minutesOf(start.value); if (m != null) draft.start = snap(m); });
    sheet.append(field('Starts', start));
    sheet.append(field('Length', durationSelect(draft.minutes, (m) => { draft.minutes = m; })));

    sheet.append(el('div', { class: 'section actions' }, [
      el('button', { text: 'Cancel', onclick: closeSheet }),
      el('button', { class: 'primary', text: 'Create', onclick: async () => {
        const result = await send({ op: 'create', kind: draft.kind, name: draft.name.trim(), day: day.date, start: draft.start, minutes: draft.minutes }, { refreshSheet: false });
        if (result && result.id != null) openItem(result.id, draft.kind === 'task' ? 0 : null);
        else closeSheet();
      } }),
    ]));
    setTimeout(() => name.focus(), 0);
  }

  function openNew(startMinutes) {
    state.newDraft = { kind: 'task', name: '', start: startMinutes, minutes: 30 };
    openSheet('new');
  }

  /* ───────────────────────────── Banners ───────────────────────────── */

  function showBanner(message, { retry = false, info = false, actions = [] } = {}) {
    const banner = $('banner');
    banner.className = 'banner' + (info ? ' info' : '');
    const buttons = (retry ? [['Retry', () => load()]] : []).concat(actions);
    banner.replaceChildren(
      el('span', { text: message }),
      buttons.length ? el('span', { class: 'actions' }, buttons.map(([text, onclick]) => el('button', { text, onclick }))) : null,
    );
    banner.hidden = false;
  }
  function hideBanner() { $('banner').hidden = true; }
  let toastTimer = null;
  function toast(message) {
    let node = document.querySelector('.toast');
    if (!node) { node = el('div', { class: 'toast' }); document.body.append(node); }
    node.textContent = message;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.remove(), 3200);
  }
  function showGate() {
    // Nothing else stays up: a sheet would sit over the token field, and the
    // banner over the heading. Edits waiting to be sent are safe in storage
    // and go with the first load after the link is entered — the gate says so.
    closeSheet();
    hideBanner();
    const waiting = outbox().length;
    const note = $('gateNote');
    note.textContent = waiting ? `${waiting} change${waiting === 1 ? '' : 's'} made here ${waiting === 1 ? 'is' : 'are'} kept and sent once the page is open again.` : '';
    note.hidden = !waiting;
    $('gate').hidden = false;
    document.querySelector('.mast').hidden = true;
    $('timeline').hidden = true;
    // The agenda is the default view now, so hiding the timeline alone left a
    // month of somebody's schedule showing behind the token field.
    $('weekgrid').hidden = true;
    $('weather').hidden = true;
    $('alldayRow').hidden = true;
    $('bar').hidden = true;
  }

  /* ───────────────────────────── Wiring ───────────────────────────── */

  function goTo(day) {
    state.day = day;
    state.selected = null;
    closeSheet();
    // Paint the day from storage before asking, exactly as opening the page
    // does. Stepping through days on mobile data is otherwise a blank frame
    // each time.
    const held = recall(day);
    if (held && (!state.snap || state.snap.days[0].date !== day)) { takeSnapshot(held.snap); render(); }
    load({ span: 7 }).then(scrollToUsefulHour);
  }

  // ‹ › step a day in the day view and a month in the agenda, which is the
  // unit the agenda is paged and cached and railed in.
  const stepBack = () => (state.mode === 'agenda' ? jumpToMonth(-1) : goTo(shiftDay(state.day, -1)));
  const stepOn = () => (state.mode === 'agenda' ? jumpToMonth(1) : goTo(shiftDay(state.day, 1)));
  // ‹ › are gone from the screen: the scrubber in the bar reaches three days or
  // three months either way in one tap, which is further than a step and nearer
  // the thumb. These two survive as what the arrow keys and the swipe call.
  $('modeBtn').addEventListener('click', () => setMode(NEXT_MODE[state.mode] || 'agenda'));
  // On today already, Today brings the now-line back into view — the thing
  // you want after scrolling off to look at the evening.
  $('todayBtn').addEventListener('click', () => {
    // In the weather view Today is what puts the forecast back on today, and
    // takes the reader's finger off whatever hour it was on.
    if (state.mode === 'weather') { showWeatherDay(placeClock().iso); window.scrollTo(0, 0); return; }
    if (state.mode === 'agenda') { jumpToDate(todayIso()); return; }
    if (state.day === todayIso() && state.snap) scrollToUsefulHour();
    else goTo(todayIso());
  });
  $('trayBtn').addEventListener('click', () => openSheet('tray'));
  // A declaration rather than a listener, because the button that calls it is
  // now drawn inside the Tray sheet.
  async function reflow() {
    const result = await send({ op: 'reflow', day: state.day });
    if (result) toast(result.moved ? `Moved ${result.moved} block${result.moved === 1 ? '' : 's'} past now` : 'Nothing to move');
  }
  $('newBtn').addEventListener('click', () => openNew(state.snap && state.snap.days[0].is_today ? nextQuarter() : 9 * 60));
  $('scrim').addEventListener('click', closeSheet);
  $('emptyTap').addEventListener('click', (e) => {
    const rect = $('lanes').getBoundingClientRect();
    const minutes = snap((e.clientY - rect.top) / HOUR * 60);
    openNew(Math.max(0, Math.min(24 * 60 - 30, minutes)));
  });
  $('gateGo').addEventListener('click', () => {
    const token = $('gateToken').value.trim();
    if (!token) return;
    location.href = `/?token=${encodeURIComponent(token)}`;
  });

  // A swipe across the day steps it, like the arrow keys on the desktop.
  //
  // `touchStart` is also how `pruneAgenda` knows a finger is down and refuses
  // to mutate the list mid-fling, so it is recorded in both views and it has to
  // be cleared on every path a touch can end by.
  let touchStart = null;
  document.addEventListener('touchstart', (e) => {
    // A second finger's touchstart reports finger *one's* current position, so
    // without this a pinch re-baselines the gesture and lifting the second
    // finger far from the first steps the day.
    if (e.touches.length > 1) { touchStart = null; return; }
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  // Without this, one touch taken by the system leaves `touchStart` set for the
  // rest of the session — after which `pruneAgenda` never trims again and the
  // list grows past its budget with no symptom but a phone that gets slow.
  document.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    const start = touchStart;
    touchStart = null;
    if (!start || state.sheet) return;
    // Not while a block is being moved, or has just been. Both flags are
    // checked because `endDrag` sets them together and nothing here can rely on
    // whether `pointerup` or `touchend` arrives first: a quarter-hour nudge
    // with a sideways arc would otherwise send the move *and* step the day —
    // and if the step won the race, book the move on the day it stepped to.
    if (drag || suppressClick) return;
    // Only in the day view. In the agenda a sideways flick during a long scroll
    // is a slip of the thumb, not a request to travel a month.
    if (state.mode !== 'day') return;
    const dx = e.changedTouches[0].clientX - start.x;
    const dy = e.changedTouches[0].clientY - start.y;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) goTo(shiftDay(state.day, dx < 0 ? 1 : -1));
  }, { passive: true });
  // The bar is a control surface, and the fence is the element rather than a
  // threshold — so nothing added to it later has to remember to opt out of the
  // swipe. The finger is still recorded, because dragging on a fixed bar can
  // still fling the list underneath it.
  for (const type of ['touchstart', 'touchend', 'touchcancel']) {
    $('bar').addEventListener(type, (e) => {
      e.stopPropagation();
      touchStart = type === 'touchstart' && e.touches.length === 1
        ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
        : null;
    }, { passive: true });
  }

  document.addEventListener('keydown', (e) => {
    if (state.sheet || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) {
      if (e.key === 'Escape' && state.sheet) closeSheet();
      return;
    }
    if (e.key === 'ArrowLeft') stepBack();
    if (e.key === 'ArrowRight') stepOn();
    if (e.key === 't' || e.key === 'T') {
      if (state.mode === 'weather') showWeatherDay(placeClock().iso);
      else if (state.mode === 'agenda') jumpToDate(todayIso());
      else goTo(todayIso());
    }
    if (e.key === 'w' || e.key === 'W') setMode(NEXT_MODE[state.mode] || 'agenda');
  });

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // Listen rather than poll: `/api/wait` answers the moment anything changes
  // at the desk (or after ~25 s with nothing new), so a drag on the desktop
  // shows here within a second. A slow poll stays underneath as a net.
  async function watch() {
    let failures = 0;
    for (;;) {
      if (document.visibilityState !== 'visible') { await sleep(1000); continue; }
      if (!state.snap) {
        // Nothing loaded yet — the desktop was off when the page opened.
        // Keep trying, gently, so it comes alive on its own when TaskDeck does.
        await sleep(5000);
        await load({ quiet: true });
        continue;
      }
      const seen = state.snap.version;
      try {
        const answer = await api(`/api/wait?version=${seen}`);
        failures = 0;
        // Compared with what the page holds *now*, not with `seen`: an edit
        // made from this page already refetched, and its own wake-up must
        // not fetch the same day again.
        if (answer && state.snap && answer.version !== state.snap.version) {
          await load({ quiet: true });
          // If the refetch did not move us to what the wake-up announced, the
          // two ends disagree about a number rather than about a day, and
          // asking again immediately would spin at network speed. A server
          // whose pulse had never been published did exactly that: thousands
          // of requests a second, on a phone, in a pocket. This costs nothing
          // when the versions do converge, which is every ordinary edit.
          if (state.snap && state.snap.version === seen) await sleep(5000);
        }
      } catch (error) {
        if (error.status === 401) { showGate(); return; }
        failures += 1;
        await sleep(Math.min(30000, 2000 * failures));
      }
    }
  }

  function startPolling() {
    clearInterval(state.pollTimer);
    let wasToday = todayIso();
    state.pollTimer = setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      // Midnight. Every cached day has `is_today` baked into it, so a list left
      // open overnight would go on marking yesterday — which is the one thing
      // this view has to get right.
      const now = todayIso();
      if (now !== wasToday) {
        const moved = [wasToday, now];
        wasToday = now;
        if (state.mode === 'agenda') {
          state.day = now;
          patchAgenda(moved);
          railAndMasthead();
        }
      }
      // Never redraw a sheet someone is typing into.
      load({ quiet: true });
    }, 60000);
    // The forecast's own clock. It is not the board's — no edit here changes
    // the weather and no wake-up announces it — so it is neither polled with
    // the day nor listened for: it is asked for on a clock of its own, and
    // only while somebody is looking at it.
    setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      if (state.mode !== 'weather') return;
      // The now-line, the readout and the answer in the masthead are all wrong
      // the minute they are old, and the chart's window rolls on the hour:
      // `tickWeather` moves the first three and redraws only for the last.
      tickWeather();
      loadWeather();
    }, 60000);
    setInterval(() => {
      if (!state.snap) return;
      // "In 25 min" is only true for a minute. The now-line and the glance line
      // are the two things on this page that are wrong the moment they are old.
      if (state.mode === 'day') renderNow(state.snap.days[0]);
      else if (state.mode === 'agenda') renderGlance();
    }, 60000);
    watch();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    // Straight away, off what is already here: a phone that has been in a
    // pocket for twenty minutes must not show a twenty-minute-old answer for
    // as long as a round trip takes, or on a dead network for ever.
    if (state.mode === 'agenda' && state.snap) renderGlance();
    if (state.mode === 'weather') { renderWeather(); loadWeather(); }
    load({ quiet: true });
  });
  // The network coming back is the moment to send what waited.
  window.addEventListener('online', () => {
    if (state.agenda.stalled) { state.agenda.stalled = false; drawEnds(); }
    if (state.mode === 'weather') loadWeather({ force: true });
    load({ quiet: true });
  });
  window.addEventListener('resize', () => {
    measureSticky();
    // The chart is drawn in real pixels at the width it was measured at, so a
    // rotation is the one thing that has to redraw it — and only then, because
    // a resize event also fires when a phone's toolbar slides away.
    if (state.mode === 'weather' && state.weather.report) {
      const plot = $('wxPlot');
      if (Math.round(plot.clientWidth) !== state.weather.width) renderWeather();
    }
  });

  state.token = readToken();
  if (!state.token) {
    showGate();
  } else {
    installManifest();
    labelChrome();
    pruneMonths();
    // Whatever forecast was kept, before anything is asked for: the weather
    // view opens on the last one it saw and says how old it is, exactly as the
    // day and the agenda open on the last day they saw.
    recallWeather();
    // Whatever storage holds, in both modes. The agenda draws its first frame
    // from it; the day view's seven-tap strip takes its dots from the same
    // store, which is why the week's own request could go.
    seedAgenda();
    // The weather view asks for a week of days too: the plan band under its
    // chart is the board's, and the tray badge and ＋ New in the bar still act
    // on today from inside it.
    const span = state.mode === 'agenda' ? 31 : 7;
    if (state.mode === 'agenda') {
      // Nothing is awaited above this line, so the first frame the browser
      // paints already contains the list. `renderAgenda` deliberately does not
      // go through `render()`, which returns early with no snapshot: the days
      // are enough to draw with, and the colours fall back on their own.
      state.day = todayIso();
      renderAgenda();
      drawEnds();
    }
    const held = recall(state.day);
    if (held) { takeSnapshot(held.snap); render(); }
    measureSticky();
    if (state.mode === 'agenda') { railAndMasthead(); jumpToDate(state.day, { load: false }); }
    else if (state.mode === 'weather') { render(); loadWeather(); }
    else scrollToUsefulHour();
    load({ span }).then(() => {
      if (state.mode === 'agenda') {
        if (!state.agenda.first) { seedRun(todayIso()); renderAgenda(); drawEnds(); }
        else growRun();
        jumpToDate(state.day, { load: false });
        growIfShort();
      } else if (state.mode === 'weather') {
        // The board's days have landed; the band under the chart can be drawn.
        renderWeather();
      } else {
        scrollToUsefulHour();
      }
    });
    startPolling();
  }

  // The offline shell. Refused on a plain-http LAN address (not a secure
  // context) — then the page simply has no offline mode, as before.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
