<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskDeck">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>TaskDeck</title>
<style>
  :root {
    --bg: #0f1113;
    /* One material, two depths. At the bottom of the luminance scale a
       boundary is drawn by an edge and a shadow, not by a ratio — the three
       greys this replaced differed by 1.08:1 and 1.11:1, which is to say they
       were one colour doing the work of three. */
    --plate: #191c21;
    --plate-2: #23272d;
    --edge: rgba(232,230,225,0.09);
    --edge-2: rgba(232,230,225,0.22);
    /* A lit hairline, so it reads on a plate and on a photograph alike. */
    --line: rgba(232,230,225,0.10);
    --text: #e8e6e1;
    --muted: #9a9891;
    --danger: #e8707d;
    --ok: #4f9a94;
    --today: #f0c36b;
    --on-today: #0f1113;
    /* The desktop's own now-line colour (`ui.rs`), instead of a second red. */
    --now: #ff785a;
    /* The spine. The monospace column's left edge is at page x = 23 in every
       view — 10px page gutter + 10px plate padding + the row's 3px accent bar
       — and content starts at 23 + 46 + 8 = 77. The masthead's day number,
       every day heading's date, every row's time and every hour label sit in
       it, so one ruled column runs from the top of the screen to the bottom of
       the scroll. `ui-monospace` is a system face and costs nothing. */
    --spine: 46px;
    /* The picture's aspect ratio, and the size both `#field` and `.mast` paint
       it at. They must use the *same explicit size*, not `cover`: `cover`
       resolves against each element's own box, and the masthead's box is 92px
       tall while the field's is the viewport — so the two copies would be
       scaled differently and the picture would break at the masthead's edge.
       `paintField` overwrites `--par` with the real ratio; the default keeps
       the shorthand valid, and an invalid one makes the whole background
       declaration invalid and the masthead transparent. The `+2px` is
       overscan: at some viewport heights the bare product rounds a pixel short
       and leaves a hairline of `--bg` at the bottom edge. */
    --par: 0.4615;
    --photo-size: max(100vw, calc(100vh * var(--par) + 2px));
    --hour: 56px;
    --gutter: 46px;
    --r-s: 4px;
    --r-m: 12px;
    --r-l: 18px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    /* 1 border + 6 top + 44 scrubber + 6 gap + 60 deck + 16 of keep-out below
       the buttons, so a thumb resting at the bottom edge of the screen is not
       already on one. The page's own bottom padding and the toast both sit off
       this number rather than guessing at it. */
    --bar-h: 133px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* `html` carries the ground and `body` must not. Painting order puts a
     negative-z-index positioned child *below* body's own in-flow background,
     so an opaque body would hide the field completely — a background that
     costs everything and shows nothing. */
  html { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body { margin: 0; padding: 0; background: transparent; color: var(--text); }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior-y: contain;
    padding-bottom: calc(var(--bar-h) + var(--safe-bottom) + 8px);
  }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* The one layer the picture lives on. `width`/`height` in `vw`/`vh` rather
     than `inset: 0`, because the masthead's `background-size` is in the same
     units and the two must not disagree about what the viewport is when
     Firefox for Android hides its toolbar.

     Never `background-attachment: fixed` (Gecko gives it its own picture-cache
     slice and it stalls against exactly that dynamic toolbar), never
     `backdrop-filter`, never `filter`, never `will-change` — a fixed element
     already has its own spatial node, so the compositor does not repaint it as
     the scroll offset changes. And never a scroll listener. */
  #field {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1; pointer-events: none;
    background:
      var(--photo, none) 50% 0 / var(--photo-size) no-repeat,
      linear-gradient(180deg, var(--wash-a, var(--bg)), var(--wash-b, var(--bg)));
  }
  #field.dim { opacity: 0.55; }

  /* ── Masthead ── */
  /* An aperture cut into the field, not a window through it.
     `#field` sits at `z-index: -1`, which paints *below* body's in-flow
     content — so a translucent masthead would reveal the scrolling list, not
     the photograph. Instead it paints the same image in its own stack, at the
     same explicit size and origin: both boxes are 100vw wide and both are
     anchored at viewport y = 0, so `50% 0` resolves identically in each and the
     picture is continuous across the masthead's bottom edge. A JPEG has no
     alpha and the size covers the box, so it stays fully opaque and nothing of
     the list can ever show through. The veil's dark lower edge is the
     separation; there is no border. */
  .mast {
    position: sticky; top: 0; z-index: 5;
    padding: calc(8px + var(--safe-top)) 14px 8px 23px;
    background:
      var(--veil, none),
      var(--photo, none) 50% 0 / var(--photo-size) no-repeat,
      linear-gradient(180deg, var(--wash-a, var(--bg)), var(--wash-b, var(--bg)));
  }
  .chip {
    min-width: 44px; height: 40px; padding: 0 14px; border-radius: 12px;
    background: var(--plate); color: var(--text); font-weight: 600;
  }
  .chip:active { background: var(--plate-2); }
  /* The day number is the headline this view never had — the largest thing on
     screen was 16px — and it sits at the head of the spine, so the ruled column
     begins in the masthead and runs to the bottom of the scroll. It is also
     what every verb in the bar acts on, which a 12px grey line used to say. */
  .date { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .daynum { flex: 0 0 var(--spine); font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--text); }
  .daynum.today { color: var(--today); }
  .dwhen { min-width: 0; }
  .dwd { font-size: 13px; font-weight: 700; color: var(--text); line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dmo { font-size: 12px; color: var(--text); line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .behindnote { color: var(--today); font-weight: 700; }
  /* Both views give the masthead the same height, which is what lets a mode
     change re-measure to the same number and leave the two observers alone. */
  .summary { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 38px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The line that answers the question before anything is read. Two rows of
     fixed height, because the masthead is sticky and everything below it is
     positioned from its height — a line that grew and shrank would move the
     whole list under the reader's thumb. */
  .summary.glance {
    display: grid; grid-template-columns: 10px 1fr; gap: 0 8px;
    align-items: center; margin-top: 6px; min-height: 38px;
  }
  .summary.glance .gdot {
    grid-row: 1 / span 2; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); align-self: center;
  }
  .summary.glance .gdot.hollow { background: none; border: 2px solid var(--accent); }
  .summary.glance .glead {
    font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .summary.glance .gdetail {
    font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .week { display: flex; gap: 4px; height: 44px; }
  .week button {
    flex: 1; height: 44px; border-radius: 10px; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  }
  .week button .wd { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .week button .dn { font-size: 15px; font-weight: 700; color: var(--text); }
  .week button.today .dn { color: var(--today); }
  .week button.shown { background: var(--plate); }
  .week button.shown .dn { color: var(--text); }
  .week button.shown.today .dn { color: var(--today); }
  .week button:active { background: var(--plate-2); }
  .week .dots { display: flex; gap: 3px; height: 4px; margin-top: 3px; }
  .week .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--c); display: block; }
  textarea.notes {
    width: 100%; min-height: 40vh; background: var(--plate-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; line-height: 1.4; resize: vertical;
  }
  /* Reflow moves what is unfinished. It is not reversible, so it does not live
     under a resting thumb — it lives at the top of the Tray sheet, one
     deliberate tap in, and the deck only points at it. */
  .reflow {
    width: 100%; height: 44px; padding: 0 14px; margin: 0 0 12px; border-radius: 12px;
    font-weight: 700; font-size: 14px;
    background: #2a2416; color: var(--today); border: 1px solid #4a3d1f;
  }
  .reflow:active { filter: brightness(1.2); }

  /* ── Timeline ── */
  .timeline { position: relative; margin: 6px 12px 0 8px; height: calc(var(--hour) * 24); }
  .hourline {
    position: absolute; left: 0; right: 0; height: var(--hour);
    border-top: 1px solid var(--line);
  }
  .hourline.small { opacity: 0.55; }
  .hourline span {
    position: absolute; left: 0; top: -0.6em; width: var(--gutter);
    padding-left: 4px; font-size: 12px; color: var(--muted);
  }
  .lanes { position: absolute; top: 0; bottom: 0; left: var(--gutter); right: 0; }
  .entry {
    position: absolute; border-radius: 8px; overflow: hidden;
    padding: 4px 8px; font-size: 14px; line-height: 1.25;
    border-left: 3px solid var(--accent);
    background: var(--ground);
    color: var(--text);
  }
  .entry .time { font-size: 11px; color: var(--muted); }
  .entry .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry.short { display: flex; gap: 8px; align-items: baseline; padding-top: 2px; }
  .entry.short .name { flex: 1; }
  .entry.routine {
    background: transparent; border: 1px dashed var(--accent); border-left-width: 3px;
    color: var(--muted);
  }
  .entry.routine .name::before { content: "↻ "; }
  .entry.selected { outline: 2px solid var(--text); outline-offset: 1px; }
  .entry:active { filter: brightness(1.2); }
  .entry.dragging {
    z-index: 4; opacity: 0.95; filter: brightness(1.25);
    box-shadow: 0 10px 28px rgba(0,0,0,0.55); outline: 2px solid var(--text); outline-offset: 1px;
    transition: none;
  }
  .ghost {
    position: absolute; border-radius: 8px; padding: 3px 8px;
    border: 1px solid var(--accent); background: rgba(0,0,0,0.25);
    color: var(--muted); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    pointer-events: none; opacity: 0.8;
  }
  /* Somebody else's calendar (§23). Deliberately unlike a block of your own:
     no fill, a bar in the calendar's own colour, and `pointer-events: none`
     so a tap goes to the timeline underneath. Nothing here can be edited,
     so nothing here should invite a tap. */
  /* A block is as tall as its event is long, so the text uses that height
     rather than being cut to one line with an ellipsis — a course summary
     runs past a hundred characters and the room is at the end of it. */
  /* Somebody else's calendar. The mark of it is the bar down the left and the
     flat, unlit ground — not a hatch: diagonal stripes read as "cancelled" or
     "disabled", which is the wrong thing to say about a lecture you have to be
     at, and they make the text underneath harder to read for no gain. */
  .subscribed {
    position: absolute; border-radius: 6px; padding: 3px 8px;
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    background: rgba(255,255,255,0.035);
    color: var(--muted); font-size: 12px; overflow: hidden;
    line-height: 1.25; overflow-wrap: anywhere; pointer-events: none;
    display: flex; flex-direction: column;
  }
  /* The name may be cut; the room may not. Two overlapping lectures each get
     half the width, and the name is a hundred characters while the room is
     thirteen — so the name is clamped and the room keeps its line, because the
     room is the part you are looking for. */
  .subscribed .what {
    min-height: 0; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
  }
  .subscribed .where { flex: 0 0 auto; color: var(--accent); font-size: 11px; margin-top: 1px; }
  /* A course period rather than an appointment: further back still. */
  /* A course period rather than an appointment: fainter still, and no ground
     of its own so the lectures over it stay legible. */
  .subscribed.backdrop { opacity: 0.5; background: none; border-left-style: dotted; }
  .allday {
    display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
    border-radius: 999px; padding: 2px 9px; margin: 0 6px 4px 0;
    border: 1px solid var(--accent); color: var(--muted); font-size: 12px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .alldayrow { padding: 0 14px 2px; display: flex; flex-wrap: wrap; }
  .marker {
    position: absolute; height: 22px; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text); padding-right: 6px; overflow: hidden;
  }
  .marker::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; border-top: 2px solid var(--accent); }
  .marker .label {
    position: relative; margin-left: 6px; padding: 1px 7px; border-radius: 6px;
    background: var(--accent); color: #0f1113; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .marker.due .label::before { content: "⚑ "; }
  .nowline { position: absolute; left: calc(var(--gutter) - 8px); right: 0; height: 0; border-top: 2px solid var(--now); z-index: 2; pointer-events: none; }
  .nowline::before { content: ""; position: absolute; left: -4px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
  .empty-tap { position: absolute; inset: 0; }

  /* ── Week ── */
  .weekgrid { margin: 6px 0 0; }
  /* Scrolling to a date months away is O(distance) in thumb-flicks: a day is
     about 250px, a screen holds three of them, so a hard flick is roughly a
     week and next February is twenty flicks. Seven month cells and two taps
     get there instead, and take nothing away from the scroll. */
  .rail { display: flex; gap: 4px; height: 44px; }
  .rail button {
    flex: 1; min-width: 0; height: 44px; border-radius: 10px; text-align: center; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  /* Where today is, when today is not where you are reading — the Today button
     sits directly under this cell. */
  .rail button.hastoday::after {
    content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--today); margin-top: 3px;
  }
  .rail button.here { background: var(--plate); color: var(--text); font-weight: 700; }
  .rail button .yr { font-size: 9px; letter-spacing: 0; opacity: 0.55; text-transform: none; }
  .rail button.beyond { opacity: 0.4; }
  /* The reading position is moved by `holdPlace` and by nothing else. Anything
     inserted above it that skips `holdPlace` will jump the list by its full
     height, silently, and only on a phone. */
  /* Ten pixels of field down both sides and between every day. That
     passe-partout is what makes the plates read as objects on a ground rather
     than as a list with a picture behind it. */
  .weekgrid { overflow-anchor: none; padding: 0 10px; }
  .aend { min-height: 1px; }
  .aend .card {
    margin: 10px 4px 14px; padding: 12px 14px; border-radius: 12px;
    background: var(--plate); border: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.45;
  }
  .aend .card b { color: var(--text); font-weight: 700; }
  .aend .card button {
    margin-top: 10px; padding: 8px 12px; border-radius: 10px;
    background: var(--plate-2); color: var(--text); border: 1px solid var(--line); font: inherit; font-weight: 700;
  }
  .aend .waiting { padding: 14px 4px 20px; color: var(--muted); font-size: 12px; }
  /* The week is a list, not a grid.
     Seven columns on a phone gives each day about fifty pixels, and a course is
     called "MOLE-101, Biokemia, Biokemia 3.9.–20.10.2026 - Luentokurssi" and
     happens in "Metsätieteiden talo, sali 110". No orientation of a time grid
     fixes that: turned on its side, a ninety-minute event across a 24-hour
     width is twenty-eight pixels, which is worse than the fifty it had. A row
     per event is the only shape that gives the words the whole screen — and
     reading what is on is what a week is for. The shape of the hours lives in
     the day view, which is one column wide and can afford it. */
  .weekbody { display: block; position: relative; }
  /* `contain` and not `content-visibility: auto`: skipping the layout of
     off-screen days makes their height a guess, the document height drifts by
     a fifth over a year of them, and landing on a named date — which is the
     whole point of this view — misses by a screenful. */
  /* A day with something on it is a plate — an object on a field, with an edge
     and a shadow rather than a 1.1:1 change of grey. Never `overflow: hidden`:
     it would make `.aday` the sticky scroll container and freeze the heading.
     `contain: layout style` does not clip the shadow the way `contain: paint`
     would. */
  .aday {
    margin: 0 0 10px; contain: layout style;
    background: var(--plate); border-radius: var(--r-m); padding: 0 10px 10px;
    box-shadow: 0 0 0 1px var(--edge), 0 1px 2px rgba(0,0,0,0.5);
  }
  /* A free day is a void the field shows through, and its heading is static —
     a transparent sticky heading would let its own line scroll through it. */
  .aday.free { background: none; box-shadow: none; padding: 0 10px 4px; }
  .aday.free > button { position: static; background: none; border-bottom: 0; border-radius: 0; }
  /* Sticky on the heading and never on the section. Gecko refuses a sticky
     frame as a scroll anchor, so a sticky section would compensate none of a
     prepend while a sticky heading leaves the section itself eligible. */
  .aday > button {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    /* One pixel further under, so no seam can appear between two sticky layers
       even when the arithmetic is exact: a compositor rounding each of them to
       device pixels independently can otherwise leave a hairline. */
    position: sticky; top: calc(var(--mast-h) - 1px); z-index: 3;
    /* Opaque, always. It is sticky, there are dozens of them, and it carries
       11px text; a translucent one would show the rows sliding under it. The
       -10px bleed puts its ground across the plate's full width while its
       padding still lands the date on the spine at page x = 23. */
    background: var(--plate-2); border: 0; border-bottom: 1px solid var(--line);
    border-radius: var(--r-m) var(--r-m) 0 0;
    margin: 0 -10px; width: calc(100% + 20px);
    color: var(--muted); padding: 9px 10px 6px 13px; text-align: left; font: inherit;
  }
  /* A day the calendars were never read for. Not the same as a free one. */
  .aday.unknown > button { border-bottom-style: dashed; }
  /* The date comes down from 14/700 and the event name goes up from 13/400:
     the chrome was set larger than the content it labels. */
  .aday > button .adate { flex: 0 0 calc(var(--spine) - 3px); font-size: 13px; font-weight: 600; color: var(--text); }
  .aday > button .aword { font-size: 14px; color: var(--text); }
  .aday > button .acount { margin-left: auto; font-size: 11px; color: var(--muted); }
  .aday.today > button .adate { color: var(--today); }
  .arow {
    display: flex; gap: 8px; align-items: baseline;
    padding: 5px 0; border-left: 3px solid var(--accent); margin: 3px 0 0;
    background: var(--ground); border-radius: 0 var(--r-s) var(--r-s) 0;
  }
  /* On the spine, in tabular figures, so every colon lines up down the whole
     scroll — the desktop calls this the date spine and runs its planner in
     monospace; the phone never picked it up, and it costs no bytes. */
  .arow .at { flex: 0 0 var(--spine); font-size: 12px; line-height: 1.35; color: var(--muted); }
  .arow .at .ae { display: block; color: var(--muted); }
  .arow .abody { min-width: 0; flex: 1; }
  .arow .an { font-size: 14px; color: var(--text); overflow-wrap: anywhere; }
  /* The accent mixed toward the ink: the raw hue managed 2.3:1 here. */
  .arow .aw { display: block; font-size: 12px; color: var(--ink); margin-top: 1px; overflow-wrap: anywhere; }
  /* Somebody else's carries no fill, so it shows the plate: every one of your
     own things has a hue, and everything else does not. */
  .arow.sub { background: none; }
  .arow.sub .an { color: var(--muted); }
  .arow.done { background: none; }
  .arow.done .an { color: var(--muted); text-decoration: line-through; }

  /* ── Bottom bar ── */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: block;
    height: calc(var(--bar-h) + var(--safe-bottom));
    padding: 6px 14px calc(16px + var(--safe-bottom));
    background: var(--plate); border-top: 0;
    border-radius: var(--r-l) var(--r-l) 0 0;
    box-shadow: 0 0 0 1px var(--edge), 0 -14px 30px rgba(0,0,0,0.5);
    user-select: none; -webkit-user-select: none;
  }
  /* Holds its height whichever scrubber is showing — and before the first
     render, when neither is — so the bar never jumps under a thumb. */
  .scrub { height: 44px; }
  .deck { display: flex; gap: 8px; margin-top: 6px; height: 60px; }
  .deck button {
    flex: 1; min-width: 0; height: 60px; border-radius: 14px; font-weight: 700; font-size: 15px;
    background: var(--plate); color: var(--text); border: 1px solid var(--line);
  }
  /* It was 15.17:1 — the highest-contrast object anywhere on the page, 60px
     tall, and the button pressed least often on a schedule check. Inside a
     sheet the primary IS what you came for and keeps its white fill; here it
     is not. */
  .deck button.primary { background: var(--plate-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--edge-2); border-color: transparent; }
  .deck button:active { filter: brightness(1.2); }
  /* The day is running behind. The fact is in the masthead; this only points
     at where the verb lives. */
  .deck button.late { box-shadow: inset 0 -3px 0 var(--today); }
  /* Kills the 300ms tap delay on the things that are only ever tapped. Never
     `.entry`, which is a button too and carries the press-and-hold that lifts
     a block. */
  .deck button, .aday > button, .actions button, .btn { touch-action: manipulation; }
  .count { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 6px; border-radius: 11px; background: var(--plate-2); font-size: 13px; }
  .count.urgent { background: var(--today); color: #0f1113; }

  /* ── Sheets ── */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.68); z-index: 8; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--plate); border-radius: 18px 18px 0 0;
    padding: 8px 16px 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  /* A target, not a decoration: tap it to close, or drag it down. `touch-action:
     none` only over these 32px, so it costs the sheet almost no scroll. */
  .grip { display: block; width: 100%; height: 32px; padding: 0; background: none; touch-action: none; }
  .grip i { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 14px auto 0; }
  .sheet.springing { transition: transform 180ms ease-out; }
  /* Every sheet ends with a way out, and it stays on screen however long the
     list above it is. A Close at the bottom of 88vh of scrolling tasks is not a
     way out of anything one-handed. */
  .sheetfoot {
    position: sticky; bottom: 0; display: flex; gap: 8px;
    background: var(--plate); border-top: 1px solid var(--line);
    padding: 10px 0 calc(16px + var(--safe-bottom));
  }
  .sheetfoot button {
    flex: 1; height: 52px; border-radius: 12px; font-weight: 700;
    background: var(--plate-2); border: 1px solid var(--line); color: var(--text);
  }
  .sheet h2 { margin: 0 0 2px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; word-break: break-word; }
  .sheet h2 button { text-align: left; width: 100%; }
  .sheet h2 input { width: 100%; background: var(--plate-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 18px; font-weight: 700; }
  .kindline { color: var(--muted); font-size: 13px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .section { border-top: 1px solid var(--line); padding: 12px 0; }
  .section h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
  .field label { color: var(--muted); font-size: 14px; }
  .field input, .field select {
    background: var(--plate-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; min-height: 40px; color: var(--text); max-width: 60%;
  }
  .field input[type="time"], .field input[type="datetime-local"] { color-scheme: dark; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button, .btn {
    height: 44px; padding: 0 14px; border-radius: 12px; font-weight: 700;
    background: var(--plate-2); border: 1px solid var(--line); color: var(--text);
    flex: 1 1 auto;
  }
  .actions button.ok { background: var(--ok); color: #0f1113; border-color: transparent; }
  .actions button.danger { color: var(--danger); }
  .actions button.primary { background: #e8e6e1; color: #0f1113; border-color: transparent; }
  .actions button:active { filter: brightness(1.2); }
  .weekdays { display: flex; gap: 6px; flex-wrap: wrap; }
  .weekdays button {
    width: 40px; height: 40px; border-radius: 10px; background: var(--plate-2);
    border: 1px solid var(--line); font-weight: 700; color: var(--muted);
  }
  .weekdays button.on { background: var(--text); color: #0f1113; border-color: transparent; }
  .seg { display: flex; background: var(--plate-2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; height: 38px; border-radius: 9px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--text); color: #0f1113; }

  /* ── Tray ── */
  .quickadd { display: flex; gap: 8px; margin-bottom: 8px; }
  .quickadd input { flex: 1; min-width: 0; background: var(--plate-2); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 46px; }
  .quickadd button { width: 64px; height: 46px; border-radius: 12px; background: var(--text); color: #0f1113; font-weight: 800; }
  .quickadd button.chip { width: auto; height: 46px; background: var(--plate-2); color: var(--muted); font-weight: 600; padding: 0 12px; }
  .quickadd + .field input { max-width: 100%; }
  .card {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 10px 10px 10px 12px; border-radius: 12px; margin: 6px 0;
    background: var(--plate-2); border-left: 3px solid var(--accent);
  }
  .card .chip { flex: 0 0 auto; min-width: 44px; padding: 0 10px; }
  .card .meta { white-space: normal; }
  .card .body { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card .due-in { font-size: 12px; color: var(--muted); }
  .card .due-in.overdue { color: var(--danger); font-weight: 700; }
  .tray-heading { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 14px 0 4px; }
  .tray-heading.urgent { color: var(--today); }
  .nothing { color: var(--muted); font-size: 14px; padding: 10px 0; }

  /* ── Banners ── */
  .banner {
    position: fixed; left: 12px; right: 12px; top: calc(12px + var(--safe-top)); z-index: 20;
    background: #2b1d1f; color: #f3c7cc; border: 1px solid #5a2d34; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center;
  }
  .banner.info { background: #1d2530; color: #cfe0f3; border-color: #2f4a63; }
  .banner .actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .banner button { font-weight: 700; padding: 4px 8px; }
  .sheet .waiting {
    margin: 10px 0 2px; padding: 8px 12px; border-radius: 10px; font-size: 13px;
    background: #1d2530; color: #cfe0f3; border: 1px solid #2f4a63;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--bar-h) + var(--safe-bottom) + 12px); transform: translateX(-50%);
    background: var(--text); color: #0f1113; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px;
    z-index: 30; max-width: 90vw; text-align: center;
  }
  .gate { padding: 24px 18px; max-width: 420px; margin: 40px auto; }
  .gate p { color: var(--muted); }
  .gate input { width: 100%; background: var(--plate); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- The picture, when there is one. A direct child of `body` and nothing else:
     `.aday` carries `contain: layout style`, which makes every day section a
     containing block for fixed descendants and would trap this in the scroll. -->
<div id="field" aria-hidden="true"></div>

<!-- Nothing in here is tappable, and that is the rule the layout hangs on: the
     masthead is what you read, the bar at the bottom is what you touch. It
     keeps every control inside a thumb's arc, and it keeps this box a fixed
     height per view — which matters because its height is the sticky offset
     every day heading below it is positioned from. -->
<header class="mast">
  <div class="date">
    <div class="daynum mono" id="daynum">··</div>
    <div class="dwhen">
      <div class="dwd" id="dayweek"></div>
      <div class="dmo" id="daymonth"></div>
    </div>
  </div>
  <div class="summary" id="summary"></div>
</header>

<!-- All-day events off subscribed calendars: chips, not blocks (§23). In flow
     rather than in the masthead, so they scroll away with the day they belong
     to and cannot add their height to every sticky offset on the page. -->
<div class="alldayrow" id="alldayRow" hidden></div>

<noscript><p style="padding:18px;font:15px/1.5 system-ui;color:#c9c9c9">TaskDeck needs JavaScript. This page is one file and does all its drawing in the browser.</p></noscript>

<main class="timeline" id="timeline">
  <div id="hours"></div>
  <div class="lanes" id="lanes"><div class="empty-tap" id="emptyTap"></div></div>
  <div class="nowline" id="nowline" hidden></div>
</main>

<section class="weekgrid" id="weekgrid" hidden>
  <!-- Both ends are permanent children, so nothing has to be re-observed when
       the list grows. The head carries a button and the tail a sentinel: see
       `armSentinel`. -->
  <div class="aend" id="agendaHead"></div>
  <div class="weekbody" id="weekbody"></div>
  <div class="aend" id="agendaTail"></div>
</section>

<!-- Two rows. The scrubber says where you are and takes you a few days or a
     few months either way; the deck holds the four verbs. Both are within reach
     of the hand already holding the phone, which is the whole point: navigation
     used to live in the top row, which is the furthest thing from a thumb. -->
<nav class="bar" id="bar" aria-label="Navigation and actions">
  <div class="scrub">
    <div class="week" id="week" role="group" aria-label="This week" hidden></div>
    <div class="rail" id="rail" role="group" aria-label="Months" hidden></div>
  </div>
  <div class="deck">
    <button id="trayBtn" aria-label="Tray">Tray<span class="count" id="trayCount" aria-hidden="true">0</span></button>
    <button id="todayBtn" aria-label="Today">Today</button>
    <button id="modeBtn">Day</button>
    <button id="newBtn" class="primary" aria-label="New">＋ New</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog"></div>
<div class="banner" id="banner" hidden></div>
<div class="gate" id="gate" hidden>
  <h2>TaskDeck</h2>
  <p>This page needs the link from TaskDeck's settings — it carries a token that lets the phone edit your calendar. If you have the token, paste it here.</p>
  <p id="gateNote" hidden></p>
  <input id="gateToken" placeholder="token" autocapitalize="off" autocomplete="off" spellcheck="false">
  <div class="actions"><button class="primary" id="gateGo">Open</button></div>
</div>

<script>
(() => {
  // `replaceChildren` is the newest thing this file needs — Firefox 78,
  // Chrome 86, Safari 14 — and it is used on every render, so on an older
  // engine the page would load, fetch the day, and then show a red banner
  // reading "week.replaceChildren is not a function" instead of a calendar.
  // Four lines buys four years of phones back.
  if (!Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function (...nodes) {
      while (this.firstChild) this.removeChild(this.firstChild);
      if (nodes.length) this.append(...nodes);
    };
  }

  'use strict';

  /* ───────────────────────────── State ───────────────────────────── */

  const HOUR = 56;
  const SNAP = 15;
  const DURATIONS = [15, 30, 45, 60, 90, 120, 150, 180, 240, 300, 360, 420, 480, 600];
  // Used when the desktop's colour scheme is COLORSCHEME ZERO (all transparent):
  // slots 0–4 are urgency, calm to loud; 5 is events.
  const FALLBACK = ['#7a8b96', '#4f9a94', '#c9a227', '#d97b3a', '#d1495b', '#8b7fd6'];
  const TOKEN_KEY = 'taskdeck-token';
  // The board's `NAME_MAX_CHARS`: the inputs stop where the board would refuse.
  const NAME_MAX = 200;

  const state = {
    token: null,
    day: todayIso(),
    snap: null,
    items: new Map(),
    selected: null,      // { id, session }
    sheet: null,         // 'item' | 'tray' | 'new' | 'notes' | null
    newDraft: null,      // { kind, start, minutes, name }
    notesDraft: null,    // unsaved notepad text while the Notes sheet is open
    renaming: false,
    pollTimer: null,
    quickAddDraft: '',
    quickAddDue: null,      // the quick-add's optional due date while shown
    trayTab: 'unplanned',   // 'unplanned' | 'all' | 'done'
    // The agenda ribbon: one contiguous run of days, and everything needed to
    // grow it, keep it and put it back where it was.
    agenda: {
      days: new Map(),      // 'YYYY-MM-DD' -> DaySnapshot; the only copy of a day
      months: new Map(),    // 'YYYY-MM' -> { at }, what the month cache holds
      first: null,          // the run's ends, inclusive; null when nothing is drawn
      last: null,
      nodes: new Map(),     // date -> its .aday element
      onScreen: new Set(),  // dates the place observer currently sees
      month: null,          // the month at the reading position, for the rail
      known: null,          // { from, until } the calendars were read for
      chain: Promise.resolve(),  // one request at a time, in order
      gen: 0,               // bumped to abandon growth that is no longer wanted
      pending: null,        // 'after' | 'before' when the sentinel fired mid-flight
      stalled: false,       // the network failed; the sentinel waits for a tap
    },
    mode: 'agenda',         // 'day' | 'agenda'
    notice: null,           // a refusal to show in the banner until acknowledged
  };
  // A refusal is kept until it is acknowledged, reload or not: it is the only
  // trace of an edit that was made here and is not on the board.
  const NOTICE_KEY = 'taskdeck-notice';
  try { state.notice = localStorage.getItem(NOTICE_KEY); } catch (_) {}
  function rememberNotice(text) {
    state.notice = text;
    try {
      if (text) localStorage.setItem(NOTICE_KEY, text);
      else localStorage.removeItem(NOTICE_KEY);
    } catch (_) {}
  }
  // An install that explicitly chose the day view keeps it; one that chose the
  // old week grid gets the agenda that replaced it; one that never touched the
  // button gets the agenda, which is what this page is mostly for.
  try {
    const stored = localStorage.getItem('taskdeck-mode');
    if (stored === 'day') state.mode = 'day';
  } catch (_) {}

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, children = []) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v);
    }
    for (const child of [].concat(children)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  };

  /* ───────────────────────────── Helpers ───────────────────────────── */

  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function shiftDay(iso, days) {
    const [y, m, d] = iso.split('-').map(Number);
    const date = new Date(y, m - 1, d + days);
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }
  function hhmm(minutes) {
    minutes = Math.max(0, Math.min(24 * 60, minutes));
    return `${pad(Math.floor(minutes / 60) % 24)}:${pad(minutes % 60)}`;
  }
  function timeValue(minutes) {
    // <input type="time"> cannot hold 24:00; clamp it to the last quarter hour.
    return hhmm(Math.min(minutes, 24 * 60 - SNAP));
  }
  function minutesOf(timeText) {
    if (!timeText) return null;
    const [h, m] = timeText.split(':').map(Number);
    if (Number.isNaN(h) || Number.isNaN(m)) return null;
    return h * 60 + m;
  }
  function dur(minutes) {
    const h = Math.floor(minutes / 60), m = minutes % 60;
    if (h === 0) return `${m}m`;
    if (m === 0) return `${h}h`;
    return `${h}h ${m}m`;
  }
  function snap(minutes) { return Math.round(minutes / SNAP) * SNAP; }
  function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function nextQuarter() { return Math.min(24 * 60 - 30, Math.ceil((nowMinutes() + 1) / SNAP) * SNAP); }
  function colorOf(index) {
    const p = state.snap && state.snap.palette && state.snap.palette[index];
    if (p && p[3] > 0) return `rgb(${p[0]}, ${p[1]}, ${p[2]})`;
    return FALLBACK[Math.min(index, 5)];
  }
  /* ── The ladder ──────────────────────────────────────────────────────────
   *
   * A row's ground is the accent hue at a fixed *luminance*, not the accent at
   * a fixed alpha. The desktop has always sent a five-step alpha ramp
   * (`color.rs`'s `RAMP_ALPHA`) whose own comment says opacity is "half of what
   * makes a step read as louder than the one below it" — and the phone threw it
   * away, hard-coding one alpha for every slot and carrying urgency by hue
   * alone. `color.rs` records that as the exact bug they fixed on the desktop:
   * two colours "differed by a hue nudge at nearly the same lightness, and on a
   * small calendar pill over a photo they were one colour."
   *
   * Scaling all three channels in linear light moves value and leaves hue and
   * saturation exactly alone, so a slot stays recognisably its own colour and
   * gains weight. The ceiling is set by `--muted` needing 4.5:1 against the
   * darkest row it can sit on. */
  const GROUND_L = [0.0130, 0.0162, 0.0198, 0.0240, 0.0288];
  const EVENT_L = 0.0192;
  const toLinear = (v) => { const c = v / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const toSrgb = (v) => {
    const c = v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
    return Math.max(0, Math.min(255, Math.round(c * 255)));
  };
  function rgbOf(index) {
    const p = state.snap && state.snap.palette && state.snap.palette[index];
    if (p && p[3] > 0) return [p[0], p[1], p[2]];
    const hex = FALLBACK[Math.min(index, 5)];
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  const shades = new Map();
  function groundOf(index) {
    const key = `g${index}`;
    if (shades.has(key)) return shades.get(key);
    const [r, g, b] = rgbOf(index);
    const lin = [toLinear(r), toLinear(g), toLinear(b)];
    const y = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
    const want = index === 5 ? EVENT_L : GROUND_L[Math.min(index, 4)];
    const k = y > 0 ? want / y : 0;
    const out = `rgb(${toSrgb(lin[0] * k)}, ${toSrgb(lin[1] * k)}, ${toSrgb(lin[2] * k)})`;
    shades.set(key, out);
    return out;
  }
  // The accent mixed toward the page's ink, so a room line reads at 5:1 on its
  // own row instead of the 2.3:1 the raw accent managed — while keeping enough
  // hue to say which calendar it came from.
  function inkOf(indexOrHex) {
    const key = `i${indexOrHex}`;
    if (shades.has(key)) return shades.get(key);
    const [r, g, b] = typeof indexOrHex === 'string' ? hexBits(indexOrHex) : rgbOf(indexOrHex);
    const mix = (c, t) => Math.round(c + (t - c) * 0.55);
    const out = `rgb(${mix(r, 232)}, ${mix(g, 230)}, ${mix(b, 225)})`;
    shades.set(key, out);
    return out;
  }
  // Somebody else's calendar: the hue, quietened toward the plate it sits on.
  // The desktop's `preview_color` in a different material.
  function subBarOf(hex) {
    const key = `s${hex}`;
    if (shades.has(key)) return shades.get(key);
    const [r, g, b] = hexBits(hex);
    const mix = (c, t) => Math.round(c + (t - c) * 0.35);
    const out = `rgb(${mix(r, 25)}, ${mix(g, 28)}, ${mix(b, 33)})`;
    shades.set(key, out);
    return out;
  }
  function hexBits(hex) {
    const h = hex.trim().replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function durationOptions(current) {
    const list = DURATIONS.slice();
    if (current && !list.includes(current)) { list.push(current); list.sort((a, b) => a - b); }
    return list;
  }
  function localToText(text) {
    // "2026-09-04T17:00" → "Fri 4 Sep 17:00"
    if (!text) return '';
    const [date, time] = text.split('T');
    const [y, m, d] = date.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return `${dt.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })} ${time}`;
  }

  /* ───────────────────────────── API ───────────────────────────── */

  function readToken() {
    const fromUrl = new URLSearchParams(location.search).get('token');
    if (fromUrl) {
      try { localStorage.setItem(TOKEN_KEY, fromUrl); } catch (_) {}
      return fromUrl;
    }
    try { return localStorage.getItem(TOKEN_KEY); } catch (_) { return null; }
  }

  function installManifest() {
    // The manifest is asked for with the token so a home-screen shortcut opens
    // with it (iOS gives such an app storage of its own).
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = `/manifest.webmanifest?token=${encodeURIComponent(state.token)}`;
    document.head.append(link);
  }

  // A request that never answers — a mobile link that dropped mid-request,
  // a desk asleep behind a firewall that swallows packets — would otherwise
  // hang the page's whole chain of loads and replays. Ordinary requests are
  // given fifteen seconds; the long poll waits for the server's own 25 s and
  // then some. A request that runs out of time counts as unreachable (status
  // 0), so an edit behind it is kept, not lost.
  const REQUEST_TIMEOUT_MS = 15000;
  const WAIT_TIMEOUT_MS = 45000;
  async function api(path, options = {}) {
    const headers = Object.assign({ 'X-TaskDeck-Token': state.token }, options.headers || {});
    if (options.body) headers['Content-Type'] = 'application/json';
    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const limit = path.startsWith('/api/wait') ? WAIT_TIMEOUT_MS : REQUEST_TIMEOUT_MS;
    const timer = controller ? setTimeout(() => controller.abort(), limit) : null;
    try {
      const response = await fetch(path, Object.assign({}, options, { headers, cache: 'no-store', signal: controller ? controller.signal : undefined }));
      // The body is read under the same clock: headers can arrive and the
      // rest never.
      const text = await response.text();
      let payload = null;
      try { payload = text ? JSON.parse(text) : null; } catch (_) {}
      if (!response.ok) {
        const message = (payload && payload.error) || `TaskDeck answered ${response.status}.`;
        throw new ApiError(response.status, message);
      }
      return payload;
    } catch (error) {
      if (error instanceof ApiError) throw error;
      if (controller && controller.signal.aborted) {
        throw new ApiError(0, "TaskDeck did not answer in time. Is it running, and is this phone on a working network?");
      }

    // Centred on the day you are looking at, three either way, rather than
    // anchored to Monday. A week that starts on Monday offers a Sunday reader
    // seven days that have already happened; centring means the strip always
    // reaches the same distance forward as back, whichever day it is.
    for (let i = -3; i <= 3; i++) {
      const iso = shiftDay(day.date, i);
      const [dy, dm, dd] = iso.split('-').map(Number);
      const date = new Date(dy, dm - 1, dd);
      // Off the same store the agenda reads, so the seven-day request that used
      // to exist only for these dots is gone: the day fetch brings the week.
      const held = state.agenda.days.get(iso);
      const marks = held ? held.entries.filter((e) => e.kind === 'event' || e.due).map((e) => e.color) : [];
      const dots = el('span', { class: 'dots' });
      for (const color of marks.slice(0, 3)) dots.append(el('i', { style: `--c:${colorOf(color)}` }));
      const node = el('button', {
        class: (i === 0 ? 'shown' : '') + (iso === today ? ' today' : ''),
        onclick: () => { if (iso !== state.day) goTo(iso); },
        'aria-label': date.toDateString(),
        'aria-current': i === 0 ? 'date' : null,
      }, [
        el('span', { class: 'wd', text: date.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2) }),
        el('span', { class: 'dn', text: String(date.getDate()) }),
        dots,
      ]);
      week.append(node);
    }
  }

  /* ─────────────────────────── The agenda ribbon ───────────────────────────
   *
   * One continuous list of days, newest at the top of nothing in particular:
   * it simply runs, from whatever the reader has scrolled back to down through
   * whatever they have scrolled forward to, a month at a time. Each day is a
   * heading and its things in clock order — the board's blocks, its ghosts, and
   * whatever the subscribed calendars say — because reading *what is on* is
   * what a week is for, and a phone's width can only afford to say one of
   * "what" and "when" properly.
   *
   * Two rules hold the whole thing together.
   *
   * **Scrolling changes nothing.** It is a reading motion. It never moves the
   * shown day, never sends a command, and never runs from `load()`. In this
   * view the shown day is pinned to today, so ＋ New, Reflow and Tray all mean
   * today and the masthead says so — a scroll position quietly retargeting an
   * edit is how work gets booked on the wrong date.
   *
   * **Nothing moves the reading position except `holdPlace`.** Everything that
   * inserts or removes days above where someone is reading goes through it.
   */

  function setMode(mode) {
    state.mode = mode;
    try { localStorage.setItem('taskdeck-mode', mode); } catch (_) {}
    labelChrome();
    // Entering the agenda pins the shown day to today. This is the invariant
    // that lets the verbs in the bar keep meaning something exact.
    if (mode === 'agenda') state.day = todayIso();
    render();
    if (mode === 'agenda') {
      // The store may have grown since boot — a day view fetches seven days of
      // its own — so the run is derived again here rather than assumed.
      if (!state.agenda.first) seedRun(todayIso());
      if (!state.agenda.first || !state.agenda.nodes.size) renderAgenda();
      drawEnds();
      jumpToDate(todayIso(), { load: false });
      growIfShort();
    } else {
      scrollToUsefulHour();
    }
  }

  // One day, as a section. Lifted whole out of the week grid it was written
  // for; the only things it learns here are its date, that today is decided at
  // paint time rather than baked into a cached day, and that a day the
  // calendars never reached is not the same as a day with nothing on it.
  function dayNode(iso, day) {
    const [dy, dm, dd] = iso.split('-').map(Number);
    const when = new Date(dy, dm - 1, dd);
    const rows = [];
    if (day) {
      for (const entry of day.entries) {
        rows.push({
          at: entry.start,
          label: hhmm(entry.start),
          until: entry.marker ? '' : hhmm(entry.start + entry.minutes),
          name: entry.name,
          where: entry.marker && entry.due ? 'due' : '',
          accent: colorOf(entry.color),
          ground: groundOf(entry.color),
          ink: inkOf(entry.color),
          sub: false,
        });
      }
      for (const ghost of day.ghosts) {
        rows.push({
          at: ghost.start, label: hhmm(ghost.start), until: hhmm(ghost.start + ghost.minutes),
          name: ghost.name, where: '',
          accent: colorOf(ghost.color), ground: 'transparent', ink: 'var(--muted)', sub: false, done: true,
        });
      }
      for (const event of (day.subscribed || [])) {
        rows.push({
          at: event.all_day ? -1 : event.start,
          label: event.all_day ? 'all' : hhmm(event.start),
          until: event.all_day ? 'day' : hhmm(event.end),
          name: event.name,
          where: event.where || '',
          accent: subBarOf(event.color),
          ground: 'transparent',
          ink: inkOf(event.color),
          sub: true,
        });
      }
      rows.sort((a, b) => a.at - b.at);
    }

    // A day past the far edge of the calendars is not a free day. The board's
    // own blocks on it are real; the absence of lectures on it means only that
    // nobody has looked.
    const unread = !day || !isKnown(iso);
    // A day with nothing on it gets no plate: it is a void the field shows
    // through. Today always keeps its plate — it is what every verb in the bar
    // acts on, so it is never "nothing".
    const free = !rows.length && iso !== todayIso();
    const section = el('div', {
      class: 'aday' + (iso === todayIso() ? ' today' : '') + (free ? ' free' : '') + (unread ? ' unknown' : ''),
      'data-date': iso,
    });
    section.append(el('button', {
      'aria-label': `Open ${when.toDateString()}`,
      onclick: () => openDay(iso),
    }, [
      el('span', { class: 'adate mono', text: when.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' }) }),
      // The most-repeated string on the ribbon stops being a line of its own
      // and becomes half of a heading that was already there, on the spine.
      rows.length ? null : el('span', { class: 'aword', text: unread ? '· not read' : '· free' }),
      el('span', { class: 'acount', text: rows.length ? `${rows.length}` : '' }),
    ]));

    for (const row of rows) {
      const line = el('div', {
        class: 'arow' + (row.sub ? ' sub' : '') + (row.done ? ' done' : ''),
        style: `--accent:${row.accent}; --ground:${row.ground}; --ink:${row.ink}`,
      });
      const at = el('span', { class: 'at mono', text: row.label });
      if (row.until) at.append(el('span', { class: 'ae', text: row.until }));
      line.append(at);
      const bodyCell = el('div', { class: 'abody' });
      bodyCell.append(el('span', { class: 'an', text: row.name }));
      if (row.where) bodyCell.append(el('span', { class: 'aw', text: row.where }));
      line.append(bodyCell);
      section.append(line);
    }
    return section;
  }

  // Whether the subscribed calendars were read for this day. With nothing
  // subscribed there is no span, no ignorance, and no edge to draw.
  function isKnown(iso) {
    const known = state.agenda.known;
    return !known || (known.from <= iso && iso <= known.until);
  }

  // Put the reading position back where it was.
  //
  // It *measures* the displacement rather than predicting it: a surviving
  // element's real screen position before and after, and the difference put
  // back. That is right whether the engine's own scroll anchoring compensated
  // fully, partly or not at all — and unlike a `scrollHeight` delta it cannot
  // land on top of an adjustment the engine already made and jump a page.
  function holdPlace(keep, mutate) {
    if (!keep) { mutate(); return; }
    const was = keep.getBoundingClientRect().top;
    mutate();
    const now = keep.getBoundingClientRect().top;
    if (now !== was) window.scrollBy(0, now - was);
  }

  // The whole run, from scratch. The only caller of `replaceChildren` on the
  // body: on boot, on entering the agenda, and on a jump that lands outside
  // what is drawn. Never on a data path — see `patchAgenda`.
  function renderAgenda() {
    const body = $('weekbody');
    for (const node of state.agenda.nodes.values()) unwatchDay(node);
    state.agenda.nodes.clear();
    state.agenda.onScreen.clear();
    body.replaceChildren();
    const { first, last } = state.agenda;
    if (!first || !last) { $('weekgrid').hidden = false; return; }
    const parts = [];
    for (let iso = first; iso <= last; iso = shiftDay(iso, 1)) {
      const node = dayNode(iso, state.agenda.days.get(iso));
      state.agenda.nodes.set(iso, node);
      parts.push(node);
    }
    body.append(...parts);
    for (const node of state.agenda.nodes.values()) watchDay(node);
    $('weekgrid').hidden = false;
  }

  // Only the days that actually changed, in place. One section is a fraction
  // of a millisecond against a rebuild's fifteen, and this runs on the path
  // `/api/wait` makes hot — every edit at the desk lands here.
  function patchAgenda(dates) {
    for (const iso of dates) {
      const node = state.agenda.nodes.get(iso);
      if (!node) continue;
      const fresh = dayNode(iso, state.agenda.days.get(iso));
      const above = node.getBoundingClientRect().bottom <= 0;
      holdPlace(above ? nextDayNode(iso) : null, () => {
        unwatchDay(node);
        node.replaceWith(fresh);
        state.agenda.nodes.set(iso, fresh);
        watchDay(fresh);
      });
    }
  }

  // The first drawn day after this one — something below the change to measure
  // against when the change itself is above the reading position.
  function nextDayNode(iso) {
    for (let at = shiftDay(iso, 1); at <= state.agenda.last; at = shiftDay(at, 1)) {
      const node = state.agenda.nodes.get(at);
      if (node) return node;
    }
    return null;
  }

  /* ─────────────────────────── The month rail ─────────────────────────── */

  // Seven cells, the month you are reading in the middle. So an end cell is
  // three months away and anywhere within half a year is two taps — against
  // twenty thumb-flicks, which is what a day-at-a-time scroll costs.
  const RAIL_SLOTS = 7;
  function firstOfMonth(key) { return `${key}-01`; }
  function renderRail() {
    const rail = $('rail');
    const here = state.agenda.month || monthOf(state.day);
    rail.replaceChildren();
    const half = (RAIL_SLOTS - 1) / 2;
    for (let i = -half; i <= half; i++) rail.append(railCell(shiftMonth(here, i), i === 0));
  }
  function railCell(key, here) {
    const [y, m] = key.split('-').map(Number);
    const at = new Date(y, m - 1, 1);
    const known = state.agenda.known;
    const beyond = known && (`${key}-31` < known.from || firstOfMonth(key) > known.until);
    const hasToday = !here && key === monthOf(todayIso());
    return el('button', {
      class: (here ? 'here' : '') + (beyond ? ' beyond' : '') + (hasToday ? ' hastoday' : ''),
      'aria-label': at.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + (hasToday ? ' — today is here' : ''),
      'aria-current': here ? 'true' : null,
      onclick: () => jumpToDate(firstOfMonth(key)),
    }, [
      at.toLocaleDateString(undefined, { month: 'short' }),
      here ? el('span', { class: 'yr', text: String(y) }) : null,
    ]);
  }

  /* ─────────────────────── The answer, before you read ───────────────────
   *
   * The question this app exists to answer, on the move, one-handed, is *am I
   * free, and where am I going next*. Everything else on the screen answers it
   * eventually; this line answers it immediately, and it costs nothing to draw
   * because today's snapshot is already here.
   *
   * It replaces the day figure in this view. "1h planned · 2 blocks" is a fact
   * about the day, not an answer about it — and on a day made entirely of
   * lectures it said "nothing on this day", because the figure counts only the
   * board's own things.
   */

  // A name short enough to recognise at a glance. University feeds put the
  // course code first and then a hundred characters of itinerary, and the code
  // is how anyone actually refers to the thing.
  function shortName(name) {
    const cut = name.indexOf(',');
    if (cut > 1 && cut <= 30 && cut < name.length - 1) return name.slice(0, cut);
    return name;
  }

  // Everything on a day that takes time or falls due, in clock order. All-day
  // bands and day-long spans are left out: they describe the day rather than
  // occupying it, so they cannot answer "when am I free".
  function commitments(day) {
    if (!day) return [];
    const out = [];
    for (const entry of day.entries) {
      out.push({
        start: entry.start,
        end: entry.start + (entry.marker ? 0 : entry.minutes),
        name: entry.name,
        where: '',
        due: !!entry.marker && !!entry.due,
        accent: colorOf(entry.color),
      });
    }
    for (const event of (day.subscribed || [])) {
      if (event.all_day || event.background) continue;
      out.push({ start: event.start, end: event.end, name: event.name, where: event.where || '', due: false, accent: event.color });
    }
    return out.sort((a, b) => a.start - b.start || a.end - b.end);
  }

  function glanceFor(day, tomorrow, now) {
    const all = commitments(day);
    const here = all.filter((c) => c.end > c.start && c.start <= now && now < c.end);
    if (here.length) {
      // The one finishing first: it is the one whose ending changes what you
      // can do next, and it is what "until" has to be about.
      const soonest = here.reduce((a, b) => (a.end <= b.end ? a : b));
      const more = here.length > 1 ? ` +${here.length - 1}` : '';
      return {
        lead: shortName(soonest.name) + more,
        detail: [`until ${hhmm(soonest.end)}`, soonest.where].filter(Boolean).join(' · '),
        accent: soonest.accent,
        hollow: false,
      };
    }
    const next = all.find((c) => c.start > now);
    if (next) {
      const away = next.start - now;
      const what = shortName(next.name);
      if (away <= 90) {
        return {
          lead: `In ${dur(away)}`,
          detail: [next.due ? `${what} due` : what, hhmm(next.start), next.where].filter(Boolean).join(' · '),
          accent: next.accent,
          hollow: false,
        };
      }
      return {
        lead: `Free for ${dur(away)}`,
        detail: `then ${what}${next.due ? ' due' : ''} at ${hhmm(next.start)}`,
        accent: next.accent,
        hollow: true,
      };
    }
    // Nothing left today, so the useful next fact is tomorrow's first thing —
    // which the store already holds, because the ribbon fetched it.
    const first = commitments(tomorrow)[0];
    return {
      lead: 'Nothing else today',
      detail: first ? `Tomorrow · ${shortName(first.name)} at ${hhmm(first.start)}` : '',
      accent: first ? first.accent : 'var(--muted)',
      hollow: true,
    };
  }

  function renderGlance() {
    const box = $('summary');
    const day = state.snap && state.snap.days[0];
    box.classList.add('glance');
    if (!day || day.date !== todayIso()) {
      // Between midnight and the first answer of the new day. Say nothing
      // rather than something about yesterday.
      box.replaceChildren(el('span', { class: 'gdot hollow', style: '--accent:var(--muted)' }), el('span', { class: 'glead', text: '…' }), el('span', { class: 'gdetail' }));
      return;
    }
    const at = glanceFor(day, state.agenda.days.get(shiftDay(day.date, 1)), nowMinutes());
    const detail = el('span', { class: 'gdetail', text: at.detail });
    if (day.behind_minutes > 0) {
      detail.append(el('span', { class: 'behindnote', text: ` · ${dur(day.behind_minutes)} behind` }));
    }
    box.replaceChildren(
      el('span', { class: 'gdot' + (at.hollow ? ' hollow' : ''), style: `--accent:${at.accent}` }),
      el('span', { class: 'glead', text: at.lead }),
      detail,
    );
  }

  // The masthead in the agenda: where you are reading on the left, and what
  // the verbs below will act on — which is today, always — on the right.
  function railAndMasthead() {
    // `jumpToDate` calls this from inside a queued fetch, which can resolve
    // after the reader has switched to the day view — and then it would paint
    // the agenda's glance line over the day's figure and move the masthead's
    // height under them.
    if (state.mode !== 'agenda') return;
    const at = state.agenda.month || monthOf(state.day);
    mastheadFor(todayIso(), true);
    renderGlance();
    if (state.railFor !== at) { state.railFor = at; renderRail(); }
  }

  /* ───────────────────────── Growing the ribbon ─────────────────────────
   *
   * A month at a time, one request ever in flight. Every request serialises on
   * the desk's UI thread behind the same two workers anyway, and that thread
   * drains the whole queue in one frame — so a fan-out of page fetches buys
   * nothing and can starve the fetch for the day someone is actually looking
   * at. Forward growth is a sentinel; backward growth is a tap, deliberately.
   */

  // How far ahead of the reader the tail sentinel reaches. A screen is about
  // 800px and a hard fling covers two or three thousand, so this is roughly
  // two and a half screens of warning — a round trip's worth. It is also short
  // enough that a first page, which is a month and thousands of pixels tall,
  // never trips it on opening.
  const SENTINEL_LEAD = '2000px';
  // The DOM holds four months and settles back to three, so a trim only ever
  // follows travel nobody does by accident.
  const DOM_MONTHS_MAX = 4;
  const DOM_MONTHS_TARGET = 3;
  // The desk bumps its version on every save, so a drag over there arrives as a
  // burst. One second collapses a burst and is under what anyone notices.
  const REVALIDATE_DEBOUNCE = 1000;

  function serial(job) {
    state.agenda.chain = state.agenda.chain.then(job, job);
    return state.agenda.chain;
  }

  function daysInMonthOf(iso) {
    const [y, m] = iso.split('-').map(Number);
    return new Date(y, m, 0).getDate();
  }

  // Extend the run to the end of the month the next day falls in, so that every
  // page after the unaligned first one ends on a month boundary — which makes a
  // request, a cache key and a rail slot the same unit.
  // Whether the run has run out past what the subscribed calendars cover.
  //
  // Nothing is stopped for this. It was a gate at first, and the gate was
  // wrong twice over: a page is a whole month, so the boundary falls *inside*
  // one and there is no step to stop at; and a jump straight to a distant
  // month steps over it without ever asking. What the reader actually needs is
  // to know why those days look empty — and every one of them says so for
  // itself, in words, on its own line. The card at the end only explains where
  // the line is.
  function pastCalendars() {
    const { known, last } = state.agenda;
    return !!known && !!last && last > known.until;
  }

  async function extendAfter() {
    const agenda = state.agenda;
    if (!agenda.last) return;
    const from = shiftDay(agenda.last, 1);
    const days = daysInMonthOf(from) - Number(from.slice(8, 10)) + 1;
    await fetchPage(from, days, 'after');
  }

  async function extendBefore() {
    const agenda = state.agenda;
    if (!agenda.first) return;
    const before = shiftDay(agenda.first, -1);
    const from = `${monthOf(before)}-01`;
    const days = Number(before.slice(8, 10));
    await fetchPage(from, days, 'before');
  }

  async function fetchPage(from, days, side) {
    const mine = state.agenda.gen;
    state.agenda.stalled = false;
    drawEnds(side);
    try {
      const snap = await api(`/api/state?from=${from}&days=${days}`);
      absorb(snap);
      if (mine !== state.agenda.gen) return;
      // Never the number asked for: the server clamps quietly and identically,
      // so a page served from an old cached shell against a newer binary — or
      // the other way about — simply gets fewer days and the sentinel fires
      // again. The run grows by however many contiguous days the store now has.
      growRun();
    } catch (error) {
      if (error.status === 401) { showGate(); return; }
      if (mine !== state.agenda.gen) return;
      // One wait, not a queue of them: the sentinel stays disarmed until this
      // is tapped or the network comes back.
      state.agenda.stalled = true;
    }
    drawEnds();
  }

  // Grow the drawn run to cover every contiguous day the store holds, in both
  // directions. Days appended below are free; days prepended above go through
  // `holdPlace`, because that is the mutation that moves the reading position.
  function growRun() {
    const agenda = state.agenda;
    const body = $('weekbody');
    if (!agenda.first) return;

    let last = agenda.last;
    const after = [];
    while (agenda.days.has(shiftDay(last, 1))) {
      last = shiftDay(last, 1);
      const node = dayNode(last, agenda.days.get(last));
      agenda.nodes.set(last, node);
      after.push(node);
    }
    if (after.length) {
      body.append(...after);
      after.forEach(watchDay);
      agenda.last = last;
    }

    let first = agenda.first;
    const before = [];
    while (agenda.days.has(shiftDay(first, -1))) {
      first = shiftDay(first, -1);
      const node = dayNode(first, agenda.days.get(first));
      agenda.nodes.set(first, node);
      before.unshift(node);
    }
    if (before.length) {
      const keep = agenda.nodes.get(agenda.first);
      holdPlace(keep, () => {
        body.prepend(...before);
        before.forEach(watchDay);
      });
      agenda.first = first;
    }
    if (after.length || before.length) requestPrune();
  }

  // The cards at each end: what is happening, what went wrong, or how far the
  // calendars reach. In the agenda these are the only things that can put
  // anything new on screen once the list is drawn.
  function drawEnds(busy) {
    const agenda = state.agenda;
    const head = $('agendaHead');
    const tail = $('agendaTail');
    head.replaceChildren();
    tail.replaceChildren();
    if (!agenda.first) {
      // Nothing kept for any day — a first-ever open with no answer yet. Say
      // which of the two it is rather than showing an empty page.
      tail.append(agenda.stalled
        ? el('button', {
            class: 'card',
            text: "Couldn't reach TaskDeck, and nothing is kept for these days yet — tap to try again",
            onclick: () => { agenda.stalled = false; drawEnds(); load({ span: 31 }); },
          })
        : el('div', { class: 'waiting', text: 'Loading…' }));
      return;
    }

    head.append(el('button', {
      class: 'card',
      text: busy === 'before' ? 'Loading…' : '▲ Earlier',
      onclick: () => { if (!busy) serial(extendBefore); },
    }));

    if (busy === 'after') { tail.append(el('div', { class: 'waiting', text: 'Loading…' })); return; }
    if (agenda.stalled) {
      tail.append(el('button', {
        class: 'card',
        text: "Couldn't reach TaskDeck — tap to try again",
        onclick: () => { agenda.stalled = false; serial(extendAfter); },
      }));
      return;
    }
    if (pastCalendars()) {
      tail.append(el('div', { class: 'card' }, [
        el('span', { text: 'Your calendars are read as far as ' }),
        el('b', { text: agenda.known.until }),
        el('span', { text: '. Days after that show your own blocks and nothing else — not because they are free, but because nobody has looked.' }),
      ]));
    }
  }

  // Drop whole months off the far end once the DOM holds more than it needs.
  // Deferred to idle and skipped while a finger is down: a mutation landing
  // mid-fling is the one hazard that cannot be tested anywhere but on a phone.
  let pruneQueued = false;
  function requestPrune() {
    if (pruneQueued) return;
    pruneQueued = true;
    const run = () => { pruneQueued = false; pruneAgenda(); };
    if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 2000 });
    else setTimeout(run, 500);
  }
  function pruneAgenda() {
    const agenda = state.agenda;
    if (touchStart || !agenda.first) return;
    const months = new Set();
    for (let iso = agenda.first; iso <= agenda.last; iso = shiftDay(iso, 1)) months.add(monthOf(iso));
    if (months.size <= DOM_MONTHS_MAX) return;

    const here = agenda.month || monthOf(state.day);
    const ordered = [...months].sort((a, b) => Math.abs(monthsBetween(here, a)) - Math.abs(monthsBetween(here, b)));
    const keep = new Set(ordered.slice(0, DOM_MONTHS_TARGET));
    // Only ever a whole run from one end: the drawn days must stay contiguous.
    let first = agenda.first, last = agenda.last;
    while (first < last && !keep.has(monthOf(first))) first = shiftDay(`${monthOf(first)}-01`, daysInMonthOf(first));
    while (last > first && !keep.has(monthOf(last))) last = shiftDay(`${monthOf(last)}-01`, -1);

    if (last < agenda.last) {
      // Trimming the bottom while the reader is near it clamps the scroll
      // offset and throws the list a screenful. Two screens of clearance first.
      const bottom = state.agenda.nodes.get(agenda.last);
      const clear = bottom && bottom.getBoundingClientRect().top > window.innerHeight * 2;
      if (clear) dropRange(shiftDay(last, 1), agenda.last, 'below');
    }
    if (first > agenda.first) dropRange(agenda.first, shiftDay(first, -1), 'above');
  }
  function dropRange(from, to, where) {
    const agenda = state.agenda;
    const doomed = [];
    for (let iso = from; iso <= to; iso = shiftDay(iso, 1)) {
      const node = agenda.nodes.get(iso);
      if (node) doomed.push([iso, node]);
    }
    if (!doomed.length) return;
    const keep = where === 'above' ? agenda.nodes.get(shiftDay(to, 1)) : null;
    holdPlace(keep, () => {
      for (const [iso, node] of doomed) {
        unwatchDay(node);
        node.remove();
        agenda.nodes.delete(iso);
      }
    });
    if (where === 'above') agenda.first = shiftDay(to, 1);
    else agenda.last = shiftDay(from, -1);
    drawEnds();
  }

  // On opening, the first page is a month — thousands of pixels — so the
  // sentinel does not fire. If the store had less than that (an offline open
  // off a partial cache), one page is asked for straight away.
  function growIfShort() {
    if (!state.agenda.last) return;
    const tail = $('agendaTail').getBoundingClientRect();
    if (tail.top < window.innerHeight * 2) serial(extendAfter);
  }

  /* ─────────────────────── Watching, without listening ───────────────────
   *
   * Two IntersectionObservers and no scroll handler anywhere. A scroll handler
   * that reads geometry is exactly the layout thrash this phone cannot afford;
   * an observer reports what it already knows and its callback here never
   * touches a rect.
   */
  let placeWatcher = null;
  let pageWatcher = null;
  function watchDay(node) { if (placeWatcher) placeWatcher.observe(node); }
  function unwatchDay(node) { if (placeWatcher) placeWatcher.unobserve(node); }

  function armObservers() {
    if (!window.IntersectionObserver) return;
    const top = stickyHeight();
    if (placeWatcher) placeWatcher.disconnect();
    placeWatcher = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const date = entry.target.dataset.date;
        if (!date) continue;
        if (entry.isIntersecting) state.agenda.onScreen.add(date);
        else state.agenda.onScreen.delete(date);
      }
      let earliest = null;
      for (const date of state.agenda.onScreen) if (!earliest || date < earliest) earliest = date;
      if (!earliest) return;
      const month = monthOf(earliest);
      if (month !== state.agenda.month) {
        state.agenda.month = month;
        if (state.mode === 'agenda') railAndMasthead();
      }
    }, { rootMargin: `${-top}px 0px 0px 0px` });
    for (const node of state.agenda.nodes.values()) placeWatcher.observe(node);

    if (!pageWatcher) {
      pageWatcher = new IntersectionObserver((entries) => {
        if (!entries.some((e) => e.isIntersecting)) return;
        if (state.mode !== 'agenda' || state.agenda.stalled) return;
        if (state.agenda.pending) return;
        state.agenda.pending = 'after';
        serial(extendAfter).then(() => { state.agenda.pending = null; });
      }, { rootMargin: `0px 0px ${SENTINEL_LEAD} 0px` });
      pageWatcher.observe($('agendaTail'));
    }
  }

  // The two sticky layers, measured once and written as custom properties.
  // Everything that needs the offset reads them, so nothing else in the file
  // forces a layout to find out how tall the masthead is today.
  let stickyKnown = -1;
  function stickyHeight() { return Math.max(0, stickyKnown); }
  function measureSticky() {
    // Rounded DOWN, never up. The masthead's height is fractional on a real
    // phone — system font metrics and a safe-area inset rarely land on a whole
    // pixel — and rounding up pins the day heading *below* the masthead's own
    // bottom edge, leaving a sliver of the list scrolling through the gap.
    // Rounding down tucks it under instead, which is invisible.
    const mast = Math.floor(document.querySelector('.mast').getBoundingClientRect().height);
    if (mast === stickyKnown) return;
    stickyKnown = mast;
    document.documentElement.style.setProperty('--mast-h', `${mast}px`);
    armObservers();
  }

  /* ───────────────────────── Going somewhere ───────────────────────── */

  // Every programmatic scroll in this file is `auto` and never `smooth`: the
  // engine skips its anchor adjustments for the whole duration of a scripted
  // animation, so a page arriving mid-animation lands it on the wrong days.
  function jumpToDate(iso, { load: allowLoad = true } = {}) {
    const agenda = state.agenda;
    const node = agenda.nodes.get(iso);
    if (node) {
      // Measured against the viewport rather than taken from `offsetTop`: a
      // day's offset parent is `#weekbody`, which is `position: relative`, so
      // `offsetTop` is short by the body's own offset — 213px as the page
      // stands, and a different number the moment the masthead changes height.
      // The rect form cannot go stale that way, and this reads geometry only on
      // a deliberate jump, never while scrolling.
      const top = node.getBoundingClientRect().top + window.scrollY - stickyHeight();
      window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
      return;
    }
    if (!allowLoad) return;
    // Somewhere else entirely. Abandon whatever growth is queued — its answers
    // are about days nobody is looking at any more — and start a run there.
    agenda.gen += 1;
    agenda.pending = null;
    agenda.stalled = false;
    agenda.first = null;
    agenda.last = null;
    agenda.nodes.clear();
    // The target's whole month, not a few days around it: a short run cannot
    // scroll its target to the top, so the reader would land near the day they
    // asked for and the rail would name the month above it.
    const from = firstOfMonth(monthOf(iso));
    const span = daysInMonthOf(iso);
    // Whatever storage already holds, drawn before anything is asked for.
    seedRun(iso);
    if (agenda.first) { renderAgenda(); drawEnds(); railAndMasthead(); jumpToDate(iso, { load: false }); }
    serial(async () => {
      await fetchPage(from, span, 'after');
      if (!agenda.nodes.get(iso)) { seedRun(iso); renderAgenda(); drawEnds(); }
      jumpToDate(iso, { load: false });
      railAndMasthead();
      // Give the list somewhere to go, so the first flick after arriving does
      // not stall on an empty tail.
      growIfShort();
    });
  }
  function jumpToMonth(by) {
    const here = state.agenda.month || monthOf(state.day);
    jumpToDate(firstOfMonth(shiftMonth(here, by)));
  }

  // The longest contiguous run in the store containing `around`, as the drawn
  // run's ends. Nothing is fetched: this is what an offline open draws from.
  function seedRun(around) {
    const agenda = state.agenda;
    if (!agenda.days.has(around)) {
      // Nothing for that exact day — the nearest held day in the same month,
      // and never one in another: a run that started a month away from where
      // the reader asked to be would scroll to the wrong place.
      let found = null;
      for (const date of agenda.days.keys()) {
        if (monthOf(date) !== monthOf(around)) continue;
        if (!found || Math.abs(Date.parse(date) - Date.parse(around)) < Math.abs(Date.parse(found) - Date.parse(around))) found = date;
      }
      if (!found) { agenda.first = null; agenda.last = null; return; }
      around = found;
    }
    let first = around, last = around;
