   * because today's snapshot is already here.
   *
   * It replaces the day figure in this view. "1h planned · 2 blocks" is a fact
   * about the day, not an answer about it — and on a day made entirely of
   * lectures it said "nothing on this day", because the figure counts only the
   * board's own things.
   */

  // A name short enough to recognise at a glance. University feeds put the
  // course code first and then a hundred characters of itinerary, and the code
  // is how anyone actually refers to the thing.
  function shortName(name) {
    const cut = name.indexOf(',');
    if (cut > 1 && cut <= 30 && cut < name.length - 1) return name.slice(0, cut);
    return name;
  }

  // Everything on a day that takes time or falls due, in clock order. All-day
  // bands and day-long spans are left out: they describe the day rather than
  // occupying it, so they cannot answer "when am I free".
  function commitments(day) {
    if (!day) return [];
    const out = [];
    for (const entry of day.entries) {
      out.push({
        start: entry.start,
        end: entry.start + (entry.marker ? 0 : entry.minutes),
        name: entry.name,
        where: '',
        due: !!entry.marker && !!entry.due,
        accent: colorOf(entry.color),
      });
    }
    for (const event of (day.subscribed || [])) {
      if (event.all_day || event.background) continue;
      out.push({ start: event.start, end: event.end, name: event.name, where: event.where || '', due: false, accent: event.color });
    }
    return out.sort((a, b) => a.start - b.start || a.end - b.end);
  }

  function glanceFor(day, tomorrow, now) {
    const all = commitments(day);
    const here = all.filter((c) => c.end > c.start && c.start <= now && now < c.end);
    if (here.length) {
      // The one finishing first: it is the one whose ending changes what you
      // can do next, and it is what "until" has to be about.
      const soonest = here.reduce((a, b) => (a.end <= b.end ? a : b));
      const more = here.length > 1 ? ` +${here.length - 1}` : '';
      return {
        lead: shortName(soonest.name) + more,
        detail: [`until ${hhmm(soonest.end)}`, soonest.where].filter(Boolean).join(' · '),
        accent: soonest.accent,
        hollow: false,
      };
    }
    const next = all.find((c) => c.start > now);
    if (next) {
      const away = next.start - now;
      const what = shortName(next.name);
      if (away <= 90) {
        return {
          lead: `In ${dur(away)}`,
          detail: [next.due ? `${what} due` : what, hhmm(next.start), next.where].filter(Boolean).join(' · '),
          accent: next.accent,
          hollow: false,
        };
      }
      return {
        lead: `Free for ${dur(away)}`,
        detail: `then ${what}${next.due ? ' due' : ''} at ${hhmm(next.start)}`,
        accent: next.accent,
        hollow: true,
      };
    }
    // Nothing left today, so the useful next fact is tomorrow's first thing —
    // which the store already holds, because the ribbon fetched it.
    const first = commitments(tomorrow)[0];
    return {
      lead: 'Nothing else today',
      detail: first ? `Tomorrow · ${shortName(first.name)} at ${hhmm(first.start)}` : '',
      accent: first ? first.accent : 'var(--muted)',
      hollow: true,
    };
  }

  // The picture behind everything, when the desk has one.
  //
  // Everything about it is one conditional: `--photo` and `--par` set or
  // cleared together, and a class on `<html>` that makes `body` transparent so
  // the field beneath can be seen. With no picture nothing branches — every
  // rule falls through to the flat ground it was written against.
  let lookNow = null;
  // What the document shipped with, so clearing the picture can put it back
  // rather than leaving the system's status bar tinted for a photo that is no
  // longer on screen — which in an installed app is a band of the wrong colour
  // that survives until the next launch.
  const GROUND_THEME = (document.querySelector('meta[name="theme-color"]') || {}).content || '#0f1113';
  function paintField() {
    const look = state.snap && state.snap.look;
    const same = (look && look.id) || null;
    if (same === lookNow) return;
    lookNow = same;
    const root = document.documentElement;
    if (!look) {
      root.classList.remove('has-photo');
      root.style.removeProperty('--photo');
      root.style.removeProperty('--par');
      themeColor(GROUND_THEME);
      return;
    }
    const path = `/bg-${look.id}.jpg`;
    root.style.setProperty('--photo', `url("${path}?token=${encodeURIComponent(state.token || '')}")`);
    root.style.setProperty('--par', String(look.aspect));
    root.classList.add('has-photo');
    // So the system's own status bar sits on the same shade as the strip of
    // picture beneath it rather than on a band of a different colour.
    themeColor(look.top);
    keepPhoto(path);
  }

  // The name of the worker's photo cache, repeated here on purpose: this is the
  // one thing the page and `phone_sw.js` have to agree on, and the alternative
  // is asking the worker over `postMessage` for something a one-line constant
  // settles. Change it in both or in neither.
  const PHOTO_CACHE = 'taskdeck-photo-v1';

  // Make sure the picture is on disk before the network goes away.
  //
  // The worker already keeps whatever passes through it, but on the load where
  // a *new* worker takes over, the request may have gone out before it claimed
  // the page — leaving the photo uncached until the next open. Doing it here as
  // well means one online open is always enough, and the check is a cache
  // lookup, so the usual answer costs nothing.
  async function keepPhoto(path) {
    try {
      if (!('caches' in window)) return;
      const cache = await caches.open(PHOTO_CACHE);
      if (await cache.match(path)) return;
      const response = await fetch(`${path}?token=${encodeURIComponent(state.token || '')}`);
      if (!response.ok) return;
      // One picture at a time — the same sweep the worker does, for the same
      // reason: the name holds the content's hash, so the others are dead.
      for (const key of await cache.keys()) {
        if (new URL(key.url).pathname !== path) await cache.delete(key);
      }
      await cache.put(path, response);
    } catch (_) {
      // Offline, no storage, or a browser that refuses: the page has a flat
      // ground to fall back on and nothing here is worth a visible failure.
    }
  }

  function themeColor(value) {
    let meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) { meta = el('meta', { name: 'theme-color' }); document.head.append(meta); }
    meta.setAttribute('content', value);
  }

  function renderGlance() {
    const box = $('summary');
    const day = state.snap && state.snap.days[0];
    box.classList.add('glance');
    if (!day || day.date !== todayIso()) {
      // Between midnight and the first answer of the new day. Say nothing
      // rather than something about yesterday.
      const waiting = el('span', { class: 'gdetail' });
      const stale = staleNote();
      if (stale) waiting.append(stale);
      box.replaceChildren(el('span', { class: 'gdot hollow', style: '--accent:var(--muted)' }), el('span', { class: 'glead', text: '…' }), waiting);
      return;
    }
    const at = glanceFor(day, state.agenda.days.get(shiftDay(day.date, 1)), nowMinutes());
    const detail = el('span', { class: 'gdetail', text: at.detail });
    if (day.behind_minutes > 0) {
      detail.append(el('span', { class: 'behindnote', text: ` · ${dur(day.behind_minutes)} behind` }));
    }
    const stale = staleNote();
    if (stale) detail.append(stale);
    box.replaceChildren(
      el('span', { class: 'gdot' + (at.hollow ? ' hollow' : ''), style: `--accent:${at.accent}` }),
      el('span', { class: 'glead', text: at.lead }),
      detail,
    );
  }

  // The masthead in the agenda: where you are reading on the left, and what
  // the verbs below will act on — which is today, always — on the right.
  function railAndMasthead() {
    // `jumpToDate` calls this from inside a queued fetch, which can resolve
    // after the reader has switched to the day view — and then it would paint
    // the agenda's glance line over the day's figure and move the masthead's
    // height under them.
    if (state.mode !== 'agenda') return;
    const at = state.agenda.month || monthOf(state.day);
    mastheadFor(todayIso(), true);
    renderGlance();
    if (state.railFor !== at) { state.railFor = at; renderRail(); }
  }

  /* ───────────────────────── Growing the ribbon ─────────────────────────
   *
   * A month at a time, one request ever in flight. Every request serialises on
   * the desk's UI thread behind the same two workers anyway, and that thread
   * drains the whole queue in one frame — so a fan-out of page fetches buys
   * nothing and can starve the fetch for the day someone is actually looking
   * at. Forward growth is a sentinel; backward growth is a tap, deliberately.
   */

  // How far ahead of the reader the tail sentinel reaches. A screen is about
  // 800px and a hard fling covers two or three thousand, so this is roughly
  // two and a half screens of warning — a round trip's worth. It is also short
  // enough that a first page, which is a month and thousands of pixels tall,
  // never trips it on opening.
  const SENTINEL_LEAD = '2000px';
  // The DOM holds four months and settles back to three, so a trim only ever
  // follows travel nobody does by accident.
  const DOM_MONTHS_MAX = 4;
  const DOM_MONTHS_TARGET = 3;
  // The desk bumps its version on every save, so a drag over there arrives as a
  // burst. One second collapses a burst and is under what anyone notices.
  const REVALIDATE_DEBOUNCE = 1000;

  function serial(job) {
    state.agenda.chain = state.agenda.chain.then(job, job);
    return state.agenda.chain;
  }

  function daysInMonthOf(iso) {
    const [y, m] = iso.split('-').map(Number);
    return new Date(y, m, 0).getDate();
  }

  // Extend the run to the end of the month the next day falls in, so that every
  // page after the unaligned first one ends on a month boundary — which makes a
  // request, a cache key and a rail slot the same unit.
  // Whether the run has run out past what the subscribed calendars cover.
  //
  // Nothing is stopped for this. It was a gate at first, and the gate was
  // wrong twice over: a page is a whole month, so the boundary falls *inside*
  // one and there is no step to stop at; and a jump straight to a distant
  // month steps over it without ever asking. What the reader actually needs is
  // to know why those days look empty — and every one of them says so for
  // itself, in words, on its own line. The card at the end only explains where
  // the line is.
  function pastCalendars() {
    const { known, last } = state.agenda;
    return !!known && !!last && last > known.until;
  }

  async function extendAfter() {
    const agenda = state.agenda;
    if (!agenda.last) return;
    const from = shiftDay(agenda.last, 1);
    const days = daysInMonthOf(from) - Number(from.slice(8, 10)) + 1;
    await fetchPage(from, days, 'after');
  }

  async function extendBefore() {
    const agenda = state.agenda;
    if (!agenda.first) return;
    const before = shiftDay(agenda.first, -1);
    const from = `${monthOf(before)}-01`;
    const days = Number(before.slice(8, 10));
    await fetchPage(from, days, 'before');
  }

  async function fetchPage(from, days, side) {
    const mine = state.agenda.gen;
    state.agenda.stalled = false;
    drawEnds(side);
    try {
      const snap = await api(`/api/state?from=${from}&days=${days}`);
      absorb(snap);
      if (mine !== state.agenda.gen) return;
      // Never the number asked for: the server clamps quietly and identically,
      // so a page served from an old cached shell against a newer binary — or
      // the other way about — simply gets fewer days and the sentinel fires
      // again. The run grows by however many contiguous days the store now has.
      growRun();
    } catch (error) {
      if (error.status === 401) { showGate(); return; }
      if (mine !== state.agenda.gen) return;
      // One wait, not a queue of them: the sentinel stays disarmed until this
      // is tapped or the network comes back.
      state.agenda.stalled = true;
    }
    drawEnds();
  }

  // Grow the drawn run to cover every contiguous day the store holds, in both
  // directions. Days appended below are free; days prepended above go through
  // `holdPlace`, because that is the mutation that moves the reading position.
  function growRun() {
    const agenda = state.agenda;
    const body = $('weekbody');
    if (!agenda.first) return;

    let last = agenda.last;
    const after = [];
    while (agenda.days.has(shiftDay(last, 1))) {
      last = shiftDay(last, 1);
      const node = dayNode(last, agenda.days.get(last));
      agenda.nodes.set(last, node);
      after.push(node);
    }
    if (after.length) {
      body.append(...after);
      after.forEach(watchDay);
      agenda.last = last;
    }

    let first = agenda.first;
    const before = [];
    while (agenda.days.has(shiftDay(first, -1))) {
      first = shiftDay(first, -1);
      const node = dayNode(first, agenda.days.get(first));
      agenda.nodes.set(first, node);
      before.unshift(node);
    }
    if (before.length) {
      const keep = agenda.nodes.get(agenda.first);
      holdPlace(keep, () => {
        body.prepend(...before);
        before.forEach(watchDay);
      });
      agenda.first = first;
    }
    if (after.length || before.length) requestPrune();
  }

  // The cards at each end: what is happening, what went wrong, or how far the
  // calendars reach. In the agenda these are the only things that can put
  // anything new on screen once the list is drawn.
  function drawEnds(busy) {
    const agenda = state.agenda;
    const head = $('agendaHead');
    const tail = $('agendaTail');
    head.replaceChildren();
    tail.replaceChildren();
    if (!agenda.first) {
      // Nothing kept for any day — a first-ever open with no answer yet. Say
      // which of the two it is rather than showing an empty page.
      tail.append(agenda.stalled
        ? el('button', {
            class: 'card',
            text: "Couldn't reach TaskDeck, and nothing is kept for these days yet — tap to try again",
            onclick: () => { agenda.stalled = false; drawEnds(); load({ span: 31 }); },
          })
        : el('div', { class: 'waiting', text: 'Loading…' }));
      return;
    }

    head.append(el('button', {
      class: 'card',
      text: busy === 'before' ? 'Loading…' : '▲ Earlier',
      onclick: () => { if (!busy) serial(extendBefore); },
    }));

    if (busy === 'after') { tail.append(el('div', { class: 'waiting', text: 'Loading…' })); return; }
    if (agenda.stalled) {
      tail.append(el('button', {
        class: 'card',
        text: "Couldn't reach TaskDeck — tap to try again",
        onclick: () => { agenda.stalled = false; serial(extendAfter); },
      }));
      return;
    }
    if (pastCalendars()) {
      tail.append(el('div', { class: 'card' }, [
        el('span', { text: 'Your calendars are read as far as ' }),
        el('b', { text: agenda.known.until }),
        el('span', { text: '. Days after that show your own blocks and nothing else — not because they are free, but because nobody has looked.' }),
      ]));
    }
  }

  // Drop whole months off the far end once the DOM holds more than it needs.
  // Deferred to idle and skipped while a finger is down: a mutation landing
  // mid-fling is the one hazard that cannot be tested anywhere but on a phone.
  let pruneQueued = false;
  function requestPrune() {
    if (pruneQueued) return;
    pruneQueued = true;
    const run = () => { pruneQueued = false; pruneAgenda(); };
    if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 2000 });
    else setTimeout(run, 500);
  }
  function pruneAgenda() {
    const agenda = state.agenda;
    if (touchStart || !agenda.first) return;
    const months = new Set();
    for (let iso = agenda.first; iso <= agenda.last; iso = shiftDay(iso, 1)) months.add(monthOf(iso));
    if (months.size <= DOM_MONTHS_MAX) return;

    const here = agenda.month || monthOf(state.day);
    const ordered = [...months].sort((a, b) => Math.abs(monthsBetween(here, a)) - Math.abs(monthsBetween(here, b)));
    const keep = new Set(ordered.slice(0, DOM_MONTHS_TARGET));
    // Only ever a whole run from one end: the drawn days must stay contiguous.
    let first = agenda.first, last = agenda.last;
    while (first < last && !keep.has(monthOf(first))) first = shiftDay(`${monthOf(first)}-01`, daysInMonthOf(first));
    while (last > first && !keep.has(monthOf(last))) last = shiftDay(`${monthOf(last)}-01`, -1);

    if (last < agenda.last) {
      // Trimming the bottom while the reader is near it clamps the scroll
      // offset and throws the list a screenful. Two screens of clearance first.
      const bottom = state.agenda.nodes.get(agenda.last);
      const clear = bottom && bottom.getBoundingClientRect().top > window.innerHeight * 2;
      if (clear) dropRange(shiftDay(last, 1), agenda.last, 'below');
    }
    if (first > agenda.first) dropRange(agenda.first, shiftDay(first, -1), 'above');
  }
  function dropRange(from, to, where) {
    const agenda = state.agenda;
    const doomed = [];
    for (let iso = from; iso <= to; iso = shiftDay(iso, 1)) {
      const node = agenda.nodes.get(iso);
      if (node) doomed.push([iso, node]);
    }
    if (!doomed.length) return;
    const keep = where === 'above' ? agenda.nodes.get(shiftDay(to, 1)) : null;
    holdPlace(keep, () => {
      for (const [iso, node] of doomed) {
        unwatchDay(node);
        node.remove();
        agenda.nodes.delete(iso);
      }
    });
    if (where === 'above') agenda.first = shiftDay(to, 1);
    else agenda.last = shiftDay(from, -1);
    drawEnds();
  }

  // On opening, the first page is a month — thousands of pixels — so the
  // sentinel does not fire. If the store had less than that (an offline open
  // off a partial cache), one page is asked for straight away.
  function growIfShort() {
    if (!state.agenda.last) return;
    const tail = $('agendaTail').getBoundingClientRect();
    if (tail.top < window.innerHeight * 2) serial(extendAfter);
  }

  /* ─────────────────────────────── The weather ───────────────────────────
   *
   * The third view. It answers one question — *what is it going to do, and
   * does it land on anything I have to be at* — and it is built out of the
   * same parts as the other two: the masthead says the answer before anything
   * is read, the scrubber in the bar picks a day, and the plates scroll.
   *
   * Three things make it worth having over the weather app already on the
   * phone, and each of them is a consequence of it living here:
   *
   * **It is the desk's weather.** The coordinate is the one picked on the map
   * in Settings, so the forecast is for where the calendar is, not for
   * wherever the phone happens to be standing. The report says which place, by
   * name, so that can be checked at a glance rather than assumed.
   *
   * **It knows the day.** The strip under the hours is *today's plan* on the
   * same axis as the rain, which is the whole reason a calendar should draw
   * weather at all: "rain from three" and "the thing at three" are two facts
   * that mean something only together.
   *
   * **It works with the desk off.** The last report is kept here, drawn
   * immediately on opening, and marked with when it was fetched — the same
   * bargain the day and the agenda already make.
   *
   * The page never maps a weather code to a picture: every hour and every day
   * carries the name of its own symbol (`weather::sky_symbol`), so the only
   * pictures this can ask for are ones the binary is carrying.
   */

  // How many hours the chart draws. A day, so the axis needs no explanation,
  // and 24 columns across a phone is 15 pixels each — enough for a bar to be
  // read and not enough for an icon, which is why the sky is a strip of colour
  // along the top rather than a row of little suns.
  const WX_COLS = 24;
  // Fetched no oftener than this from the page's side. The server refreshes on
  // its own ten-minute clock, so asking faster only moves bytes.
  const WX_FRESH_MS = 5 * 60 * 1000;
  const WEATHER_KEY = 'taskdeck-weather';

  function recallWeather() {
    try {
      const held = JSON.parse(localStorage.getItem(WEATHER_KEY) || 'null');
      if (held && held.report && Array.isArray(held.report.hours)) {
        adoptWeather(held.report, held.at || 0);
      }
    } catch (_) {}
  }
  function keepWeather(report, at) {
    try { localStorage.setItem(WEATHER_KEY, JSON.stringify({ at, report })); } catch (_) {}
  }
  // One report, plus the index that turns a local timestamp into an hour. The
  // index is built once here rather than by searching the array: every draw
  // asks for a handful of specific hours, and a week is a hundred and
  // sixty-eight of them.
  function adoptWeather(report, at) {
    const byTime = new Map();
    for (let i = 0; i < report.hours.length; i++) byTime.set(report.hours[i].t, i);
    state.weather.report = report;
    state.weather.byTime = byTime;
    state.weather.at = at;
    state.weather.error = null;
  }

  async function loadWeather({ force = false } = {}) {
    const wx = state.weather;
    if (wx.asking) return;
    if (!force && wx.report && Date.now() - wx.at < WX_FRESH_MS) return;
    wx.asking = true;
    try {
      const report = await api('/api/weather');
      if (report && Array.isArray(report.hours)) {
        const at = Date.now();
        adoptWeather(report, at);
        keepWeather(report, at);
      }
    } catch (error) {
      if (error.status === 401) { showGate(); return; }
      // Never over the last report: a forecast from an hour ago is worth far
      // more than an apology, and the footer says how old it is either way.
      wx.error = error.message;
    } finally {
      wx.asking = false;
      if (state.mode === 'weather') renderWeather();
    }
  }

  /* ── Two clocks ──────────────────────────────────────────────────────────
   *
   * The forecast is stamped in the *place's* local time and the phone is in
   * its own, and for a wall calendar at home those are the same clock every
   * day of the year. They are not the same clock on a work trip, and then
   * everything the view says about "now" has to be about the place — it is
   * that sky the forecast describes — while everything it says about the plan
   * is about the board's day.
   *
   * So the two are computed separately and only ever drawn together when they
   * agree. `sameClock` is what the plan band hangs off: two hours out of step
   * and the band would draw a lecture an hour from where the rain is.
   */
  function placeClock() {
    const report = state.weather.report;
    const mineSeconds = -new Date().getTimezoneOffset() * 60;
    const offset = report && typeof report.utc_offset_seconds === 'number'
      ? report.utc_offset_seconds
      : mineSeconds;
    const at = new Date(Date.now() + offset * 1000);
    return {
      iso: `${at.getUTCFullYear()}-${pad(at.getUTCMonth() + 1)}-${pad(at.getUTCDate())}`,
      minutes: at.getUTCHours() * 60 + at.getUTCMinutes(),
      sameClock: offset === mineSeconds,
    };
  }
  function daysBetween(a, b) {
    const [ay, am, ad] = a.split('-').map(Number);
    const [by, bm, bd] = b.split('-').map(Number);
    return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
  }
  // The hour containing a moment at the place, or null where the report does
  // not reach — before its first day, past its last, or the hour a spring
  // clock change skips over.
  function wxHour(iso, minutes) {
    const index = state.weather.byTime.get(`${iso}T${pad(Math.floor(minutes / 60))}:00`);
    return index === undefined ? null : state.weather.report.hours[index];
  }
  // Which day the hours, the facts and the headline are showing. Today at the
  // place unless a day was picked, and today again as soon as the picked one
  // falls off the back of the forecast.
  function wxDay() {
    const clock = placeClock();
    const days = (state.weather.report && state.weather.report.days) || [];
    const picked = state.weather.day;
    if (picked && days.some((day) => day.date === picked)) return picked;
    if (days.some((day) => day.date === clock.iso)) return clock.iso;
    return days.length ? days[0].date : clock.iso;
  }

  /* ── Saying what the sky is doing ──────────────────────────────────────── */

  // WMO 4677, in the words a person would use. The symbol comes off the wire
  // with the hour; this is only the caption, and it is here because it is the
  // one part of the forecast that is prose rather than data.
  const SKY_WORDS = {
    0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast',
    45: 'Fog', 48: 'Freezing fog',
    51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
    56: 'Freezing drizzle', 57: 'Freezing drizzle',
    61: 'Light rain', 63: 'Rain', 65: 'Heavy rain',
    66: 'Freezing rain', 67: 'Freezing rain',
    71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains',
    80: 'Light showers', 81: 'Showers', 82: 'Heavy showers',
    85: 'Light snow showers', 86: 'Snow showers',
    95: 'Thunderstorm', 96: 'Thunderstorm, hail', 99: 'Thunderstorm, hail',
  };
  const skyWord = (code) => SKY_WORDS[code] || 'Cloudy';

  // What is falling, if anything — the distinction the whole view turns on.
  const WET = {
    snow: [71, 73, 75, 77, 85, 86],
    sleet: [56, 57, 66, 67],
    storm: [95, 96, 99],
    rain: [51, 53, 55, 61, 63, 65, 80, 81, 82],
  };
  function wetKind(code) {
    for (const kind of Object.keys(WET)) if (WET[kind].includes(code)) return kind;
    return null;
  }
  const WET_WORDS = { snow: 'Snow', sleet: 'Sleet', storm: 'Thunder', rain: 'Rain' };
  // The tint a mark of this weather is drawn in, and how strongly.
  //
  // Falling water is the one blue whatever hour it falls in — rain at midnight
  // is rain — and cloud is grey for the same reason. What the sun is doing is
  // the part that has to know: clear is the amber the rest of the page uses
  // for today, and a clear *night* is an indigo, because a strip of amber
  // across the small hours reads as a sunny night.
  function skyTint(code, isDay) {
    const kind = wetKind(code);
    if (kind === 'storm') return { tint: 'var(--w-storm)', alpha: 0.9 };
    if (kind === 'snow') return { tint: 'var(--w-snow)', alpha: 0.85 };
    if (kind === 'sleet') return { tint: 'var(--w-snow)', alpha: 0.7 };
    if (kind === 'rain') return { tint: 'var(--w-rain)', alpha: 0.85 };
    if (code === 45 || code === 48) return { tint: 'var(--w-cloud)', alpha: 0.75 };
    const open = isDay === false ? 'var(--w-night)' : 'var(--w-sun)';
    if (code === 0) return { tint: open, alpha: 0.9 };
    if (code === 1) return { tint: open, alpha: 0.5 };
    if (code === 2) return { tint: 'var(--w-cloud)', alpha: 0.45 };
    return { tint: 'var(--w-cloud)', alpha: 0.7 };
  }

  // An hour counts as wet when the forecast is more than half-hearted about
  // it. Both halves matter: a high chance of nothing measurable is drizzle you
  // would not turn back for, and a low chance of four millimetres is worth
  // knowing about.
  const wet = (hour) => !!hour && (hour.pop >= 40 || hour.mm >= 0.2);

  const temp = (value) => `${Math.round(value)}°`;
  // Metres per second, which is what the wind is quoted in where this app
  // comes from — and a word beside it, because the word is the part anyone
  // acts on and it means the same thing in any unit.
  function windWord(ms) {
    if (ms < 1.5) return 'calm';
    if (ms < 4) return 'light';
    if (ms < 8) return 'breezy';
    if (ms < 14) return 'windy';
    if (ms < 21) return 'gale';
    return 'storm';
  }
  const COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  const dirWord = (deg) => COMPASS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
  function uvWord(uv) {
    if (uv < 3) return 'low';
    if (uv < 6) return 'moderate';
    if (uv < 8) return 'high';
    if (uv < 11) return 'very high';
    return 'extreme';
  }
  // `13:45` out of `2026-09-10T13:45`, without going through `Date` — which
  // would read it as the reader's own local time and shift a foreign sunrise
  // by however many hours the two places are apart.
  const clockOf = (stamp) => (stamp && stamp.length >= 16 ? stamp.slice(11, 16) : '');
  const dateOf = (stamp) => (stamp ? stamp.slice(0, 10) : '');
  function minutesOfStamp(stamp) {
    if (!stamp || stamp.length < 16) return null;
    return Number(stamp.slice(11, 13)) * 60 + Number(stamp.slice(14, 16));
  }

  /* ── The answer, before you read ────────────────────────────────────────
   *
   * The same line the agenda uses, asking the weather's version of the
   * question: *is anything going to fall on me, and when*. It is the only part
   * of this view that is always on screen, so it is written to be read at a
   * glance and never to need the chart underneath it to make sense.
   *
   * The order of the cases is the order the facts matter in. Rain that has
   * already started beats rain that might; rain beats wind; and a day with
   * none of that is described by its sky, which is the honest headline for a
   * dry Tuesday.
   */
  function weatherGlance() {
    const wx = state.weather;
    if (!wx.report) {
      return {
        lead: 'No forecast',
        // Whatever TaskDeck said, said once. The card below explains where a
        // forecast comes from; repeating the failure in both is how a view
        // with nothing in it ends up saying the same sentence three times.
        detail: wx.error || 'None fetched yet — this fills in when the first one lands',
        accent: 'var(--muted)',
        hollow: true,
      };
    }
    const clock = placeClock();
    const start = wx.byTime.get(`${clock.iso}T${pad(Math.floor(clock.minutes / 60))}:00`);
    const now = wx.report.now;
    if (start === undefined) {
      // The report does not reach this hour — it is old, or the clocks have
      // moved. Say what is known and nothing more.
      return {
        lead: now ? `${temp(now.temp)} · ${skyWord(now.code)}` : 'Weather',
        detail: 'This forecast does not reach the hour it is now',
        accent: 'var(--muted)',
        hollow: true,
      };
    }
    // Thirteen, so that "the next twelve hours" has a twelfth hour in it.
    const ahead = wx.report.hours.slice(start, start + 13);
    const today = wx.report.days.find((day) => day.date === clock.iso);

    // How long a run of wet hours starting at `from` goes on for, and the
    // absolute minutes (from midnight today, at the place) it covers.
    const runFrom = (from) => {
      let end = from;
      while (end + 1 < ahead.length && wet(ahead[end + 1])) end += 1;
      const at = (index) => daysBetween(clock.iso, dateOf(ahead[index].t)) * 1440 + minutesOfStamp(ahead[index].t);
      return { from: at(from), until: at(end) + 60, hours: end - from + 1 };
    };
    // What this rain is going to land on. The point of drawing weather in a
    // calendar: the two facts are worth nothing apart and everything together.
    const clashWith = (run) => {
      if (!clock.sameClock) return null;
      const dates = [clock.iso, shiftDay(clock.iso, 1)];
      return wxCommitments(clock.iso, dates).find((c) => c.end > run.from && c.start < run.until) || null;
    };

    // Two witnesses, and either will do. `now` is an observation — what is
    // actually coming down — and `ahead[0]` is what the model says about the
    // hour it is falling in. They disagree exactly when rain is starting or
    // stopping, and of the two readings "it is raining" is the one worth
    // saying: a headline of "rain from four" while it is raining is the
    // failure this view exists to avoid.
    const fallingNow = (now && now.mm >= 0.05 ? wetKind(now.code) : null)
      || (wet(ahead[0]) ? wetKind(ahead[0].code) : null);
    if (fallingNow) {
      let dry = 1;
      while (dry < ahead.length && wet(ahead[dry])) dry += 1;
      const eases = dry < ahead.length
        ? `easing about ${clockOf(ahead[dry].t)}`
        : 'set in for the next twelve hours';
      const tint = skyTint(now ? now.code : ahead[0].code, ahead[0].day);
      return { lead: `${WET_WORDS[fallingNow]} now`, detail: eases, accent: tint.tint, hollow: false };
    }

    const soon = ahead.findIndex((hour, i) => i > 0 && wet(hour));
    if (soon > 0) {
      const run = runFrom(soon);
      const away = run.from - clock.minutes;
      const kind = wetKind(ahead[soon].code) || 'rain';
      const word = WET_WORDS[kind];
      const clash = clashWith(run);
      const spell = run.hours >= 2 ? `${clockOf(ahead[soon].t)}–${hhmm(run.until % 1440)}` : clockOf(ahead[soon].t);
      return {
        lead: away <= 90 ? `${word} in ${dur(Math.max(5, away))}` : `${word} from ${clockOf(ahead[soon].t)}`,
        detail: clash
          ? `${spell} · during ${shortName(clash.name)}`
          : `${spell} · ${ahead[soon].pop}% chance`,
        accent: skyTint(ahead[soon].code, ahead[soon].day).tint,
        hollow: false,
      };
    }

    const gust = ahead.reduce((worst, hour) => Math.max(worst, hour.gust), 0);
    if (gust >= 14) {
      const at = ahead.reduce((worst, hour) => (hour.gust > worst.gust ? hour : worst), ahead[0]);
      return {
        lead: `${windWord(gust) === 'gale' ? 'Gale' : 'Windy'} · gusts ${Math.round(gust)} m/s`,
        detail: `strongest about ${clockOf(at.t)}, from the ${dirWord(at.dir)}`,
        accent: 'var(--w-cloud)',
        hollow: false,
      };
    }

    const sky = skyWord(now ? now.code : ahead[0].code);
    const tint = skyTint(now ? now.code : ahead[0].code, now ? now.day : ahead[0].day);
    return {
      lead: `${sky} · ${temp(now ? now.temp : ahead[0].temp)}`,
      detail: today
        ? `Dry for twelve hours · ${temp(today.high)} / ${temp(today.low)} today`
        : 'Dry for the next twelve hours',
      accent: tint.tint,
      hollow: true,
    };
  }

  // Everything on the board that takes time, over the given dates, counted in
  // minutes from midnight of `baseIso` so a window that crosses midnight can
  // be compared against it in one number.
  function wxCommitments(baseIso, dates) {
    const out = [];
    for (const date of dates) {
      const shift = daysBetween(baseIso, date) * 1440;
      for (const c of commitments(state.agenda.days.get(date))) {
        if (c.end <= c.start) continue;
        out.push(Object.assign({}, c, { start: c.start + shift, end: c.end + shift }));
      }
    }
    return out.sort((a, b) => a.start - b.start);
  }

  function renderWeatherGlance() {
    const box = $('summary');
    box.classList.add('glance');
    const at = weatherGlance();
    const detail = el('span', { class: 'gdetail', text: at.detail });
    const stale = wxStaleNote();
    if (stale) detail.append(stale);
    box.replaceChildren(
      el('span', { class: 'gdot' + (at.hollow ? ' hollow' : ''), style: `--accent:${at.accent}` }),
      el('span', { class: 'glead', text: at.lead }),
      detail,
    );
  }

  // The forecast's age, said only once it is worth saying. The weather is
  // allowed to be a few minutes old — that is what a forecast is — so this
  // stays quiet until it is old enough that somebody should know.
  const WX_OLD_MS = 45 * 60 * 1000;
  function wxStaleNote() {
    const wx = state.weather;
    if (!wx.report || Date.now() - wx.at < WX_OLD_MS) return null;
    const when = new Date(wx.at).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    return el('span', { class: 'stalenote', text: ` · as of ${when}` });
  }

  /* ── Drawing it ──────────────────────────────────────────────────────────
   *
   * The chart is one inline SVG, built as text and measured in real pixels: a
   * `viewBox` the width of the box it goes in, so nothing is scaled and a
   * 10px label is 10px. It is redrawn when the day changes, when a new report
   * lands, and when the window is resized to a different width — and never
   * while a finger is on it, which is why scrubbing moves two attributes
   * instead of re-rendering.
   *
   * Five things share one x axis, and that sharing is the whole design:
   * the strip of sky along the top, the temperature curve, the chance of rain
   * rising from the baseline, the hours, and — underneath — what the board
   * says you are doing. Read down any vertical line and you have the answer.
   */
  const WX_PLOT = {
    sky: 12,          // the strip of sky: 0 → 12
    curveTop: 26,     // the temperature curve lives between these two
    curveBottom: 94,
    rain: 40,         // how tall a 100% bar is, rising from the baseline
    base: 122,        // the baseline everything below hangs from
    axis: 137,        // where the hour labels sit
    plan: 143,        // the plan band: 143 → 157
    planH: 14,
    height: 159,
  };

  const xml = (text) => String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // Roughly how many characters fit, at the 10px face the band is set in.
  function clipText(text, pixels) {
    const fits = Math.floor(pixels / 5.6);
    if (fits < 2) return '';
    return text.length <= fits ? text : `${text.slice(0, fits - 1)}…`;
  }

  function wxWindow(day) {
    const clock = placeClock();
    const isToday = day === clock.iso;
    // Today rolls: one hour back, so what has just happened is still on
    // screen, and twenty-three forward. Any other day is drawn midnight to
    // midnight, because that is what "Thursday" means.
    const startHour = isToday ? Math.max(0, Math.floor(clock.minutes / 60) - 1) : 0;
    const cols = [];
    let iso = day;
    let hour = startHour;
    for (let i = 0; i < WX_COLS; i++) {
      cols.push({ iso, hour, at: wxHour(iso, hour * 60) });
      hour += 1;
      if (hour === 24) { hour = 0; iso = shiftDay(iso, 1); }
    }
    return { cols, day, isToday, clock, startHour };
  }

  function wxChartSvg(win, width) {
    const known = win.cols.filter((col) => col.at);
    if (!known.length) return '';
    const colW = width / WX_COLS;
    const cx = (i) => (i + 0.5) * colW;

    const temps = known.map((col) => col.at.temp);
    let lo = Math.min.apply(null, temps);
    let hi = Math.max.apply(null, temps);
    // A flat day would otherwise be drawn as a wild line through a
    // half-degree range. Four degrees is the least the axis ever spans.
    if (hi - lo < 4) { const mid = (hi + lo) / 2; lo = mid - 2; hi = mid + 2; }
    const y = (value) => WX_PLOT.curveBottom - ((value - lo) / (hi - lo)) * (WX_PLOT.curveBottom - WX_PLOT.curveTop);

    const parts = [];

    // Night, first and behind everything: the hours the sun is down, so the
    // shape of the day is visible without reading a sunrise time.
    win.cols.forEach((col, i) => {
      if (!col.at || col.at.day) return;
      parts.push(`<rect x="${(i * colW).toFixed(2)}" y="0" width="${(colW + 0.4).toFixed(2)}" height="${WX_PLOT.base}" style="fill:rgba(0,0,0,0.28)"/>`);
    });

    // The strip of sky. One cell an hour, in the colour of what it is doing —
    // which reads as "grey until two, then blue" from across a room.
    win.cols.forEach((col, i) => {
      if (!col.at) return;
      const { tint, alpha } = skyTint(col.at.code, col.at.day);
      parts.push(`<rect x="${(i * colW).toFixed(2)}" y="0" width="${(colW + 0.4).toFixed(2)}" height="${WX_PLOT.sky}" style="fill:${tint};opacity:${alpha}"/>`);
    });

    // Midnight, and whose day it is on the far side of it.
    win.cols.forEach((col, i) => {
      if (col.hour !== 0 || i === 0) return;
      const x = (i * colW).toFixed(2);
      const [dy, dm, dd] = col.iso.split('-').map(Number);
      const name = new Date(dy, dm - 1, dd).toLocaleDateString(undefined, { weekday: 'short' });
      parts.push(`<line x1="${x}" x2="${x}" y1="${WX_PLOT.sky}" y2="${WX_PLOT.base}" style="stroke:var(--edge-2)" stroke-width="1" stroke-dasharray="2 3"/>`);
      parts.push(`<text x="${(i * colW + 3).toFixed(2)}" y="${WX_PLOT.sky + 11}" style="fill:var(--muted);font:700 9px var(--mono-stack);letter-spacing:0.1em">${xml(name.toUpperCase())}</text>`);
    });

    // The baseline the rain stands on and the hours are labelled under.
    parts.push(`<line x1="0" x2="${width.toFixed(2)}" y1="${WX_PLOT.base}" y2="${WX_PLOT.base}" style="stroke:var(--line)" stroke-width="1"/>`);

    // The chance of rain, and how much of it. The bar's height is the chance,
    // because that is the number a decision is made on; how solid it is says
    // how much would fall, because a certainty of nothing measurable and a
    // long shot at four millimetres are not the same warning.
    win.cols.forEach((col, i) => {
      if (!col.at || col.at.pop <= 0) return;
      const tall = (col.at.pop / 100) * WX_PLOT.rain;
      if (tall < 0.6) return;
      const solid = 0.3 + Math.min(col.at.mm, 3) / 3 * 0.55;
      const kind = wetKind(col.at.code);
      const tint = kind === 'snow' || kind === 'sleet' ? 'var(--w-snow)' : 'var(--w-rain)';
      parts.push(`<rect x="${(i * colW + colW * 0.18).toFixed(2)}" y="${(WX_PLOT.base - tall).toFixed(2)}" width="${(colW * 0.64).toFixed(2)}" height="${tall.toFixed(2)}" rx="1" style="fill:${tint};opacity:${solid.toFixed(2)}"/>`);
    });

    // The temperature. Drawn twice — a dark stroke under a light one — so the
    // line reads over a photograph as well as over a plate, the same trick the
    // agenda's route thread uses.
    const points = win.cols
      .map((col, i) => (col.at ? `${cx(i).toFixed(2)},${y(col.at.temp).toFixed(2)}` : null))
      .filter(Boolean)
      .join(' ');
    parts.push(`<polyline points="${points}" fill="none" style="stroke:rgba(4,6,8,0.6)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    parts.push(`<polyline points="${points}" fill="none" style="stroke:var(--w-sun)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`);

    // The two ends of the day, labelled where they happen. Nothing else on the
    // curve is worth a number: the readout above says any hour exactly.
    const warmest = known.reduce((best, col) => (col.at.temp > best.at.temp ? col : best), known[0]);
    const coldest = known.reduce((best, col) => (col.at.temp < best.at.temp ? col : best), known[0]);
    for (const [col, above] of [[warmest, true], [coldest, false]]) {
      if (warmest === coldest && !above) continue;
      const i = win.cols.indexOf(col);
      const at = cx(i);
      const anchor = at < 26 ? 'start' : at > width - 26 ? 'end' : 'middle';
      const nudge = anchor === 'start' ? -4 : anchor === 'end' ? 4 : 0;
      parts.push(`<circle cx="${at.toFixed(2)}" cy="${y(col.at.temp).toFixed(2)}" r="2.5" style="fill:var(--w-sun);stroke:rgba(4,6,8,0.6)" stroke-width="1.5"/>`);
      parts.push(`<text x="${(at + nudge).toFixed(2)}" y="${(y(col.at.temp) + (above ? -7 : 14)).toFixed(2)}" text-anchor="${anchor}" style="fill:var(--text);font:700 11px var(--mono-stack);paint-order:stroke;stroke:rgba(4,6,8,0.75);stroke-width:3px">${xml(temp(col.at.temp))}</text>`);
    }

    // The hours. Every third, which on a phone is the most that can be set at
    // ten pixels without the labels touching.
    win.cols.forEach((col, i) => {
      if (col.hour % 3 !== 0) return;
      const at = cx(i);
      if (at < 8 || at > width - 8) return;
      parts.push(`<text x="${at.toFixed(2)}" y="${WX_PLOT.axis}" text-anchor="middle" style="fill:var(--muted);font:600 10px var(--mono-stack)">${pad(col.hour)}</text>`);
    });

    // What the board says you are doing, on the same axis. This is the reason
    // the weather is drawn in a calendar at all.
    const planned = wxPlanBand(win);
    if (planned.length) {
      parts.push(`<rect x="0" y="${WX_PLOT.plan}" width="${width.toFixed(2)}" height="${WX_PLOT.planH}" rx="3" style="fill:var(--edge);opacity:0.6"/>`);
      for (const block of planned) {
        const from = Math.max(0, block.from) * colW;
        const to = Math.min(WX_COLS, block.to) * colW;
        const wide = Math.max(2, to - from);
        parts.push(`<rect x="${from.toFixed(2)}" y="${WX_PLOT.plan}" width="${wide.toFixed(2)}" height="${WX_PLOT.planH}" rx="3" style="fill:${block.accent};opacity:0.9"/>`);
        const label = clipText(shortName(block.name), wide - 8);
        if (label) {
          parts.push(`<text x="${(from + 4).toFixed(2)}" y="${WX_PLOT.plan + 10}" style="fill:#0f1113;font:700 10px -apple-system,system-ui,sans-serif">${xml(label)}</text>`);
        }
      }
    }

    // Now, and the hour the reader has a finger on. The now-line is the
    // desktop's own colour, so it means the same thing here as it does there.
    // Named, because the minute moves them rather than redrawing the chart
    // (`tickWeather`). Only today has a now, so only today draws them.
    if (win.isToday) {
      const at = ((win.clock.minutes / 60) - win.startHour) * colW;
      const shown = at >= 0 && at <= width ? 1 : 0;
      parts.push(`<line id="wxNowLine" x1="${at.toFixed(2)}" x2="${at.toFixed(2)}" y1="0" y2="${WX_PLOT.base + 4}" opacity="${shown}" style="stroke:var(--now)" stroke-width="2"/>`);
      parts.push(`<circle id="wxNowDot" cx="${at.toFixed(2)}" cy="${WX_PLOT.base + 4}" r="3" opacity="${shown}" style="fill:var(--now)"/>`);
    }
    parts.push(`<line id="wxMark" x1="0" x2="0" y1="0" y2="${WX_PLOT.base}" opacity="0" style="stroke:var(--text)" stroke-width="1.5" stroke-dasharray="3 3"/>`);

    return `<svg viewBox="0 0 ${width.toFixed(2)} ${WX_PLOT.height}" width="${width.toFixed(2)}" height="${WX_PLOT.height}" role="img" aria-label="The next day's temperature, chance of rain and plan">${parts.join('')}</svg>`;
  }

  // The board's day, in column space. Empty when the phone and the forecast
  // are on different clocks — a band an hour out of step is worse than none,
  // because it looks exactly as right as a correct one.
  function wxPlanBand(win) {
    if (!win.clock.sameClock) return [];
    const first = win.cols[0];
    const dates = [];
    for (const col of win.cols) if (!dates.includes(col.iso)) dates.push(col.iso);
    const base = first.iso;
    return wxCommitments(base, dates)
      .map((c) => ({
        from: c.start / 60 - first.hour,
        to: c.end / 60 - first.hour,
        name: c.name,
        accent: c.accent,
      }))
      .filter((block) => block.to > 0 && block.from < WX_COLS);
  }

  /* ── The hour under the thumb ────────────────────────────────────────────
   *
   * A chart with no numbers on it is a picture; one with a number on every
   * hour is a table. This is the third thing: drag along the chart and the
   * line above it says that hour exactly. Nothing is re-rendered while the
   * finger is down — the marker is one line's two attributes and the readout
   * is one element's children — because replacing the SVG under a pointer
   * capture ends the gesture.
   */
  function renderWxReadout() {
    const win = state.weather.win;
    const box = $('wxRead');
    if (!win) { box.replaceChildren(); return; }
    const key = state.weather.hour;
    const scrubbed = key ? win.cols.find((col) => col.at && col.at.t === key) : null;
    let hour = scrubbed && scrubbed.at;
    let when = hour ? clockOf(hour.t) : '';
    let live = false;
    if (!hour && win.isToday) {
      hour = wxHour(win.clock.iso, win.clock.minutes) || (win.cols.find((col) => col.at) || {}).at;
      when = 'Now';
      live = true;
    } else if (!hour) {
      const midday = win.cols.find((col) => col.at && col.hour === 12) || win.cols.find((col) => col.at);
      hour = midday && midday.at;
      when = hour ? clockOf(hour.t) : '';
    }
    if (!hour) {
      box.replaceChildren(el('span', { class: 'bits', text: 'This forecast has no hours for that day' }));
      return;
    }
    // The current conditions are an observation and the hour is a forecast of
    // it; where both exist, the observation wins.
    const now = live && state.weather.report.now ? state.weather.report.now : null;
    const reading = now || hour;
    const bits = [`<b>${temp(reading.temp)}</b>`];
    if (Math.round(reading.feels) !== Math.round(reading.temp)) bits.push(`feels ${temp(reading.feels)}`);
    bits.push(xml(skyWord(reading.code)));
    if (hour.pop > 0) bits.push(`${hour.pop}%${hour.mm >= 0.1 ? ` ${hour.mm.toFixed(1)}mm` : ''}`);
    bits.push(`${dirWord(reading.dir)} ${Math.round(reading.wind)} m/s${reading.gust >= reading.wind + 3 ? ` (${Math.round(reading.gust)})` : ''}`);
    if (hour.uv >= 1) bits.push(`UV ${hour.uv.toFixed(0)}`);
    const children = [
      el('span', { class: 'when', text: when }),
      el('span', { class: 'bits', html: bits.join(' · ') }),
    ];
    if (scrubbed) {
      children.push(el('button', {
        class: 'chip', style: 'height:28px;min-width:0;padding:0 10px;font-size:12px;margin-left:auto',
        text: 'Now',
        onclick: () => { state.weather.hour = null; paintScrub(); },
      }));
    }
    box.replaceChildren(...children);
  }

  function paintScrub() {
    const win = state.weather.win;
    const mark = $('wxMark');
    if (mark && win) {
      const key = state.weather.hour;
      const index = key ? win.cols.findIndex((col) => col.at && col.at.t === key) : -1;
      if (index < 0) {
        mark.setAttribute('opacity', '0');
      } else {
        const at = ((index + 0.5) * (state.weather.width / WX_COLS)).toFixed(2);
        mark.setAttribute('opacity', '1');
        mark.setAttribute('x1', at);
        mark.setAttribute('x2', at);
      }
    }
    renderWxReadout();
  }

  // The now-line, moved rather than redrawn. It is the one mark on the chart
  // that the minute changes, and the chart is the one thing on the page that
  // must not be replaced under a finger — so, like the scrub mark, it is a few
  // attributes on elements the SVG already has.
  function paintNow() {
    const win = state.weather.win;
    const line = $('wxNowLine');
    const dot = $('wxNowDot');
    if (!win || !line || !dot) return;
    const at = ((win.clock.minutes / 60) - win.startHour) * (state.weather.width / WX_COLS);
    const shown = at >= 0 && at <= state.weather.width ? '1' : '0';
    const x = at.toFixed(2);
    line.setAttribute('x1', x);
    line.setAttribute('x2', x);
    line.setAttribute('opacity', shown);
    dot.setAttribute('cx', x);
    dot.setAttribute('opacity', shown);
  }

  // Once a minute while the view is open. The whole view is redrawn only when
  // the minute has changed what the chart is *of* — the hour rolled, so
  // today's window shifts a column; midnight passed; the day being read is no
  // longer the one to read — and otherwise only the three things that are
  // wrong the moment they are old are touched: the answer line, the readout,
  // and the now-line. Redrawing everything every sixty seconds replaced seven
  // images, seven rows and the chart to move one line two pixels, and took
  // away any tap that was landing on a week row at that instant.
  function tickWeather() {
    const win = state.weather.win;
    if (!win) { renderWeather(); return; }
    const clock = placeClock();
    const isToday = win.day === clock.iso;
    const startHour = isToday ? Math.max(0, Math.floor(clock.minutes / 60) - 1) : 0;
    if (win.day !== wxDay() || win.clock.iso !== clock.iso || isToday !== win.isToday || startHour !== win.startHour) {
      renderWeather();
      return;
    }
    win.clock = clock;
    renderWeatherGlance();
    paintNow();
    renderWxReadout();
  }

  function armChartScrub(svg) {
    const pick = (clientX) => {
      const win = state.weather.win;
      const rect = svg.getBoundingClientRect();
      if (!win || !rect.width) return;
      const column = Math.floor(((clientX - rect.left) / rect.width) * WX_COLS);
      const col = win.cols[Math.max(0, Math.min(WX_COLS - 1, column))];
      const key = col && col.at ? col.at.t : null;
      if (key === state.weather.hour) return;
      state.weather.hour = key;
      paintScrub();
    };
    svg.addEventListener('pointerdown', (e) => {
      wxHolding = true;
      // Captured so a finger that wanders off the chart keeps scrubbing it —
      // and released by the browser itself, with a `pointercancel`, the moment
      // it decides the gesture was a vertical scroll (`touch-action: pan-y`).
      if (svg.setPointerCapture) { try { svg.setPointerCapture(e.pointerId); } catch (_) {} }
      pick(e.clientX);
    });
    svg.addEventListener('pointermove', (e) => { if (wxHolding) pick(e.clientX); });
    for (const type of ['pointerup', 'pointercancel', 'pointerleave']) {
      svg.addEventListener(type, () => { wxHolding = false; });
    }
  }

  /* ── The plates ──────────────────────────────────────────────────────────*/

  function renderWxNow(day) {
    const wx = state.weather;
    const clock = placeClock();
    const today = day === clock.iso;
    const forecast = wx.report.days.find((entry) => entry.date === day);
    const now = today ? wx.report.now : null;
    const shown = now || (forecast ? { temp: forecast.high, code: forecast.code, sym: forecast.sym, feels: forecast.feels_high } : null);
    if (!shown) { $('wxNow').replaceChildren(el('div', { class: 'wxnone', text: 'Nothing for that day.' })); return; }
    const [dy, dm, dd] = day.split('-').map(Number);
    const named = new Date(dy, dm - 1, dd).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    const aside = today
      ? [wx.report.place, clock.sameClock ? null : `${hhmm(clock.minutes)} there`].filter(Boolean).join(' · ')
      : `${wx.report.place} · ${named}`;
    const figure = el('div', { class: 'figure' }, [
      el('div', { class: 'temp', text: temp(shown.temp) }),
      el('div', {
        class: 'word',
        text: `${skyWord(shown.code)}${Math.round(shown.feels) !== Math.round(shown.temp) ? ` · feels ${temp(shown.feels)}` : ''}`,
      }),
      el('div', { class: 'aside', text: aside }),
    ]);
    const hilo = forecast
      ? el('div', { class: 'hilo' }, [el('b', { text: temp(forecast.high) }), temp(forecast.low)])
      : null;
    $('wxNow').replaceChildren(...[
      el('img', { src: `/weather/${shown.sym}.svg`, alt: skyWord(shown.code), width: 76, height: 76 }),
      figure,
      hilo,
    ].filter(Boolean));
  }

  function renderWxChart(day) {
    const plot = $('wxPlot');
    const width = Math.max(200, Math.round(plot.clientWidth || plot.getBoundingClientRect().width));
    const win = wxWindow(day);
    state.weather.win = win;
    state.weather.width = width;
    // A scrubbed hour that is not in the new window has stopped meaning
    // anything: dropped rather than carried, or the readout would describe an
    // hour with no mark under it.
    if (state.weather.hour && !win.cols.some((col) => col.at && col.at.t === state.weather.hour)) {
      state.weather.hour = null;
    }
    const svg = wxChartSvg(win, width);
    if (!svg) {
      plot.replaceChildren(el('div', { class: 'wxnone', text: 'No hours for this day.' }));
      $('wxLegend').replaceChildren();
      renderWxReadout();
      return;
    }
    plot.replaceChildren(el('div', { html: svg }));
    const drawn = plot.querySelector('svg');
    if (drawn) armChartScrub(drawn);
    $('wxLegend').replaceChildren(
      el('span', { html: '<i style="background:var(--w-sun)"></i>temperature' }),
      el('span', { html: '<i style="background:var(--w-rain)"></i>chance of rain' }),
      el('span', { html: '<i style="background:var(--edge-2)"></i>your day' }),
    );
    paintScrub();
  }

  function fact(key, value, note) {
    return el('div', {}, [
      el('div', { class: 'k', text: key }),
      el('div', { class: 'v' }, [value, note ? el('span', { class: 'n', text: ` ${note}` }) : null]),
    ]);
  }

  function renderWxFacts(day) {
    const forecast = state.weather.report.days.find((entry) => entry.date === day);
    const box = $('wxFacts');
    if (!forecast) { box.replaceChildren(); return; }
    const rise = minutesOfStamp(forecast.sunrise);
    const set = minutesOfStamp(forecast.sunset);
    const daylight = rise !== null && set !== null && set > rise ? dur(set - rise) : null;
    box.replaceChildren(
      el('h3', { text: 'The day' }),
      el('div', { class: 'wxfacts' }, [
        fact('Sunrise', clockOf(forecast.sunrise) || '—'),
        fact('Sunset', clockOf(forecast.sunset) || '—'),
        fact('Daylight', daylight || (rise === null && set === null ? '—' : 'all day')),
        fact('UV', forecast.uv >= 0.5 ? forecast.uv.toFixed(0) : '0', uvWord(forecast.uv)),
        fact('Wind', `${Math.round(forecast.wind)} m/s`, `${windWord(forecast.wind)}, gusts ${Math.round(forecast.gust)}`),
        fact(
          'Rain',
          forecast.mm >= 0.05 ? `${forecast.mm.toFixed(1)} mm` : 'none',
          forecast.pop > 0 ? `${forecast.pop}% at its likeliest` : null,
        ),
      ]),
    );
  }

  function renderWxWeek(day) {
    const wx = state.weather;
    const days = wx.report.days;
    const box = $('wxWeek');
    if (!days.length) { box.replaceChildren(); return; }
    // One scale for the whole week, so the bars can be compared with each
    // other — which is the only thing a row of bars is for.
    const lows = days.map((entry) => entry.low);
    const highs = days.map((entry) => entry.high);
    const floor = Math.min.apply(null, lows);
    const ceiling = Math.max.apply(null, highs);
    const span = Math.max(1, ceiling - floor);
    const clock = placeClock();
    const rows = days.map((entry) => {
      const [dy, dm, dd] = entry.date.split('-').map(Number);
      const when = new Date(dy, dm - 1, dd);
      const isToday = entry.date === clock.iso;
      const bar = el('span', { class: 'range' }, [
        el('i', {
          style: `left:${((entry.low - floor) / span * 100).toFixed(1)}%;right:${((ceiling - entry.high) / span * 100).toFixed(1)}%`,
        }),
        isToday && wx.report.now
          ? el('b', {
              style: `left:calc(${Math.max(0, Math.min(100, (wx.report.now.temp - floor) / span * 100)).toFixed(1)}% - 2px)`,
              title: 'now',
            })
          : null,
      ]);
      return el('button', {
        class: `wxrow${entry.date === day ? ' on' : ''}${isToday ? ' today' : ''}`,
        'aria-label': `${when.toDateString()}, ${skyWord(entry.code)}, ${temp(entry.high)} to ${temp(entry.low)}`,
        'aria-current': entry.date === day ? 'true' : null,
        onclick: () => showWeatherDay(entry.date),
      }, [
        el('span', { class: 'wd', text: isToday ? 'Today' : when.toLocaleDateString(undefined, { weekday: 'short' }) }),
        el('img', { src: `/weather/${entry.sym}.svg`, alt: '', width: 30, height: 30 }),
        el('span', { class: 'pop', text: entry.pop >= 20 ? `${entry.pop}%` : '' }),
        el('span', { class: 'lo', text: temp(entry.low) }),
        bar,
        el('span', { class: 'hi', text: temp(entry.high) }),
      ]);
    });
    box.replaceChildren(el('h3', { text: 'The week' }), ...rows);
  }

  function renderWxFoot() {
    const wx = state.weather;
    const when = new Date(wx.at).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    const where = `${wx.report.latitude.toFixed(2)}, ${wx.report.longitude.toFixed(2)}`;
    const lines = [`Open-Meteo · ${where}${wx.report.timezone ? ` · ${wx.report.timezone}` : ''} · fetched ${when}`];
    // Only when there is something on screen to be wrong about. With no report
    // at all the failure is the whole of what the view says, up in the card.
    if (wx.error) lines.push(`Last try: ${wx.error}`);
    $('wxFoot').replaceChildren(...lines.map((line) => el('div', { text: line })));
  }

  // The scrubber for this view, in the row the week and the month rail use.
  function renderWxDays(day) {
    const rail = $('wxdays');
    const clock = placeClock();
    rail.replaceChildren(...state.weather.report.days.map((entry) => {
      const [dy, dm, dd] = entry.date.split('-').map(Number);
      const when = new Date(dy, dm - 1, dd);
      return el('button', {
        class: `${entry.date === day ? 'on' : ''}${entry.date === clock.iso ? ' today' : ''}`,
        'aria-label': `${when.toDateString()}, high ${temp(entry.high)}`,
        'aria-current': entry.date === day ? 'true' : null,
        onclick: () => showWeatherDay(entry.date),
      }, [
        el('span', { class: 'wd', text: when.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2) }),
        el('span', { class: 't', text: temp(entry.high) }),
      ]);
    }));
  }

  function showWeatherDay(date) {
    const clock = placeClock();
    // Today is the resting state, so picking it twice is not a different thing
    // from never having picked anything — which is what keeps the view
    // following the day over midnight.
    state.weather.day = date === clock.iso ? null : date;
    state.weather.hour = null;
    renderWeather();
  }

  // What the view is, when there is nothing of it to show. Never the failure
  // itself — the line in the masthead above has already said that — but where
  // a forecast comes from, which is the thing somebody staring at an empty
  // screen actually wants to know.
  function wxNone() {
    $('wxNow').replaceChildren(el('div', { class: 'wxnone' }, [
      el('b', { text: 'Nothing to show yet. ' }),
      'TaskDeck fetches the forecast for the place set on the map in its settings — '
      + 'when it starts, and every ten minutes after. This fills in as soon as one lands, '
      + 'and then keeps the last one, so it still reads with the desk switched off.',
    ]));
    for (const id of ['wxRead', 'wxPlot', 'wxLegend', 'wxFacts', 'wxWeek', 'wxFoot', 'wxdays']) $(id).replaceChildren();
    // Emptied and then taken away. An empty plate is a promise that something
    // is loading, and nothing is: three of them under a card explaining that
    // there is no forecast reads as a forecast that failed to draw.
    wxPlates(false);
    state.weather.win = null;
  }

  function wxPlates(shown) {
    for (const id of ['wxChart', 'wxFacts', 'wxWeek']) $(id).hidden = !shown;
  }

  // A finger is on the chart. Everything that draws goes through the function
  // below, and it stops here while that is true: a redraw replaces the SVG the
  // pointer is captured on, and the minute timer would otherwise end a scrub
  // mid-drag once every sixty seconds, at random.
  let wxHolding = false;
  // Cleared by a pointer ending anywhere, not only on the chart. A `pointerup`
  // the SVG never sees — the element replaced under the finger, a gesture the
  // system took away — would otherwise leave this set and the view frozen for
  // the rest of the session, which is a far worse failure than a scrub that
  // ends a moment early.
  for (const type of ['pointerup', 'pointercancel']) {
    document.addEventListener(type, () => { wxHolding = false; }, { passive: true, capture: true });
  }

  function renderWeather() {
    if (wxHolding) return;
    mastheadFor(todayIso(), true);
    renderWeatherGlance();
    if (!state.weather.report) { wxNone(); return; }
    wxPlates(true);
    const day = wxDay();
    renderWxNow(day);
    renderWxChart(day);
    renderWxFacts(day);
    renderWxWeek(day);
    renderWxFoot();
    renderWxDays(day);
  }

  /* ─────────────────────── Watching, without listening ───────────────────
   *
   * Two IntersectionObservers and no scroll handler anywhere. A scroll handler
   * that reads geometry is exactly the layout thrash this phone cannot afford;
   * an observer reports what it already knows and its callback here never
   * touches a rect.
   */
  let placeWatcher = null;
  let pageWatcher = null;
  function watchDay(node) { if (placeWatcher) placeWatcher.observe(node); }
  function unwatchDay(node) { if (placeWatcher) placeWatcher.unobserve(node); }

  function armObservers() {
    if (!window.IntersectionObserver) return;
    const top = stickyHeight();
    if (placeWatcher) placeWatcher.disconnect();
    placeWatcher = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const date = entry.target.dataset.date;
        if (!date) continue;
        if (entry.isIntersecting) state.agenda.onScreen.add(date);
        else state.agenda.onScreen.delete(date);
      }
      let earliest = null;
      for (const date of state.agenda.onScreen) if (!earliest || date < earliest) earliest = date;
      if (!earliest) return;
      const month = monthOf(earliest);
      if (month !== state.agenda.month) {
        state.agenda.month = month;
        if (state.mode === 'agenda') railAndMasthead();
      }
    }, { rootMargin: `${-top}px 0px 0px 0px` });
    for (const node of state.agenda.nodes.values()) placeWatcher.observe(node);

    if (!pageWatcher) {
      pageWatcher = new IntersectionObserver((entries) => {
        if (!entries.some((e) => e.isIntersecting)) return;
        if (state.mode !== 'agenda' || state.agenda.stalled) return;
        if (state.agenda.pending) return;
        state.agenda.pending = 'after';
        serial(extendAfter).then(() => { state.agenda.pending = null; });
      }, { rootMargin: `0px 0px ${SENTINEL_LEAD} 0px` });
      pageWatcher.observe($('agendaTail'));
    }
  }

  // The two sticky layers, measured once and written as custom properties.
  // Everything that needs the offset reads them, so nothing else in the file
  // forces a layout to find out how tall the masthead is today.
  let stickyKnown = -1;
  function stickyHeight() { return Math.max(0, stickyKnown); }
  function measureSticky() {
    // Rounded DOWN, never up. The masthead's height is fractional on a real
    // phone — system font metrics and a safe-area inset rarely land on a whole
    // pixel — and rounding up pins the day heading *below* the masthead's own
    // bottom edge, leaving a sliver of the list scrolling through the gap.
    // Rounding down tucks it under instead, which is invisible.
    const mast = Math.floor(document.querySelector('.mast').getBoundingClientRect().height);
    if (mast === stickyKnown) return;
    stickyKnown = mast;
    document.documentElement.style.setProperty('--mast-h', `${mast}px`);
    armObservers();
  }

  /* ───────────────────────── Going somewhere ───────────────────────── */

  // Every programmatic scroll in this file is `auto` and never `smooth`: the
  // engine skips its anchor adjustments for the whole duration of a scripted
  // animation, so a page arriving mid-animation lands it on the wrong days.
  function jumpToDate(iso, { load: allowLoad = true } = {}) {
    const agenda = state.agenda;
    const node = agenda.nodes.get(iso);
    if (node) {
      // Measured against the viewport rather than taken from `offsetTop`: a
      // day's offset parent is `#weekbody`, which is `position: relative`, so
      // `offsetTop` is short by the body's own offset — 213px as the page
      // stands, and a different number the moment the masthead changes height.
      // The rect form cannot go stale that way, and this reads geometry only on
      // a deliberate jump, never while scrolling.
      const top = node.getBoundingClientRect().top + window.scrollY - stickyHeight();
      window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
      return;
    }
    if (!allowLoad) return;
    // Somewhere else entirely. Abandon whatever growth is queued — its answers
    // are about days nobody is looking at any more — and start a run there.
    agenda.gen += 1;
    agenda.pending = null;
    agenda.stalled = false;
    agenda.first = null;
    agenda.last = null;
    agenda.nodes.clear();
    // The target's whole month, not a few days around it: a short run cannot
    // scroll its target to the top, so the reader would land near the day they
    // asked for and the rail would name the month above it.
    const from = firstOfMonth(monthOf(iso));
    const span = daysInMonthOf(iso);
    // Whatever storage already holds, drawn before anything is asked for.
    seedRun(iso);
    if (agenda.first) { renderAgenda(); drawEnds(); railAndMasthead(); jumpToDate(iso, { load: false }); }
    serial(async () => {
      await fetchPage(from, span, 'after');
      if (!agenda.nodes.get(iso)) { seedRun(iso); renderAgenda(); drawEnds(); }
      jumpToDate(iso, { load: false });
      railAndMasthead();
      // Give the list somewhere to go, so the first flick after arriving does
      // not stall on an empty tail.
      growIfShort();
    });
  }
  function jumpToMonth(by) {
    const here = state.agenda.month || monthOf(state.day);
    jumpToDate(firstOfMonth(shiftMonth(here, by)));
  }

  // The longest contiguous run in the store containing `around`, as the drawn
  // run's ends. Nothing is fetched: this is what an offline open draws from.
  function seedRun(around) {
    const agenda = state.agenda;
    if (!agenda.days.has(around)) {
      // Nothing for that exact day — the nearest held day in the same month,
      // and never one in another: a run that started a month away from where
      // the reader asked to be would scroll to the wrong place.
      let found = null;
      for (const date of agenda.days.keys()) {
        if (monthOf(date) !== monthOf(around)) continue;
        if (!found || Math.abs(Date.parse(date) - Date.parse(around)) < Math.abs(Date.parse(found) - Date.parse(around))) found = date;
      }
      if (!found) { agenda.first = null; agenda.last = null; return; }
      around = found;
    }
    let first = around, last = around;
    while (agenda.days.has(shiftDay(first, -1))) first = shiftDay(first, -1);
    while (agenda.days.has(shiftDay(last, 1))) last = shiftDay(last, 1);
    agenda.first = first;
    agenda.last = last;
  }

  // Read the months around today off storage into the store, so the first
  // frame after tapping the icon has the list in it — desk reachable or not.
  function seedAgenda() {
    for (let i = -CACHE_MONTHS_BACK; i <= CACHE_MONTHS_FORWARD; i++) {
      const held = recallMonth(shiftMonth(monthOf(todayIso()), i));
      if (!held) continue;
      for (const day of held.days) if (!state.agenda.days.has(day.date)) state.agenda.days.set(day.date, day);
    }
    // Always, whichever view is open. These are two dates derived from what is
    // already in memory — and leaving them unset in day mode meant that tapping
    // through to the agenda afterwards rendered an empty run, with nothing on
    // any later path to notice or repair it.
    seedRun(todayIso());
  }

  // One way to change the day on screen, from anywhere.
  function openDay(iso) {
    setMode('day');
    goTo(iso);
  }

  let hoursDrawn = false;
  function renderHours() {
    if (hoursDrawn) return;
    hoursDrawn = true;
    const hours = $('hours');
    for (let h = 0; h < 24; h++) {
      const line = el('div', { class: 'hourline' + ((h < 7 || h >= 22) ? ' small' : ''), style: `top:${h * HOUR}px` });
      line.append(el('span', { class: 'mono', text: pad(h) }));
      hours.append(line);
    }
  }

  function renderLanes(day) {
    // Never pull a block out from under a finger that is dragging it; the
    // drag's own finish redraws.
    if (drag && drag.active) return;
    const lanes = $('lanes');
    for (const node of Array.from(lanes.children)) {
      if (node.id !== 'emptyTap') node.remove();
    }

    // Subscribed calendars first, so the day's own blocks draw over them: the
    // board's things are what you came to look at.
    renderAllDay(day);
    // Background spans first and fainter — a course period, not an
    // appointment — then the real ones over them.
    for (const event of (day.subscribed || [])) {
      if (event.all_day) continue;
      const box = el('div', {
        class: event.background ? 'subscribed backdrop' : 'subscribed',
        style: `${spanStyle(event)}; --accent:${event.color}`,
        title: [event.calendar, event.where, event.note].filter(Boolean).join(' — '),
      });
      box.append(el('span', { class: 'what', text: event.name }));
      if (event.where) box.append(el('span', { class: 'where', text: event.where }));
      lanes.append(box);
    }

    for (const ghost of day.ghosts) {
      const node = el('div', {
        class: 'ghost',
        style: `${laneStyle(ghost)}; --accent:${colorOf(ghost.color)}`,
        text: `${ghost.finished ? '✓' : '✗'} ${ghost.name}`,
      });
      lanes.append(node);
    }

    for (const entry of day.entries) {
      const accent = colorOf(entry.color);
      const selected = state.selected && state.selected.id === entry.id
        && (state.selected.session === entry.session || (state.selected.session == null && entry.session == null));
      if (entry.marker) {
        const node = el('button', {
          class: 'marker' + (entry.due ? ' due' : '') + (selected ? ' selected' : ''),
          style: `${laneStyle(entry, 22)}; --accent:${accent}`,
          onclick: () => openItem(entry.id, entry.session),
        });
        node.append(el('span', { class: 'label', text: `${hhmm(entry.start)} · ${entry.name}` }));
        lanes.append(node);
        continue;
      }
      const height = Math.max(22, entry.minutes / 60 * HOUR);
      const short = height < 46;
      const node = el('button', {
        class: 'entry' + (entry.kind === 'routine' ? ' routine' : '') + (short ? ' short' : '') + (selected ? ' selected' : ''),
        style: `${laneStyle(entry)}; --accent:${accent}; --ground:${groundOf(entry.color)}`,
        onclick: () => { if (!suppressClick) openItem(entry.id, entry.session); },
      });
      node.append(
        el('div', { class: 'time mono', text: `${hhmm(entry.start)}–${hhmm(entry.start + entry.minutes)}` }),
        el('div', { class: 'name', text: entry.name }),
      );
      attachDrag(node, entry);
      lanes.append(node);
    }
  }

  /* ───────────────────────────── Dragging ─────────────────────────────
   *
   * Hold a block and it lifts; move the finger and it follows, snapped to
   * the quarter hour; let go and it is moved — the same `move_block` the
   * sheet's time input sends, so a routine's block moves its rule and an
   * event's block moves the event, exactly as on the desktop. A plain tap
   * still opens the sheet, and a finger that moves before the hold elapses
   * is a scroll and is left to the page.
   */
  const HOLD_MS = 350;
  const HOLD_SLOP_PX = 8;
  let drag = null;
  let suppressClick = false;

  function pointerMinutes(e) {
    const rect = $('lanes').getBoundingClientRect();
    return (e.clientY - rect.top) / HOUR * 60;
  }

  function endDrag(node, { redraw }) {
    const d = drag;
    drag = null;
    if (!d) return null;
    clearTimeout(d.timer);
    node.classList.remove('dragging');
    if (d.active) {
      // The click that follows the release must not open the sheet.
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 400);
      if (redraw) render();
    }
    return d;
  }

  function attachDrag(node, entry) {
    node.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (drag) endDrag(drag.node, { redraw: true });
      drag = {
        node, entry, pointerId: e.pointerId,
        grabOffset: pointerMinutes(e) - entry.start,
        start: entry.start, origin: { x: e.clientX, y: e.clientY },
        active: false, moved: false, timer: null,
      };
      drag.timer = setTimeout(() => {
        if (!drag || drag.node !== node) return;
        // A redraw during the hold replaced this node: nothing the finger
        // does now can reach it, so the hold is let go rather than left
        // armed for ever with the page unable to scroll or redraw.
        if (!node.isConnected) { endDrag(node, { redraw: true }); return; }
        drag.active = true;
        node.classList.add('dragging');
        try { node.setPointerCapture(e.pointerId); } catch (_) {}
        if (navigator.vibrate) navigator.vibrate(10);
      }, HOLD_MS);
    });

    node.addEventListener('pointermove', (e) => {
      if (!drag || drag.node !== node) return;
      if (!drag.active) {
        // Moved before the hold elapsed: a scroll, not a drag.
        if (Math.hypot(e.clientX - drag.origin.x, e.clientY - drag.origin.y) > HOLD_SLOP_PX) endDrag(node, { redraw: false });
        return;
      }
      const start = Math.max(0, Math.min(24 * 60 - entry.minutes, snap(pointerMinutes(e) - drag.grabOffset)));
      if (start === drag.start) return;
      drag.start = start;
      drag.moved = start !== entry.start;
      node.style.top = `${start / 60 * HOUR}px`;
      const time = node.querySelector('.time');
      if (time) time.textContent = `${hhmm(start)}–${hhmm(start + entry.minutes)}`;
    });

    node.addEventListener('pointerup', async () => {
      if (!drag || drag.node !== node) return;
      const d = endDrag(node, { redraw: false });
      if (!d || !d.active) return;
      if (d.moved) {
        await send({ op: 'move_block', id: entry.id, session: entry.session, day: state.snap.days[0].date, start: d.start, minutes: entry.minutes });
      } else {
        render();
      }
    });

    node.addEventListener('pointercancel', () => {
      if (drag && drag.node === node) endDrag(node, { redraw: true });
    });
  }

  // Once a block is lifted the finger must move it, not the page. The
  // listener has to be non-passive to be allowed to say so.
  document.addEventListener('touchmove', (e) => {
    if (drag && drag.active) e.preventDefault();
  }, { passive: false });

  function laneStyle(placed, fixedHeight) {
    const top = placed.start / 60 * HOUR;
    const height = fixedHeight != null ? fixedHeight : Math.max(22, placed.minutes / 60 * HOUR - 2);
    const width = 100 / placed.columns;
    const left = placed.column * width;
    return `top:${top}px; height:${height}px; left:calc(${left}% + 2px); width:calc(${width}% - 4px)`;
  }

  /* A subscribed event's box. Full width of the lane area rather than in a
     column: it is not competing with the day's blocks for room, it is the
     ground they sit on. */
  /* A subscribed event's box. Side by side with the others from subscribed
     calendars when they overlap, laid out by the server the way the day's own
     entries are — full width was drawing two meetings at the same hour in the
     same rectangle, one unreadable under the other. */
  function spanStyle(event) {
    const top = event.start / 60 * HOUR;
    const height = Math.max(18, (event.end - event.start) / 60 * HOUR - 2);
    const columns = Math.max(1, event.columns || 1);
    const width = 100 / columns;
    const left = (event.column || 0) * width;
    return `top:${top}px; height:${height}px; left:calc(${left}% + 2px); width:calc(${width}% - 4px)`;
  }

  /* All-day events are a row of chips above the timeline, not blocks on it.
     One drawn as a block would claim the whole day and bury it; "we are away
     this week" is a fact about the week, not an hour that is taken. */
  function renderAllDay(day) {
    const row = $('alldayRow');
    if (!row) return;
    row.replaceChildren();
    const bands = (day.subscribed || []).filter((event) => event.all_day);
    row.hidden = bands.length === 0;
    for (const band of bands) {
      row.append(el('div', { class: 'allday', style: `--accent:${band.color}`, text: band.name, title: band.calendar }));
    }
  }

  function renderNow(day) {
    const line = $('nowline');
    if (!day.is_today) { line.hidden = true; return; }
