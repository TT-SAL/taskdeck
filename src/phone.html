<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskDeck">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>TaskDeck</title>
<style>
  :root {
    --bg: #0f1113;
    --surface: #171a1e;
    --surface-2: #1f2328;
    --line: #2a2f36;
    --text: #e8e6e1;
    --muted: #9a9891;
    --faint: #6b6a66;
    --danger: #d1495b;
    --ok: #4f9a94;
    --hour: 56px;
    --gutter: 46px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior-y: contain;
    padding-bottom: calc(72px + var(--safe-bottom));
  }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* ── Masthead ── */
  .mast {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: calc(10px + var(--safe-top)) 14px 8px;
  }
  .mast .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nav { display: flex; gap: 6px; }
  .nav button, .chip {
    min-width: 44px; height: 40px; padding: 0 14px; border-radius: 12px;
    background: var(--surface); color: var(--text); font-weight: 600;
  }
  .nav button:active, .chip:active { background: var(--surface-2); }
  .nav button:disabled { opacity: 0.45; }
  .date { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .weekday { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .weekday.today { color: #f0c36b; }
  .daylabel { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .summary { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 1.3em; }
  .week { display: flex; gap: 4px; margin-top: 10px; }
  .week button {
    flex: 1; height: 44px; border-radius: 10px; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  }
  .week button .wd { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .week button .dn { font-size: 15px; font-weight: 700; color: var(--text); }
  .week button.today .dn { color: #f0c36b; }
  .week button.shown { background: var(--surface); }
  .week button.shown .dn { color: var(--text); }
  .week button.shown.today .dn { color: #f0c36b; }
  .week button:active { background: var(--surface-2); }
  .week .dots { display: flex; gap: 3px; height: 4px; margin-top: 3px; }
  .week .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--c); display: block; }
  textarea.notes {
    width: 100%; min-height: 40vh; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; line-height: 1.4; resize: vertical;
  }
  .behind { margin-top: 8px; }
  .behind button {
    height: 36px; padding: 0 12px; border-radius: 10px; font-weight: 700; font-size: 14px;
    background: #2a2416; color: #f0c36b; border: 1px solid #4a3d1f;
  }
  .behind button:active { filter: brightness(1.2); }

  /* ── Timeline ── */
  .timeline { position: relative; margin: 6px 12px 0 8px; height: calc(var(--hour) * 24); }
  .hourline {
    position: absolute; left: 0; right: 0; height: var(--hour);
    border-top: 1px solid var(--line);
  }
  .hourline.small { opacity: 0.55; }
  .hourline span {
    position: absolute; left: 0; top: -0.6em; width: var(--gutter);
    padding-left: 4px; font-size: 12px; color: var(--faint);
  }
  .lanes { position: absolute; top: 0; bottom: 0; left: var(--gutter); right: 0; }
  .entry {
    position: absolute; border-radius: 8px; overflow: hidden;
    padding: 4px 8px; font-size: 14px; line-height: 1.25;
    border-left: 3px solid var(--accent);
    background: var(--tint);
    color: var(--text);
  }
  .entry .time { font-size: 11px; color: var(--muted); }
  .entry .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry.short { display: flex; gap: 8px; align-items: baseline; padding-top: 2px; }
  .entry.short .name { flex: 1; }
  .entry.routine {
    background: transparent; border: 1px dashed var(--accent); border-left-width: 3px;
    color: var(--muted);
  }
  .entry.routine .name::before { content: "↻ "; }
  .entry.selected { outline: 2px solid var(--text); outline-offset: 1px; }
  .entry:active { filter: brightness(1.2); }
  .entry.dragging {
    z-index: 4; opacity: 0.95; filter: brightness(1.25);
    box-shadow: 0 10px 28px rgba(0,0,0,0.55); outline: 2px solid var(--text); outline-offset: 1px;
    transition: none;
  }
  .ghost {
    position: absolute; border-radius: 8px; padding: 3px 8px;
    border: 1px solid var(--accent); background: rgba(0,0,0,0.25);
    color: var(--faint); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    pointer-events: none; opacity: 0.8;
  }
  /* Somebody else's calendar (§23). Deliberately unlike a block of your own:
     no fill, a bar in the calendar's own colour, and `pointer-events: none`
     so a tap goes to the timeline underneath. Nothing here can be edited,
     so nothing here should invite a tap. */
  /* A block is as tall as its event is long, so the text uses that height
     rather than being cut to one line with an ellipsis — a course summary
     runs past a hundred characters and the room is at the end of it. */
  .subscribed {
    position: absolute; border-radius: 6px; padding: 2px 8px;
    border: 1px dashed var(--accent); border-left: 3px solid var(--accent);
    background: repeating-linear-gradient(135deg,
      rgba(255,255,255,0.045) 0 6px, rgba(255,255,255,0) 6px 12px);
    color: var(--faint); font-size: 12px; overflow: hidden;
    line-height: 1.25; overflow-wrap: anywhere; pointer-events: none;
  }
  /* Where it is, which for a lecture is the room. Its own line because it is
     short and it is the half you actually look for. */
  .subscribed .where { display: block; color: var(--accent); font-size: 11px; }
  /* A course period rather than an appointment: further back still. */
  .subscribed.backdrop { opacity: 0.55; border-style: dotted; background: none; }
  .allday {
    display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
    border-radius: 999px; padding: 2px 9px; margin: 0 6px 4px 0;
    border: 1px solid var(--accent); color: var(--faint); font-size: 12px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .alldayrow { padding: 0 14px 2px; display: flex; flex-wrap: wrap; }
  .marker {
    position: absolute; height: 22px; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text); padding-right: 6px; overflow: hidden;
  }
  .marker::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; border-top: 2px solid var(--accent); }
  .marker .label {
    position: relative; margin-left: 6px; padding: 1px 7px; border-radius: 6px;
    background: var(--accent); color: #0f1113; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .marker.due .label::before { content: "⚑ "; }
  .nowline { position: absolute; left: calc(var(--gutter) - 8px); right: 0; height: 0; border-top: 2px solid #e5484d; z-index: 2; pointer-events: none; }
  .nowline::before { content: ""; position: absolute; left: -4px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: #e5484d; }
  .empty-tap { position: absolute; inset: 0; }

  /* ── Week ── */
  .weekgrid { margin: 6px 6px 0 4px; }
  .weekhead { display: flex; padding-left: 26px; position: sticky; top: 0; z-index: 4; background: var(--bg); }
  .weekhead button {
    flex: 1; min-width: 0; padding: 4px 0 6px; text-align: center; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; line-height: 1.1;
  }
  .weekhead button .wd { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .weekhead button .dn { font-size: 15px; font-weight: 700; color: var(--text); }
  .weekhead button.today .dn { color: #f0c36b; }
  .weekhead button.shown { background: var(--surface); border-radius: 8px; }
  .weekbody { display: flex; position: relative; height: calc(var(--hour) * 24); }
  .weekgutter { width: 26px; flex: 0 0 26px; position: relative; }
  .weekgutter span { position: absolute; left: 0; font-size: 10px; color: var(--faint); transform: translateY(-0.6em); }
  .weekcol {
    flex: 1; min-width: 0; position: relative; border-left: 1px solid var(--line);
    background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour));
  }
  .weekcol.today { background-color: rgba(240, 195, 107, 0.05); }
  .weekcol .empty-tap { position: absolute; inset: 0; }
  .wentry {
    position: absolute; border-radius: 3px; overflow: hidden; padding: 1px 3px;
    font-size: 9px; line-height: 1.15; color: var(--text); white-space: nowrap; text-overflow: ellipsis;
    background: var(--tint); border-left: 2px solid var(--accent); pointer-events: none;
  }
  .wentry.routine { background: transparent; border: 1px dashed var(--accent); border-left-width: 2px; color: var(--muted); }
  .wentry.marker { height: 2px; padding: 0; border: 0; background: var(--accent); }
  .wentry.ghost { background: rgba(0,0,0,0.25); border: 1px solid var(--accent); color: var(--faint); opacity: 0.8; }
  .weeknow { position: absolute; left: 0; right: 0; border-top: 2px solid #e5484d; pointer-events: none; z-index: 2; }

  /* ── Bottom bar ── */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: flex; gap: 10px; padding: 10px 14px calc(10px + var(--safe-bottom));
    background: linear-gradient(rgba(15,17,19,0), var(--bg) 40%);
  }
  .bar button {
    flex: 1; height: 50px; border-radius: 14px; font-weight: 700; font-size: 16px;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
  }
  .bar button.primary { background: #e8e6e1; color: #0f1113; border-color: transparent; flex: 0 0 120px; }
  .bar button:active { filter: brightness(1.2); }
  .count { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 6px; border-radius: 11px; background: var(--surface-2); font-size: 13px; }
  .count.urgent { background: #f0c36b; color: #0f1113; }

  /* ── Sheets ── */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 8; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--surface); border-radius: 18px 18px 0 0;
    padding: 8px 16px calc(16px + var(--safe-bottom));
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 12px; }
  .sheet h2 { margin: 0 0 2px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; word-break: break-word; }
  .sheet h2 button { text-align: left; width: 100%; }
  .sheet h2 input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 18px; font-weight: 700; }
  .kindline { color: var(--muted); font-size: 13px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .section { border-top: 1px solid var(--line); padding: 12px 0; }
  .section h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
  .field label { color: var(--muted); font-size: 14px; }
  .field input, .field select {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; min-height: 40px; color: var(--text); max-width: 60%;
  }
  .field input[type="time"], .field input[type="datetime-local"] { color-scheme: dark; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button, .btn {
    height: 44px; padding: 0 14px; border-radius: 12px; font-weight: 700;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    flex: 1 1 auto;
  }
  .actions button.ok { background: var(--ok); color: #0f1113; border-color: transparent; }
  .actions button.danger { color: var(--danger); }
  .actions button.primary { background: #e8e6e1; color: #0f1113; border-color: transparent; }
  .actions button:active { filter: brightness(1.2); }
  .weekdays { display: flex; gap: 6px; flex-wrap: wrap; }
  .weekdays button {
    width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--line); font-weight: 700; color: var(--muted);
  }
  .weekdays button.on { background: var(--text); color: #0f1113; border-color: transparent; }
  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; height: 38px; border-radius: 9px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--text); color: #0f1113; }

  /* ── Tray ── */
  .quickadd { display: flex; gap: 8px; margin-bottom: 8px; }
  .quickadd input { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 46px; }
  .quickadd button { width: 64px; height: 46px; border-radius: 12px; background: var(--text); color: #0f1113; font-weight: 800; }
  .quickadd button.chip { width: auto; height: 46px; background: var(--surface-2); color: var(--muted); font-weight: 600; padding: 0 12px; }
  .quickadd + .field input { max-width: 100%; }
  .card {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 10px 10px 10px 12px; border-radius: 12px; margin: 6px 0;
    background: var(--surface-2); border-left: 3px solid var(--accent);
  }
  .card .chip { flex: 0 0 auto; min-width: 44px; padding: 0 10px; }
  .card .meta { white-space: normal; }
  .card .body { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card .due-in { font-size: 12px; color: var(--muted); }
  .card .due-in.overdue { color: var(--danger); font-weight: 700; }
  .tray-heading { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin: 14px 0 4px; }
  .tray-heading.urgent { color: #f0c36b; }
  .nothing { color: var(--faint); font-size: 14px; padding: 10px 0; }

  /* ── Banners ── */
  .banner {
    position: fixed; left: 12px; right: 12px; top: calc(12px + var(--safe-top)); z-index: 20;
    background: #2b1d1f; color: #f3c7cc; border: 1px solid #5a2d34; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center;
  }
  .banner.info { background: #1d2530; color: #cfe0f3; border-color: #2f4a63; }
  .banner .actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .banner button { font-weight: 700; padding: 4px 8px; }
  .sheet .waiting {
    margin: 10px 0 2px; padding: 8px 12px; border-radius: 10px; font-size: 13px;
    background: #1d2530; color: #cfe0f3; border: 1px solid #2f4a63;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translateX(-50%);
    background: var(--text); color: #0f1113; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px;
    z-index: 30; max-width: 90vw; text-align: center;
  }
  .gate { padding: 24px 18px; max-width: 420px; margin: 40px auto; }
  .gate p { color: var(--muted); }
  .gate input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="mast">
  <div class="row">
    <div class="nav">
      <button id="prev" aria-label="Previous day">‹</button>
      <button id="todayBtn">Today</button>
      <button id="next" aria-label="Next day">›</button>
      <button id="modeBtn" title="Day or week">Week</button>
    </div>
    <div class="date">
      <div class="weekday" id="weekday">…</div>
      <div class="daylabel" id="daylabel"></div>
    </div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="week" id="week"></div>
  <div class="behind" id="behind" hidden><button id="reflowBtn" title="Push what is unfinished past now, in order, around events and routines"></button></div>
  <!-- All-day events off subscribed calendars: chips, not blocks (§23). -->
  <div class="alldayrow" id="alldayRow" hidden></div>
</header>

<noscript><p style="padding:18px;font:15px/1.5 system-ui;color:#c9c9c9">TaskDeck needs JavaScript. This page is one file and does all its drawing in the browser.</p></noscript>

<main class="timeline" id="timeline">
  <div id="hours"></div>
  <div class="lanes" id="lanes"><div class="empty-tap" id="emptyTap"></div></div>
  <div class="nowline" id="nowline" hidden></div>
</main>

<section class="weekgrid" id="weekgrid" hidden>
  <div class="weekhead" id="weekhead"></div>
  <div class="weekbody" id="weekbody"></div>
</section>

<nav class="bar" id="bar">
  <button id="trayBtn">Tray<span class="count" id="trayCount">0</span></button>
  <button id="notesBtn">Notes</button>
  <button id="newBtn" class="primary">＋ New</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog"></div>
<div class="banner" id="banner" hidden></div>
<div class="gate" id="gate" hidden>
  <h2>TaskDeck</h2>
  <p>This page needs the link from TaskDeck's settings — it carries a token that lets the phone edit your calendar. If you have the token, paste it here.</p>
  <p id="gateNote" hidden></p>
  <input id="gateToken" placeholder="token" autocapitalize="off" autocomplete="off" spellcheck="false">
  <div class="actions"><button class="primary" id="gateGo">Open</button></div>
</div>

<script>
(() => {
  // `replaceChildren` is the newest thing this file needs — Firefox 78,
  // Chrome 86, Safari 14 — and it is used on every render, so on an older
  // engine the page would load, fetch the day, and then show a red banner
  // reading "week.replaceChildren is not a function" instead of a calendar.
  // Four lines buys four years of phones back.
  if (!Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function (...nodes) {
      while (this.firstChild) this.removeChild(this.firstChild);
      if (nodes.length) this.append(...nodes);
    };
  }

  'use strict';

  /* ───────────────────────────── State ───────────────────────────── */

  const HOUR = 56;
  const SNAP = 15;
  const DURATIONS = [15, 30, 45, 60, 90, 120, 150, 180, 240, 300, 360, 420, 480, 600];
  // Used when the desktop's colour scheme is COLORSCHEME ZERO (all transparent):
  // slots 0–4 are urgency, calm to loud; 5 is events.
  const FALLBACK = ['#7a8b96', '#4f9a94', '#c9a227', '#d97b3a', '#d1495b', '#8b7fd6'];
  const TOKEN_KEY = 'taskdeck-token';
  // The board's `NAME_MAX_CHARS`: the inputs stop where the board would refuse.
  const NAME_MAX = 200;

  const state = {
    token: null,
    day: todayIso(),
    snap: null,
    items: new Map(),
    selected: null,      // { id, session }
    sheet: null,         // 'item' | 'tray' | 'new' | 'notes' | null
    newDraft: null,      // { kind, start, minutes, name }
    notesDraft: null,    // unsaved notepad text while the Notes sheet is open
    renaming: false,
    pollTimer: null,
    quickAddDraft: '',
    quickAddDue: null,      // the quick-add's optional due date while shown
    trayTab: 'unplanned',   // 'unplanned' | 'all' | 'done'
    week: { key: null, marks: {}, days: null },   // the shown day's week, keyed by monday + version
    mode: 'day',            // 'day' | 'week'
    notice: null,           // a refusal to show in the banner until acknowledged
  };
  // A refusal is kept until it is acknowledged, reload or not: it is the only
  // trace of an edit that was made here and is not on the board.
  const NOTICE_KEY = 'taskdeck-notice';
  try { state.notice = localStorage.getItem(NOTICE_KEY); } catch (_) {}
  function rememberNotice(text) {
    state.notice = text;
    try {
      if (text) localStorage.setItem(NOTICE_KEY, text);
      else localStorage.removeItem(NOTICE_KEY);
    } catch (_) {}
  }
  try { if (localStorage.getItem('taskdeck-mode') === 'week') state.mode = 'week'; } catch (_) {}

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, children = []) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v);

  };

  /* ───────────────────────────── Helpers ───────────────────────────── */

  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function pad(n) { return String(n).padStart(2, '0'); }

    const [y, m, d] = iso.split('-').map(Number);

  }
  function hhmm(minutes) {

  }
  function timeValue(minutes) {

  }
  function minutesOf(timeText) {
    if (!timeText) return null;

    return h * 60 + m;
  }

  }

  function colorOf(index) {
    const p = state.snap && state.snap.palette && state.snap.palette[index];
    if (p && p[3] > 0) return `rgb(${p[0]}, ${p[1]}, ${p[2]})`;
    return FALLBACK[Math.min(index, 5)];
  }
  function tintOf(index) {
    const p = state.snap && state.snap.palette && state.snap.palette[index];
    if (p && p[3] > 0) return `rgba(${p[0]}, ${p[1]}, ${p[2]}, 0.32)`;

    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);

  function durationOptions(current) {
    const list = DURATIONS.slice();
    if (current && !list.includes(current)) { list.push(current); list.sort((a, b) => a - b); }
    return list;
  }
  function localToText(text) {
    // "2026-09-04T17:00" → "Fri 4 Sep 17:00"
    if (!text) return '';
    const [date, time] = text.split('T');
    const [y, m, d] = date.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return `${dt.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })} ${time}`;
  }

  /* ───────────────────────────── API ───────────────────────────── */

  function readToken() {
    const fromUrl = new URLSearchParams(location.search).get('token');
    if (fromUrl) {
      try { localStorage.setItem(TOKEN_KEY, fromUrl); } catch (_) {}
      return fromUrl;
    }
    try { return localStorage.getItem(TOKEN_KEY); } catch (_) { return null; }
  }

  function installManifest() {
    // The manifest is asked for with the token so a home-screen shortcut opens
    // with it (iOS gives such an app storage of its own).
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = `/manifest.webmanifest?token=${encodeURIComponent(state.token)}`;
    document.head.append(link);
  }

  // A request that never answers — a mobile link that dropped mid-request,
  // a desk asleep behind a firewall that swallows packets — would otherwise
  // hang the page's whole chain of loads and replays. Ordinary requests are
  // given fifteen seconds; the long poll waits for the server's own 25 s and
  // then some. A request that runs out of time counts as unreachable (status
  // 0), so an edit behind it is kept, not lost.
  const REQUEST_TIMEOUT_MS = 15000;
  const WAIT_TIMEOUT_MS = 45000;
  async function api(path, options = {}) {
    const headers = Object.assign({ 'X-TaskDeck-Token': state.token }, options.headers || {});
    if (options.body) headers['Content-Type'] = 'application/json';
    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const limit = path.startsWith('/api/wait') ? WAIT_TIMEOUT_MS : REQUEST_TIMEOUT_MS;
    const timer = controller ? setTimeout(() => controller.abort(), limit) : null;
    try {
      const response = await fetch(path, Object.assign({}, options, { headers, cache: 'no-store', signal: controller ? controller.signal : undefined }));
      // The body is read under the same clock: headers can arrive and the
      // rest never.
      const text = await response.text();
      let payload = null;
      try { payload = text ? JSON.parse(text) : null; } catch (_) {}
      if (!response.ok) {
        const message = (payload && payload.error) || `TaskDeck answered ${response.status}.`;
        throw new ApiError(response.status, message);
      }
      return payload;
    } catch (error) {
      if (error instanceof ApiError) throw error;
      if (controller && controller.signal.aborted) {
        throw new ApiError(0, "TaskDeck did not answer in time. Is it running, and is this phone on a working network?");
      }
      throw new ApiError(0, "Can't reach TaskDeck. Is it running on the desktop, and is this phone on the same network?");
    } finally {
      if (timer) clearTimeout(timer);
    }
  }
  class ApiError extends Error {
    constructor(status, message) { super(message); this.status = status; }
  }

  // The last snapshot of each day is kept on the phone, so a day can still be
  // read — marked as of when — while the server cannot be reached.
  const SNAP_KEY = (day) => `taskdeck-snap-${day}`;
  // How many days' snapshots are kept. A snapshot carries every item and the
  // notepad, so a day browsed months ago is not worth the storage the outbox
  // needs; the oldest go when a new one comes.
  const SNAPS_KEPT = 14;
  function snapKeysOldestLast() {
    const kept = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith('taskdeck-snap-')) continue;
      let at = 0;
      try { at = (JSON.parse(localStorage.getItem(key)) || {}).at || 0; } catch (_) {}
      kept.push({ key, at });
    }
    return kept.sort((a, b) => b.at - a.at);
  }
  function remember(day, snap) {
    try {
      // Never over a newer picture of the same day: two answers can cross.
      const have = recall(day);
      if (have && have.snap && have.snap.version > snap.version) return;
      // Room is made *before* the write, and the outbox's room comes first:
      // a full store would refuse the new day and, worse, the next edit.
      const others = snapKeysOldestLast().filter((entry) => entry.key !== SNAP_KEY(day));
      others.slice(SNAPS_KEPT - 1).forEach((old) => localStorage.removeItem(old.key));
      const text = JSON.stringify({ at: Date.now(), snap });
      try {
        localStorage.setItem(SNAP_KEY(day), text);
      } catch (_) {
        // Still no room: every other day goes, and one more try.
        others.forEach((old) => localStorage.removeItem(old.key));
        localStorage.setItem(SNAP_KEY(day), text);
      }
    } catch (_) {}
  }
  function recall(day) {
    try {
      const raw = localStorage.getItem(SNAP_KEY(day));
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }
  function takeSnapshot(snap) {
    state.snap = snap;
    state.items = new Map(snap.items.map((item) => [item.id, item]));
  }

  // Edits made while TaskDeck cannot be reached are kept here, in order, and
  // sent the next time it answers — before anything newer. Nothing is applied
  // on the phone meanwhile: the page has no board of its own to apply them
  // to, so they are shown as waiting, not as done. A later edit can only name
  // an item the page has seen in a snapshot, so a queued create needs no
  // temporary id — nothing queued after it can refer to it.
  const OUTBOX_KEY = 'taskdeck-outbox';
  function outbox() {
    try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch (_) { return []; }
  }
  function keepOutbox(queue) {
    try {
      if (queue.length) localStorage.setItem(OUTBOX_KEY, JSON.stringify(queue));
      else localStorage.removeItem(OUTBOX_KEY);
      return true;
    } catch (_) { return false; }
  }
  // How many waiting edits name this item — shown in its sheet, since the
  // sheet otherwise reads as if nothing had been done.
  const waitingFor = (id) => outbox().filter((entry) => entry.command.id === id).length;
  // "TaskDeck is not there" rather than "TaskDeck said no": only that keeps
  // an edit waiting. A 5xx is the desk's own trouble — mid-shutdown, its
  // board not answering in time, a disk refusing — never a verdict on the edit.
  const unreachable = (error) => error.status === 0 || error.status >= 500;

  // Every command travels under a key that is the same on each retry of it:
  // TaskDeck keeps its last replies by key and answers a repeat with the
  // first reply rather than applying the command twice — which is what a
  // lost answer, or a 503 from a board that answered late, would otherwise
  // cost (a second task, a second block).
  const REQUEST_HEADER = 'X-TaskDeck-Request';
  function requestKey() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  const post = (command, key) => api('/api/command', { method: 'POST', body: JSON.stringify(command), headers: { [REQUEST_HEADER]: key } });

  // A queued edit in words, for the banner. Named while the item is still in
  // the snapshot, since it may not be by the time the words are read.
  function describe(command) {
    // A restore names an archived row, which the tray's Done list knows.
    const named = command.op === 'restore'
      ? ((state.snap && state.snap.done) || []).find((row) => row.id === command.id && row.archived_at === command.archived_at)
      : state.items.get(command.id);
    const who = named ? `“${named.name}”` : (command.id != null ? `#${command.id}` : 'it');
    switch (command.op) {
      case 'create': case 'quick_add': case 'add': return `add “${command.name}”`;
      case 'rename': return `rename ${who}`;
      case 'complete': return `finish ${who}`;
      case 'delete': return `delete ${who}`;
      case 'move_block': return `move a block of ${who}`;
      case 'add_block': return `book a block for ${who}`;
      case 'remove_block': return `remove a block of ${who}`;
      case 'unplan': return `unplan ${who}`;
      case 'set_estimate': return `change the length of ${who}`;
      case 'set_deadline': return `change the due date of ${who}`;
      case 'set_severity': return `change the severity of ${who}`;
      case 'set_horizon': return `change the horizon of ${who}`;
      case 'set_repeat': return `change the weekdays of ${who}`;
      case 'reflow': return `reflow ${command.day}`;
      case 'set_notes': return 'save the notes';
      case 'restore': return `put back ${who}`;
      default: return command.op;
    }
  }

  function queueEdit(command, key) {
    const queue = outbox();
    queue.push({ command, label: describe(command), at: Date.now(), key: key || requestKey() });
    if (!keepOutbox(queue)) {
      // A browser that allows no storage cannot keep it; say so rather than
      // "kept".
      toast("Can't reach TaskDeck, and this browser lets the page keep nothing — that change is lost");
      return;
    }
    showPending(queue);
    toast('Kept — it is sent when TaskDeck answers');
  }

  let flushing = null;
  // Send what is waiting, in order. Stops at the first sign TaskDeck is still
  // away; anything it refuses is dropped and said, never retried for ever.
  // Answers with how many went and how many are still waiting.
  async function flush() {
    if (flushing) return flushing;

  }
  async function replay() {

      } catch (error) {

        refused.push(`${next.label} — ${error.message}`);
      }
      // Storage is read again before the head is dropped: a Discard, or an
      // edit kept from another path, may have changed it while the POST ran,
      // and neither may be undone by writing a stale copy back.
      const now = outbox();
      if (now.length && now[0].at === next.at && now[0].key === next.key && !keepOutbox(now.slice(1))) {

        // for ever (each repeat would be answered, not applied — the key —
        // but nothing else would ever run).
        break;
      }
      queue = outbox();
    }
    if (refused.length) {
      const lead = refused.length === 1 ? 'A change made here could not be applied' : `${refused.length} changes made here could not be applied`;
      const shown = refused.slice(0, 3).join('; ') + (refused.length > 3 ? `; and ${refused.length - 3} more` : '');
      // An earlier, unacknowledged notice is kept in front of this one.
      rememberNotice(state.notice ? `${state.notice} · ${lead}: ${shown}` : `${lead}: ${shown}`);
    }

  }

  const discardAction = ['Discard', () => {
    if (!confirm('Drop the changes waiting to be sent?')) return;
    keepOutbox([]);
    load();
  }];
  function showPending(queue) {
    const n = queue.length;
    const named = queue.slice(0, 3).map((entry) => entry.label).join(', ') + (n > 3 ? ', …' : '');
    showBanner(`${n} change${n === 1 ? '' : 's'} waiting to be sent: ${named}`, {
      info: true,
      actions: [['Retry', () => load()], discardAction],
    });
  }
  // What the banner says when the day itself loaded: a refusal to
  // acknowledge, edits still waiting, or nothing.
  function settleBanner() {
    if (state.notice) {
      showBanner(state.notice, { actions: [['OK', () => { rememberNotice(null); settleBanner(); }]] });
    } else {
      const queue = outbox();
      if (queue.length) showPending(queue); else hideBanner();
    }
  }

  let loadSeq = 0;
  // Set when a replay sent something, cleared by whichever load draws the
  // board next: the redraw must not be lost with a load that was overtaken.
  let sheetStale = false;
  async function load({ quiet = false } = {}) {
    const replayed = outbox().length ? await flush() : null;
    if (replayed && replayed.sent) sheetStale = true;
    // Two loads can be in flight — › tapped twice, a poll under a swipe. Only
    // the latest one's answer is shown, and a day's cache is keyed by the day
    // the answer is actually for, never by the day selected when it arrived.
    const mine = ++loadSeq;
    const asked = state.day;
    try {
      const snap = await api(`/api/state?from=${asked}&days=1`);
      remember(snap.days[0].date, snap);
      if (mine !== loadSeq || asked !== state.day) return;
      takeSnapshot(snap);
      settleBanner();
      render();
      loadWeek();
      // A sheet is never redrawn under someone's fingers by a background
      // load — except when edits made from it have just gone through, so
      // that it shows what the board now says rather than what it said
      // before them.
      if (sheetStale && state.sheet && !state.renaming) { sheetStale = false; renderSheet(); }
    } catch (error) {
      if (error.status === 401) { showGate(); return; }
      if (mine !== loadSeq || asked !== state.day) return;
      const cached = (!state.snap || state.snap.days[0].date !== state.day) ? recall(state.day) : null;
      const waiting = outbox().length;
      const suffix = waiting ? ` · ${waiting} change${waiting === 1 ? '' : 's'} waiting to be sent` : '';
      const actions = waiting ? [discardAction] : [];
      if (cached) {

      } else {

      }
